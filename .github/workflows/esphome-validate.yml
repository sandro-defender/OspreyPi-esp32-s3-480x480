name: Validate ESPHome configurations

on:
  push:
    paths:
      - "**.yaml"
      - ".github/workflows/esphome-validate.yml"
  pull_request:
    paths:
      - "**.yaml"
      - ".github/workflows/esphome-validate.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    container: esphome/esphome:2026.9.0
    steps:
      - uses: actions/checkout@v4
      - name: Create non-secret validation values
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: validation
          wifi_password: validation-password
          api_encryption_key: 6E5h8zR0kJ7nT2fW4mY9cP3vX8qL1aD6sB5uH0eG7iC=
          api_encryption_key2: 6E5h8zR0kJ7nT2fW4mY9cP3vX8qL1aD6sB5uH0eG7iC=
          latitude: 41.7151
          longitude: 44.8271
          EOF
      - name: Validate Display01
        run: |
          set -o pipefail
          esphome config Display01.yaml 2>&1 | tee /tmp/display01_full.log
          echo "Exit code: $?"
      - name: Validate Display02
        run: |
          set -o pipefail
          esphome config Display02.yaml 2>&1 | tee /tmp/display02_full.log
      - name: Show logs
        if: always()
        run: |
          echo "=== DISPLAY01 TAIL ==="
          tail -n 500 /tmp/display01_full.log || true
          echo "=== DISPLAY02 TAIL ==="
          tail -n 500 /tmp/display02_full.log || true
      - name: Annotate failure details
        if: failure()
        run: |
          echo "=== ANNOTATING FAILURE ==="
          # Get last 300 lines after Failed config
          grep -A 300 "Failed config" /tmp/display01_full.log | head -n 200 | while IFS= read -r line; do
            clean=$(echo "$line" | sed 's/%/%25/g' | sed 's/\r//g' | cut -c1-500)
            echo "::error::${clean}"
          done
          exit 1

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate project version
        id: version
        shell: bash
        run: |
          mapfile -t versions < <(
            sed -nE 's/^[[:space:]]*project_version:[[:space:]]*"([^"]+)".*/\1/p' \
              esphome-modular-lvgl-buttons/common/display.yaml
          )

          if [[ "${#versions[@]}" -ne 1 ]]; then
            echo "Expected exactly one project_version substitution." >&2
            exit 1
          fi

          version="${versions[0]}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Create release and tag when not already published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to publish."
            echo "### Release $VERSION already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            tag_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $VERSION already points to $tag_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
            tag_args=(--verify-tag)
          else
            tag_args=(--target "$GITHUB_SHA")
          fi

          gh release create "$VERSION" \
            "${tag_args[@]}" \
            --title "$VERSION" \
            --generate-notes \
            --latest

          echo "### Published release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION" \
            >> "$GITHUB_STEP_SUMMARY"
