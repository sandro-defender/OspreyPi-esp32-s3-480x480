# Copy this file to secrets.yaml and replace every placeholder.

wifi_ssid: "YOUR_PRIMARY_WIFI"
wifi_password: "YOUR_PRIMARY_WIFI_PASSWORD"

# Optional: uncomment the second network in common/wifi.yaml, then set these.
# wifi_ssid2: "YOUR_SECONDARY_WIFI"
# wifi_password2: "YOUR_SECONDARY_WIFI_PASSWORD"

# Generate one key per display with: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_DISPLAY01_BASE64_KEY"
api_encryption_key2: "REPLACE_WITH_DISPLAY02_BASE64_KEY"

# Used for sunrise/sunset brightness automation.
latitude: 41.7151
longitude: 44.8271
