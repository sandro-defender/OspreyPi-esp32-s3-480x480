---
# Display 02 uses exactly the same firmware and dashboard as Display 01.
# Only its identity, API key, and physical mounting rotation differ.

substitutions:
  device_name: "display02"
  device_friendly_name: "Display 02"
  fallback_ap_ssid: "Display 02 Setup"
  display_rotation: "180"
  display_rotation_index: "2"

  # Optional per-display dashboard overrides (defaults are in dashboards/home.yaml):
  # dashboard_button_1_text: "office"
  # dashboard_button_1_entity: "light.office"
  # dashboard_button_1_action: "light.toggle"
  # dashboard_button_1_icon: "\U000F0335" # mdi-lightbulb

packages:
  display: !include esphome-modular-lvgl-buttons/common/display.yaml
  dashboard: !include esphome-modular-lvgl-buttons/dashboards/home.yaml
  boot: !include esphome-modular-lvgl-buttons/common/lvgl_boot.yaml

api:
  encryption:
    key: !secret api_encryption_key2
