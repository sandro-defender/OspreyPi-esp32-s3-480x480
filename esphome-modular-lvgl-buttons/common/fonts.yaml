---
# Optimized font set - reduced from 11 to 7 fonts for speed and RAM
# Mapping:
# 120 - screensaver time (big clock)
# 72  - AC target temp, weather temp
# 36  - AC +/- buttons, large controls
# 24  - main UI, buttons, weather details
# 20  - settings, info, secondary labels (replaces 20,18,32)
# 14  - small labels, status
# georgian 32 - date (optimized from 48)
# bold_* - screensaver (clock, Georgian date, weather) - DejaVu Sans Bold

font:
  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_120
    size: 120
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_72
    size: 72
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_36
    size: 36
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_24
    size: 24
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_20
    size: 20
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_18
    size: 18
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_14
    size: 14
    bpp: 4

  # Aliases for backward compatibility - point to nearest existing size
  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_32
    size: 32
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_12
    size: 12
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/NotoSansGeorgian.ttf"
    id: georgian_48
    size: 32
    bpp: 4
    glyphs:
      - " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "აბგდევზთიკლმნოპჟრსტუფქღყშჩცძწჭხჯჰ"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/NotoSansGeorgian.ttf"
    id: georgian_32
    size: 32
    bpp: 4
    glyphs:
      - " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "აბგდევზთიკლმნოპჟრსტუფქღყშჩცძწჭხჯჰ"

  # ── Bold screensaver set (DejaVu Sans Bold) ────────────────────────────────
  # Used by the screensaver: big clock + Georgian date + weather readout.
  # DejaVu Sans Bold covers the full Georgian Mkhedruli block and Latin.
  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_time_144
    size: 144
    bpp: 4
    glyphs:
      - "0123456789:"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_geo_32
    size: 32
    bpp: 4
    glyphs:
      - "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"
      - "აბგდევზთიკლმნოპჟრსტუფქღყშჩცძწჭხჯჰ"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_72
    size: 72
    bpp: 4
    glyphs:
      - "0123456789°-"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_24
    size: 24
    bpp: 4
    glyphs:
      - "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_20
    size: 20
    bpp: 4
    glyphs:
      - "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"
