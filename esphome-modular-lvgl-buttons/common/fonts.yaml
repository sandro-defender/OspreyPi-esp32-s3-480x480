---
# Optimized font set - v2.4: reduced to the fonts actually referenced in the UI
# (nunito_120, nunito_32, georgian_48 and georgian_32 had zero references and
# were removed - each compiled font costs flash + rodata cache/PSRAM pressure).
# Mapping:
# 72  - AC target temp, weather temp
# 36  - AC +/- buttons, large controls
# 24  - main UI, buttons, weather details
# 20  - settings, info, secondary labels
# 18  - small buttons/captions
# 14  - small labels, status
# 12  - tiny status line on the settings page
# georgian - covered by DejaVu Sans Bold below (bold_geo_32, used by the
#            screensaver date); the standalone NotoSansGeorgian fonts were
#            unused and removed
# bold_* - screensaver (clock, Georgian date, weather) - DejaVu Sans Bold

font:
  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_72
    size: 72
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_36
    size: 36
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_24
    size: 24
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_20
    size: 20
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_18
    size: 18
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_14
    size: 14
    bpp: 4

  - file: "esphome-modular-lvgl-buttons/assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_12
    size: 12
    bpp: 4

  # ── Bold screensaver set (DejaVu Sans Bold) ────────────────────────────────
  # Used by the screensaver: big clock + Georgian date + weather readout.
  # DejaVu Sans Bold covers the full Georgian Mkhedruli block and Latin.
  # Sizes are the measured maxima that still fit 480px:
  #   clock  148px -> ink 458px widest "00:00"   (~11px margin each side)
  #   date    32px -> ink 458px longest "ოთხშაბათი, 10 თებერვალი"
  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_time_148
    size: 148
    bpp: 4
    glyphs:
      - "0123456789:"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_geo_32
    size: 32
    bpp: 4
    glyphs:
      - "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"
      - "აბგდევზთიკლმნოპჟრსტუფქღყშჩცძწჭხჯჰ"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_96
    size: 96
    bpp: 4
    glyphs:
      - "0123456789°-"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_28
    size: 28
    bpp: 4
    glyphs:
      - "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"

  - file: "esphome-modular-lvgl-buttons/assets/fonts/DejaVuSans-Bold.ttf"
    id: bold_24
    size: 24
    bpp: 4
    glyphs:
      - "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"
