---
# Optimized assets - reduced image sizes for speed

font:
  - file: "esphome-modular-lvgl-buttons/assets/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_40
    size: 40
    bpp: 4
    glyphs:
      - $mdi_lightbulb
      - $mdi_ceiling_light
      - $mdi_lamp
      - $mdi_floor_lamp
      - $mdi_string_lights
      - $mdi_track_light
      - $mdi_bulkhead_light
      - $mdi_led_strip
      - $mdi_coach_lamp
      - $mdi_ceiling_fan_light
      - $mdi_bed
      - $mdi_white_balance_sunny
      - $mdi_brightness_6
      - $mdi_home
      - $mdi_weather_night
      - $mdi_movie
      - $mdi_sofa
      - $mdi_silverware_fork_knife
      - $mdi_play_pause
      - $mdi_play
      - $mdi_pause
      - $mdi_location_exit
      - $mdi_fan
      - $mdi_air_conditioner
      - $mdi_cog
      - $mdi_information_outline

  # Compact icon set for AC buttons / info rows (3-line buttons, small badges)
  - file: "esphome-modular-lvgl-buttons/assets/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_22
    size: 22
    bpp: 4
    glyphs:
      - $mdi_power
      - $mdi_snowflake
      - $mdi_fire
      - $mdi_water
      - $mdi_fan
      - $mdi_fan_auto
      - $mdi_swap_horizontal
      - $mdi_leaf
      - $mdi_moon_waning_crescent
      - $mdi_rocket
      - $mdi_account
      - $mdi_arrow_left
      - $mdi_restart
      - $mdi_home
      - $mdi_thermometer
      - $mdi_weather_windy

  - file: "esphome-modular-lvgl-buttons/assets/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_80
    size: 80
    bpp: 4
    glyphs:
      - $mdi_play_pause
      - $mdi_play
      - $mdi_pause

image:
  - platform: file
    file: esphome-modular-lvgl-buttons/assets/images/light/lightbulb.png
    id: lightbulb_image
    resize: 80x80
    type: RGB565

  - platform: file
    file: esphome-modular-lvgl-buttons/assets/bg/ota-dark.jpeg
    id: screensaver_bg_image2
    resize: 480x480
    type: RGB565

  - platform: file
    file: esphome-modular-lvgl-buttons/assets/bg/bg1.jpg
    id: screensaver_bg_image3
    resize: 480x480
    type: RGB565

  - platform: file
    file: esphome-modular-lvgl-buttons/assets/bg/sync4-dark.jpeg
    id: sync4
    resize: 480x480
    type: RGB565
