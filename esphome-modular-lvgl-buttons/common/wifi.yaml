---
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10

    # Optional backup network. Uncomment this block and add the matching
    # secrets only when a second access point is available.
    # - ssid: !secret wifi_ssid2
    #   password: !secret wifi_password2
    #   priority: 5

  # PERF v2.5: with a single known AP, fast_connect skips the full channel
  # scan at boot -> WiFi associates in ~1-2 s instead of ~5-8 s.
  # Trade-off: no scan = no roaming to another AP and the commented backup
  # network block below cannot be used. Revert to false if you add a 2nd AP.
  #options: stable: false (scan) | fast: true (applied, single AP)
  fast_connect: true
  reboot_timeout: 30min
  power_save_mode: none

  ap:
    ssid: "${fallback_ap_ssid}"
    password: ""

captive_portal:

# Optional local configuration UI. Home Assistant remains the recommended UI.
# web_server:
#   port: 80
#   version: 3
