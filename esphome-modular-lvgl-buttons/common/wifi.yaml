---
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password2
      priority: 5

  # Scanning is required for reliable failover between the two configured APs.
  fast_connect: false
  reboot_timeout: 30min
  power_save_mode: none

  ap:
    ssid: "${fallback_ap_ssid}"
    password: ""

captive_portal:

# Optional local configuration UI. Home Assistant remains the recommended UI.
