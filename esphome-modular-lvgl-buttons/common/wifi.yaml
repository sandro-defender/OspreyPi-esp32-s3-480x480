---
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10

    # Optional backup network. Uncomment this block and add the matching
    # secrets only when a second access point is available.
    # - ssid: !secret wifi_ssid2
    #   password: !secret wifi_password2
    #   priority: 5

  # Scanning keeps roaming/recovery reliable and supports the optional backup.
  fast_connect: false
  reboot_timeout: 30min
  power_save_mode: none

  ap:
    ssid: "${fallback_ap_ssid}"
    password: ""

captive_portal:

# Optional local configuration UI. Home Assistant remains the recommended UI.
# web_server:
#   port: 80
#   version: 3
