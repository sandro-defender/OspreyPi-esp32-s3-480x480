---
# Optimized runtime with 3 selectable themes: Classic, Modern, Performance
sun:
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunset:
    - elevation: -3.5°
      then:
        - select.set:
            id: brightness_mode
            option: "Evening"
  on_sunrise:
    - then:
        - select.set:
            id: brightness_mode
            option: "Day"

time:
  - platform: homeassistant
    id: system_time
    timezone: "${timezone}"
    on_time_sync:
      - if:
          condition:
            lambda: 'return id(device_last_restart).state.empty();'
          then:
            - text_sensor.template.publish:
                id: device_last_restart
                state: !lambda 'return id(system_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
      - script.execute: time_update
    on_time:
      - seconds: 0
        minutes: "${screen_night_minute}"
        hours: "${screen_night_hour}"
        then:
          - select.set:
              id: brightness_mode
              option: "Night"
      - minutes: "*"
        seconds: 0
        then:
          - script.execute: time_update

script:
  - id: apply_display_brightness
    mode: restart
    then:
      - lambda: |-
          float brightness = 1.0f;
          std::string mode = id(brightness_mode).current_option();
          if (mode == "Day") {
            float v = id(day_brightness).state;
            if (std::isnan(v)) v = ${daytime_brightness_default};
            brightness = std::clamp(v / 100.0f, 0.05f, 1.0f);
          } else if (mode == "Evening") {
            float v = id(evening_brightness).state;
            if (std::isnan(v)) v = ${evening_brightness_default};
            brightness = std::clamp(v / 100.0f, 0.05f, 1.0f);
          } else {
            float v = id(night_brightness).state;
            if (std::isnan(v)) v = ${nighttime_brightness_default};
            brightness = std::clamp(v / 100.0f, 0.01f, 1.0f);
          }
          auto call = id(display_backlight).turn_on();
          call.set_brightness(brightness);
          call.perform();
      - script.execute: update_settings_highlight

  - id: wake_display
    mode: restart
    then:
      - lvgl.resume
      - script.execute: apply_display_brightness

  - id: apply_display_theme
    mode: restart
    then:
      - lambda: |-
          std::string theme = id(current_theme).current_option();
          // Default to Classic if empty
          if (theme.empty()) theme = "Classic";

          // Helper to set obj bg
          auto set_bg = [](lv_obj_t* obj, uint32_t color) {
            if (!obj) return;
            lv_obj_set_style_bg_color(obj, lv_color_hex(color), 0);
            lv_obj_set_style_bg_opa(obj, LV_OPA_COVER, 0);
          };
          auto set_text = [](lv_obj_t* obj, uint32_t color) {
            if (!obj) return;
            lv_obj_set_style_text_color(obj, lv_color_hex(color), 0);
          };

          uint32_t page_bg = 0x000000;
          uint32_t settings_bg = 0x11151C;
          uint32_t info_bg = 0x11151C;
          uint32_t button_bg = 0x343645;
          uint32_t button_radius = 14;
          uint32_t pad = 10;

          if (theme == "Classic") {
            page_bg = 0x000000;
            settings_bg = 0x11151C;
            info_bg = 0x11151C;
            button_bg = 0x343645;
            button_radius = 14;
          } else if (theme == "Modern") {
            page_bg = 0x0A0E14;
            settings_bg = 0x121A26;
            info_bg = 0x0F141E;
            button_bg = 0x1E232E;
            button_radius = 20;
          } else if (theme == "Performance") {
            page_bg = 0x000000;
            settings_bg = 0x000000;
            info_bg = 0x000000;
            button_bg = 0x1A1A1A;
            button_radius = 4;
          }

          // Apply to main pages
          if (id(main_page)) {
            lv_obj_set_style_bg_color(id(main_page), lv_color_hex(page_bg), 0);
            lv_obj_set_style_bg_opa(id(main_page), LV_OPA_COVER, 0);
            lv_obj_set_style_pad_all(id(main_page), theme=="Performance" ? 2 : (theme=="Modern" ? 6 : 4), 0);
          }
          if (id(settings_page)) {
            lv_obj_set_style_bg_color(id(settings_page), lv_color_hex(settings_bg), 0);
            lv_obj_set_style_bg_opa(id(settings_page), LV_OPA_COVER, 0);
          }
          if (id(info_screen)) {
            lv_obj_set_style_bg_color(id(info_screen), lv_color_hex(info_bg), 0);
            lv_obj_set_style_bg_opa(id(info_screen), LV_OPA_COVER, 0);
          }
          if (id(ac_main_page)) {
            uint32_t ac_bg = (theme=="Modern") ? 0x080A0F : 0x0F1115;
            if (theme=="Performance") ac_bg = 0x000000;
            lv_obj_set_style_bg_color(id(ac_main_page), lv_color_hex(ac_bg), 0);
            lv_obj_set_style_bg_opa(id(ac_main_page), LV_OPA_COVER, 0);
          }
          // Update page_style for future pages
          lv_obj_set_style_bg_color(id(main_page), lv_color_hex(page_bg), 0);

          // Apply to dashboard buttons - Classic vs Modern vs Performance
          lv_obj_t* buttons[] = {
            id(button_button_1),
            id(button_button_2),
            id(button_button_3),
            id(button_button_4),
            id(button_ac_nav),
            id(button_button_5),
            id(button_button_6),
            id(button_button_7),
            id(dashboard_settings_button),
            id(button_button_9)
          };
          lv_obj_t* icons[] = {
            id(icon_button_1),
            id(icon_button_2),
            id(icon_button_3),
            id(icon_button_4),
            id(icon_ac_nav),
            id(icon_button_5),
            id(icon_button_6),
            id(icon_button_7),
            nullptr, // settings has mdi_cog not icon_*
            id(icon_button_9)
          };
          lv_obj_t* labels[] = {
            id(label_button_1),
            id(label_button_2),
            id(label_button_3),
            id(label_button_4),
            id(label_ac_nav),
            nullptr,
            id(label_button_6),
            id(label_button_7),
            nullptr,
            id(label_button_9)
          };
          for (int i=0;i<10;i++) {
            auto btn = buttons[i];
            if (!btn) continue;
            lv_obj_set_style_bg_color(btn, lv_color_hex(button_bg), 0);
            lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(btn, button_radius, 0);
            lv_obj_set_style_border_width(btn, 0, 0);
            lv_obj_set_style_shadow_width(btn, 0, 0);
            lv_obj_set_style_pad_all(btn, theme=="Performance" ? 6 : (theme=="Modern" ? 14 : 10), 0);
            if (theme=="Modern") {
              lv_obj_set_style_text_color(btn, lv_color_hex(0xCCCCCC), 0);
            } else if (theme=="Performance") {
              lv_obj_set_style_text_color(btn, lv_color_hex(0xFFFFFF), 0);
            } else {
              lv_obj_set_style_text_color(btn, lv_color_hex(0xFFFFFF), 0);
            }
            // Icon color - Modern orange glow like mockup
            auto icon = icons[i];
            if (icon) {
              if (theme=="Modern") {
                lv_obj_set_style_text_color(icon, lv_color_hex(0xFF8C00), 0);
                // Add subtle shadow for glow effect in Modern
                lv_obj_set_style_text_opa(icon, LV_OPA_COVER, 0);
              } else if (theme=="Performance") {
                lv_obj_set_style_text_color(icon, lv_color_hex(0xFFFFFF), 0);
              } else {
                lv_obj_set_style_text_color(icon, lv_color_hex(0xFFFFFF), 0);
              }
            }
            auto lbl = labels[i];
            if (lbl) {
              if (theme=="Modern") lv_obj_set_style_text_color(lbl, lv_color_hex(0x9BA2BC), 0);
              else if (theme=="Performance") lv_obj_set_style_text_color(lbl, lv_color_hex(0xCCCCCC), 0);
              else lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);
            }
          }
          // Special handling for AC nav icon
          if (id(icon_ac_nav)) {
            if (theme=="Modern") lv_obj_set_style_text_color(id(icon_ac_nav), lv_color_hex(0xFF8C00), 0);
          }

          // Update AC page buttons for Modern theme colors
          if (theme=="Modern") {
            // AC page will be colored by its own sensors, but set base
            if (id(ac_main_power_btn)) lv_obj_set_style_radius(id(ac_main_power_btn), 16, 0);
            if (id(ac_main_mode_btn)) lv_obj_set_style_radius(id(ac_main_mode_btn), 16, 0);
            if (id(ac_main_fan_btn)) lv_obj_set_style_radius(id(ac_main_fan_btn), 16, 0);
            if (id(ac_main_swing_btn)) lv_obj_set_style_radius(id(ac_main_swing_btn), 16, 0);
            if (id(ac_main_eco_btn)) lv_obj_set_style_radius(id(ac_main_eco_btn), 16, 0);
            if (id(ac_main_sleep_btn)) lv_obj_set_style_radius(id(ac_main_sleep_btn), 16, 0);
            if (id(ac_main_turbo_btn)) lv_obj_set_style_radius(id(ac_main_turbo_btn), 16, 0);
          } else if (theme=="Performance") {
            if (id(ac_main_power_btn)) lv_obj_set_style_radius(id(ac_main_power_btn), 6, 0);
            if (id(ac_main_mode_btn)) lv_obj_set_style_radius(id(ac_main_mode_btn), 6, 0);
            if (id(ac_main_fan_btn)) lv_obj_set_style_radius(id(ac_main_fan_btn), 6, 0);
            if (id(ac_main_swing_btn)) lv_obj_set_style_radius(id(ac_main_swing_btn), 6, 0);
            if (id(ac_main_eco_btn)) lv_obj_set_style_radius(id(ac_main_eco_btn), 6, 0);
            if (id(ac_main_sleep_btn)) lv_obj_set_style_radius(id(ac_main_sleep_btn), 6, 0);
            if (id(ac_main_turbo_btn)) lv_obj_set_style_radius(id(ac_main_turbo_btn), 6, 0);
          } else {
            if (id(ac_main_power_btn)) lv_obj_set_style_radius(id(ac_main_power_btn), 12, 0);
            if (id(ac_main_mode_btn)) lv_obj_set_style_radius(id(ac_main_mode_btn), 12, 0);
            if (id(ac_main_fan_btn)) lv_obj_set_style_radius(id(ac_main_fan_btn), 12, 0);
            if (id(ac_main_swing_btn)) lv_obj_set_style_radius(id(ac_main_swing_btn), 12, 0);
            if (id(ac_main_eco_btn)) lv_obj_set_style_radius(id(ac_main_eco_btn), 12, 0);
            if (id(ac_main_sleep_btn)) lv_obj_set_style_radius(id(ac_main_sleep_btn), 12, 0);
            if (id(ac_main_turbo_btn)) lv_obj_set_style_radius(id(ac_main_turbo_btn), 12, 0);
          }

          ESP_LOGD("theme", "Applied theme: %s", theme.c_str());

      - lvgl.style.update:
          id: page_style
          bg_color: !lambda |-
            std::string t = id(current_theme).current_option();
            if (t=="Modern") return 0x0A0E14;
            if (t=="Performance") return 0x000000;
            return 0x000000;
          text_color: !lambda |-
            return 0xFFFFFF;
      - script.execute: update_settings_highlight
      - lvgl.widget.redraw:

  - id: apply_display_rotation
    mode: restart
    then:
      - lambda: |-
          std::string r = id(display_rotation_select).current_option();
          lvgl::RotationType rot = lvgl::ROTATION_0_DEGREES;
          if (r == "90") rot = lvgl::ROTATION_90_DEGREES;
          else if (r == "180") rot = lvgl::ROTATION_180_DEGREES;
          else if (r == "270") rot = lvgl::ROTATION_270_DEGREES;
          id(lvgl_component).set_rotation(rot);
      - script.execute: update_settings_highlight

  - id: update_settings_highlight
    mode: restart
    then:
      - lambda: |-
          auto set_btn = [](lv_obj_t* btn, bool active, std::string theme) {
            if (!btn) return;
            uint32_t active_bg = 0xFF9F1C;
            uint32_t inactive_bg = 0x3A4352;
            if (theme=="Modern") {
              active_bg = 0xFF8C00;
              inactive_bg = 0x1E232E;
            } else if (theme=="Performance") {
              active_bg = 0x444444;
              inactive_bg = 0x1A1A1A;
            }
            if (active) {
              lv_obj_set_style_bg_color(btn, lv_color_hex(active_bg), 0);
              lv_obj_set_style_text_color(btn, lv_color_white(), 0);
            } else {
              lv_obj_set_style_bg_color(btn, lv_color_hex(inactive_bg), 0);
              lv_obj_set_style_text_color(btn, lv_color_hex(0xCCCCCC), 0);
            }
          };
          std::string bmode = id(brightness_mode).current_option();
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme="Classic";

          set_btn(id(settings_btn_day), bmode=="Day", theme);
          set_btn(id(settings_btn_evening), bmode=="Evening", theme);
          set_btn(id(settings_btn_night), bmode=="Night", theme);

          set_btn(id(settings_btn_classic), theme=="Classic", theme);
          set_btn(id(settings_btn_modern), theme=="Modern", theme);
          set_btn(id(settings_btn_performance), theme=="Performance", theme);

          std::string rot = id(display_rotation_select).current_option();
          set_btn(id(settings_btn_rot0), rot=="0", theme);
          set_btn(id(settings_btn_rot90), rot=="90", theme);
          set_btn(id(settings_btn_rot180), rot=="180", theme);
          set_btn(id(settings_btn_rot270), rot=="270", theme);

lvgl:
  buffer_size: "${lvgl_buffer_size}"
  refresh_interval: "${lvgl_refresh_interval}"
  rotation: "${display_rotation}"
  log_level: NONE
  on_boot:
    - script.execute: apply_display_theme
    - script.execute: apply_display_rotation
    - script.execute: apply_display_brightness
  on_idle:
    timeout: !lambda |-
      float seconds = id(screen_timeout).state;
      if (std::isnan(seconds) || seconds < 5.0f) seconds = ${screen_timeout_default};
      return static_cast<uint32_t>(seconds * 1000.0f);
    then:
      - if:
          condition:
            switch.is_on: screensaver_enabled
          then:
            - lvgl.page.show: screensaver_page
            - script.execute: time_update
            - if:
                condition:
                  lambda: 'return id(brightness_mode).current_option() == "Night";'
                then:
                  - light.turn_off: display_backlight
                else:
                  - script.execute: apply_display_brightness

touchscreen:
  on_touch:
    then:
      - script.execute: wake_display
