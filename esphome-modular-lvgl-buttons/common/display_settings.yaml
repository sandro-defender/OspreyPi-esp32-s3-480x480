---
# Optimized runtime display behaviour - faster, leaner
sun:
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunset:
    - elevation: -3.5°
      then:
        - select.set:
            id: brightness_mode
            option: "Evening"
  on_sunrise:
    - then:
        - select.set:
            id: brightness_mode
            option: "Day"

time:
  - platform: homeassistant
    id: system_time
    timezone: "${timezone}"
    on_time_sync:
      - if:
          condition:
            lambda: 'return id(device_last_restart).state.empty();'
          then:
            - text_sensor.template.publish:
                id: device_last_restart
                state: !lambda 'return id(system_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
      - script.execute: time_update
    on_time:
      - seconds: 0
        minutes: "${screen_night_minute}"
        hours: "${screen_night_hour}"
        then:
          - select.set:
              id: brightness_mode
              option: "Night"
      - minutes: "*"
        seconds: 0
        then:
          - script.execute: time_update

script:
  - id: apply_display_brightness
    mode: restart
    then:
      - lambda: |-
          float brightness = 1.0f;
          std::string mode = id(brightness_mode).current_option();
          if (mode == "Day") {
            float v = id(day_brightness).state;
            if (std::isnan(v)) v = ${daytime_brightness_default};
            brightness = std::clamp(v / 100.0f, 0.05f, 1.0f);
          } else if (mode == "Evening") {
            float v = id(evening_brightness).state;
            if (std::isnan(v)) v = ${evening_brightness_default};
            brightness = std::clamp(v / 100.0f, 0.05f, 1.0f);
          } else {
            float v = id(night_brightness).state;
            if (std::isnan(v)) v = ${nighttime_brightness_default};
            brightness = std::clamp(v / 100.0f, 0.01f, 1.0f);
          }
          auto call = id(display_backlight).turn_on();
          call.set_brightness(brightness);
          call.perform();
      - script.execute: update_settings_highlight

  - id: wake_display
    mode: restart
    then:
      - lvgl.resume
      - script.execute: apply_display_brightness

  - id: apply_display_theme
    mode: restart
    then:
      - lambda: |-
          bool is_dark = (id(current_theme).current_option() == "Dark");
          if (is_dark) {
            lv_obj_set_style_bg_color(id(main_page), lv_color_hex(0x000000), 0);
            lv_obj_set_style_text_color(id(main_page), lv_color_white(), 0);
          } else {
            lv_obj_set_style_bg_color(id(main_page), lv_color_hex(0xE8EEF5), 0);
            lv_obj_set_style_text_color(id(main_page), lv_color_black(), 0);
          }
      - lvgl.style.update:
          id: page_style
          bg_color: !lambda |-
            return (id(current_theme).current_option() == "Dark") ? 0x000000 : 0xE8EEF5;
          text_color: !lambda |-
            return (id(current_theme).current_option() == "Dark") ? 0xFFFFFF : 0x000000;
      - script.execute: update_settings_highlight

  - id: apply_display_rotation
    mode: restart
    then:
      - lambda: |-
          std::string r = id(display_rotation_select).current_option();
          lvgl::RotationType rot = lvgl::ROTATION_0_DEGREES;
          if (r == "90") rot = lvgl::ROTATION_90_DEGREES;
          else if (r == "180") rot = lvgl::ROTATION_180_DEGREES;
          else if (r == "270") rot = lvgl::ROTATION_270_DEGREES;
          id(lvgl_component).set_rotation(rot);
      - script.execute: update_settings_highlight

  - id: update_settings_highlight
    mode: restart
    then:
      - lambda: |-
          // Highlight active buttons in fast settings UI
          auto set_btn = [](lv_obj_t* btn, bool active) {
            if (!btn) return;
            if (active) {
              lv_obj_set_style_bg_color(btn, lv_color_hex(0xFF9F1C), 0);
              lv_obj_set_style_text_color(btn, lv_color_white(), 0);
            } else {
              lv_obj_set_style_bg_color(btn, lv_color_hex(0x3A4352), 0);
              lv_obj_set_style_text_color(btn, lv_color_hex(0xCCCCCC), 0);
            }
          };
          std::string bmode = id(brightness_mode).current_option();
          set_btn(id(settings_btn_day), bmode=="Day");
          set_btn(id(settings_btn_evening), bmode=="Evening");
          set_btn(id(settings_btn_night), bmode=="Night");

          std::string theme = id(current_theme).current_option();
          set_btn(id(settings_btn_dark), theme=="Dark");
          set_btn(id(settings_btn_light), theme=="Light");

          std::string rot = id(display_rotation_select).current_option();
          set_btn(id(settings_btn_rot0), rot=="0");
          set_btn(id(settings_btn_rot90), rot=="90");
          set_btn(id(settings_btn_rot180), rot=="180");
          set_btn(id(settings_btn_rot270), rot=="270");

lvgl:
  buffer_size: "${lvgl_buffer_size}"
  refresh_interval: "${lvgl_refresh_interval}"
  rotation: "${display_rotation}"
  log_level: NONE
  on_boot:
    - script.execute: apply_display_theme
    - script.execute: apply_display_rotation
    - script.execute: apply_display_brightness
  on_idle:
    timeout: !lambda |-
      float seconds = id(screen_timeout).state;
      if (std::isnan(seconds) || seconds < 5.0f) seconds = ${screen_timeout_default};
      return static_cast<uint32_t>(seconds * 1000.0f);
    then:
      - if:
          condition:
            switch.is_on: screensaver_enabled
          then:
            - lvgl.page.show: screensaver_page
            - script.execute: time_update
            - if:
                condition:
                  lambda: 'return id(brightness_mode).current_option() == "Night";'
                then:
                  - light.turn_off: display_backlight
                else:
                  - script.execute: apply_display_brightness

touchscreen:
  on_touch:
    then:
      - script.execute: wake_display
