---
# Optimized theme - minimal shadows, fast rendering
lvgl:
  page_wrap: true
  log_level: NONE
  theme:
    obj:
      border_width: 0
      scrollable: false
      pad_all: 0
      radius: 0
      bg_opa: transp
      shadow_width: 0
    label:
      border_width: 0
      scrollable: false
      text_color: white
      shadow_width: 0
    image:
      border_width: 0
      scrollable: false
      shadow_width: 0
    button:
      text_font: $text_font
      checkable: false
      press_lock: false
      scroll_on_focus: false
      radius: 14px
      width: $button_width
      height: $button_height_single
      pad_all: 10px
      border_width: 0
      shadow_width: 0
      bg_opa: cover
      bg_color: $button_off_color
      text_color: $label_off_color
      pressed:
        bg_color: 0xFF9F1C
        border_width: 0

  style_definitions:
    - id: page_style
      bg_color: black
      bg_opa: cover
      text_color: white
      pad_all: 4px
      shadow_width: 0
      border_width: 0
