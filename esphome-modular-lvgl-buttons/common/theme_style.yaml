---
# Shared LVGL theme. Runtime Dark/Light switching is handled by
# common/display_settings.yaml and the select on pages/settings.yaml.

lvgl:
  page_wrap: true
  theme:
    obj:
      border_width: 0
      scrollable: false
      pad_all: 0
      radius: 0
      bg_opa: transp
    label:
      border_width: 0
      scrollable: false
      text_color: black
    image:
      border_width: 0
      scrollable: false
    button:
      text_font: $text_font
      checkable: false
      press_lock: false
      scroll_on_focus: true
      radius: 20px
      width: $button_width
      height: $button_height_single
      pad_all: 14px
      border_width: 1
      border_color: steel_blue
      shadow_width: 10
      shadow_color: black
      shadow_opa: 60%
      shadow_offset_y: 4
      bg_opa: cover
      bg_color: $button_off_color
      text_color: $label_off_color

  style_definitions:
    - id: page_style
      bg_color: black
      bg_opa: cover
      text_color: white
      # Fixed 150px cards preserve the original 3-column layout.
      pad_all: 5px
