---
# ── Modern theme (theme 2) ───────────────────────────────────────────────────
# Mockup look: dark navy surfaces, raised "3D" tile faces (vertical gradient +
# 1px bevel + drop shadow) and neon glow rings for active/colored states.
# Ref: docs/images/theme_modern_*.png, screen_ac.png, screen_light.png

substitutions:
  modern_bg: "0x0A0E14"
  modern_page_bg: "0x0A0E14"
  modern_settings_bg: "0x121A26"
  modern_info_bg: "0x0F141E"
  modern_ac_bg: "0x080A0F"
  modern_ac_topbar_bg: "0x12151E"
  modern_button_bg: "0x1E232E"
  modern_button_face_top: "0x323B4D"
  modern_button_face_bottom: "0x1A212C"
  modern_button_bevel: "0x3D4658"
  modern_button_active: "0xFF8C00"
  modern_button_green: "0x00E676"
  modern_button_blue: "0x29B6F6"
  modern_button_orange: "0xFF6D00"
  modern_text: "0xFFFFFF"
  modern_text_dim: "0x9BA2BC"
  modern_text_muted: "0xBBBBBB"
  modern_text_accent: "0xFF8C00"
  modern_row_bg: "0x1E2530"
  modern_row_bg_alt: "0x151A24"
  modern_selector_off: "0x3A4352"
  modern_slider_bg: "0x2A303E"
  modern_slider_active: "0xFF8C00"
  modern_radius: "20"
  modern_radius_card: "18"
  modern_pad: "14"

lvgl:
  gradients:
    # Vertical "raised face" gradient behind Modern buttons
    - id: depth_face_gradient
      direction: ver
      stops:
        - color: 0x323B4D
          position: 0
        - color: 0x1A212C
          position: 255

  style_definitions:
    - id: theme_modern_page
      bg_color: 0x0A0E14
      bg_opa: cover
      text_color: white
      pad_all: 6
      border_width: 0
      shadow_width: 0
      radius: 0

    - id: theme_modern_button
      bg_color: 0x1E232E
      bg_opa: cover
      text_color: 0xCCCCCC
      radius: 20
      border_width: 0
      shadow_width: 0
      pad_all: 14

    - id: theme_modern_button_active
      bg_color: 0xFF8C00
      bg_opa: cover
      text_color: white
      radius: 20
      border_width: 0
      shadow_width: 0
      pad_all: 14

    # ── Raised "3D" tile face ────────────────────────────────────────────
    # Applied with lv_obj_add_style() so widgets keep their own radius/pad.
    - id: depth_dark
      bg_grad: depth_face_gradient
      bg_grad_dir: ver
      bg_main_stop: 255
      bg_grad_stop: 255
      bg_opa: cover
      border_width: 1
      border_color: 0x3D4658
      border_opa: 100%
      shadow_width: 14
      shadow_opa: 55%
      shadow_color: 0x000000
      shadow_offset_y: 5

    # Soft neutral glow (e.g. −/+ steppers on the AC page)
    - id: glow_soft
      border_width: 1
      border_color: 0x4A5468
      border_opa: 100%
      shadow_width: 18
      shadow_opa: 45%
      shadow_color: 0x9BA2BC
      shadow_offset_y: 0

    # Colored glows for active fills (Power ON green, Mode cool blue, Turbo orange)
    - id: glow_green
      border_width: 2
      border_color: 0x69F0AE
      border_opa: 55%
      shadow_width: 22
      shadow_opa: 75%
      shadow_color: 0x00E676
      shadow_offset_y: 0

    - id: glow_blue
      border_width: 2
      border_color: 0x81D4FA
      border_opa: 55%
      shadow_width: 22
      shadow_opa: 75%
      shadow_color: 0x29B6F6
      shadow_offset_y: 0

    - id: glow_orange
      border_width: 2
      border_color: 0xFFB74D
      border_opa: 60%
      shadow_width: 22
      shadow_opa: 75%
      shadow_color: 0xFF8C00
      shadow_offset_y: 0

    - id: theme_modern_ac_power_on
      bg_color: 0x00E676
      bg_opa: cover
      text_color: black
      radius: 16
      border_width: 0
      shadow_width: 0

    - id: theme_modern_ac_mode_cool
      bg_color: 0x29B6F6
      bg_opa: cover
      text_color: black
      radius: 16
      border_width: 0

    - id: theme_modern_ac_turbo
      bg_color: 0xFF6D00
      bg_opa: cover
      text_color: white
      radius: 16
      border_width: 0
