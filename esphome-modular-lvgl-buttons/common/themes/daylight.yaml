---
# ── Daylight theme (theme 4) ─────────────────────────────────────────────────
# Restyled to match docs/images/screen_light.png: near-black surfaces, raised
# dark tile faces and warm orange accents / glows. The bright "daylight" light
# palette was dropped because it was unreadable against the AC/light page
# artwork; this is now the dark orange-glow variant of the Modern look.
# NOTE: the style ids below (theme_daylight_*, depth_light, glow_blue_light)
# are referenced from every repaint lambda - keep the names, change the colors.
# Ref: docs/images/screen_light.png

substitutions:
  daylight_bg: "0x0B0C0D"
  daylight_page_bg: "0x0B0C0D"
  daylight_settings_bg: "0x0F1216"
  daylight_info_bg: "0x0F1216"
  daylight_ac_bg: "0x0B0C0D"
  daylight_ac_topbar_bg: "0x191D23"
  daylight_button_bg: "0x191D23"
  daylight_button_face_top: "0x1F242C"
  daylight_button_face_bottom: "0x151A20"
  daylight_button_bevel: "0x242A33"
  daylight_button_active: "0xE37220"
  daylight_text: "0xFFFFFF"
  daylight_text_dim: "0xB4B8BC"
  daylight_text_muted: "0x8A9099"
  daylight_text_accent: "0xF8953D"
  daylight_row_bg: "0x191D23"
  daylight_row_bg_alt: "0x14181E"
  daylight_selector_off: "0x2A303A"
  daylight_slider_bg: "0x232932"
  daylight_slider_active: "0xE37220"
  daylight_radius: "20"
  daylight_radius_card: "18"
  daylight_pad: "14"

lvgl:
  gradients:
    # Raised dark face gradient behind theme-4 cards/tiles
    - id: depth_light_gradient
      direction: ver
      stops:
        - color: 0x1F242C
          position: 0
        - color: 0x151A20
          position: 255

  style_definitions:
    - id: theme_daylight_page
      bg_color: 0x0B0C0D
      bg_opa: cover
      text_color: 0xFFFFFF
      pad_all: 6
      border_width: 0
      shadow_width: 0
      radius: 0

    - id: theme_daylight_button
      bg_color: 0x191D23
      bg_opa: cover
      text_color: 0xFFFFFF
      radius: 20
      border_width: 1
      border_color: 0x242A33
      shadow_width: 16
      shadow_opa: 60%
      shadow_color: 0x000000
      shadow_offset_y: 5
      pad_all: 14

    - id: theme_daylight_button_active
      bg_color: 0xE37220
      bg_opa: cover
      text_color: white
      radius: 20
      border_width: 0
      shadow_width: 22
      shadow_opa: 75%
      shadow_color: 0xE37220
      shadow_offset_y: 0
      pad_all: 14

    # Raised dark card face (Modern's depth_dark counterpart)
    - id: depth_light
      bg_grad: depth_light_gradient
      bg_grad_dir: ver
      bg_main_stop: 255
      bg_grad_stop: 255
      bg_opa: cover
      border_width: 1
      border_color: 0x242A33
      border_opa: 100%
      shadow_width: 16
      shadow_opa: 60%
      shadow_color: 0x000000
      shadow_offset_y: 5

    # Warm orange glow for active states (kept id for the repaint lambdas)
    - id: glow_blue_light
      border_width: 2
      border_color: 0xF8953D
      border_opa: 60%
      shadow_width: 22
      shadow_opa: 75%
      shadow_color: 0xE37220
      shadow_offset_y: 0
