---
# Theme registry - one file per theme in common/themes/.
#
#   classic.yaml      original dark look, slate tiles, single orange accent
#   modern.yaml       mockup look: navy + raised faces + glow rings
#   performance.yaml  flat monochrome, cheapest to render
#   daylight.yaml     warm raised dark cards + orange accents/glows
#                     (matches docs/images/screen_light.png; the bright
#                     light palette was dropped as unreadable)
#
# Each theme file carries its own substitutions (palette) and LVGL
# style_definitions; ESPHome merges the lvgl: blocks from all packages, so
# adding a theme = dropping a file here and registering it below.

packages:
  theme_classic: !include themes/classic.yaml
  theme_modern: !include themes/modern.yaml
  theme_performance: !include themes/performance.yaml
  theme_daylight: !include themes/daylight.yaml
