---
# Three selectable themes: Classic, Modern (like mockups), Performance (minimal)
# Theme definitions and application logic

substitutions:
  # Classic theme (current) - dark, slate_blue_gray buttons, orange accent
  classic_bg: "0x000000"
  classic_page_bg: "0x000000"
  classic_settings_bg: "0x11151C"
  classic_button_bg: "0x343645"
  classic_button_active: "0xFF9F1C"
  classic_text: "0xFFFFFF"
  classic_text_dim: "0x9BA2BC"
  classic_radius: "14"
  classic_pad: "10"

  # Modern theme - like generated mockup images, dark navy, orange glow, rounded 20
  modern_bg: "0x0A0E14"
  modern_page_bg: "0x0A0E14"
  modern_settings_bg: "0x121A26"
  modern_button_bg: "0x1E232E"
  modern_button_active: "0xFF8C00"
  modern_button_green: "0x00E676"
  modern_button_blue: "0x29B6F6"
  modern_button_orange: "0xFF6D00"
  modern_text: "0xFFFFFF"
  modern_text_dim: "0x9BA2BC"
  modern_text_accent: "0xFF8C00"
  modern_radius: "20"
  modern_pad: "14"
  modern_slider_bg: "0x2A303E"
  modern_slider_active: "0xFF8C00"

  # Performance theme - minimal, less resources, fastest
  perf_bg: "0x000000"
  perf_page_bg: "0x000000"
  perf_settings_bg: "0x000000"
  perf_button_bg: "0x1A1A1A"
  perf_button_active: "0x333333"
  perf_text: "0xFFFFFF"
  perf_text_dim: "0x888888"
  perf_radius: "4"
  perf_pad: "6"
  perf_slider_bg: "0x222222"
  perf_slider_active: "0x666666"

lvgl:
  gradients:
    # Vertical "raised face" gradient behind Modern (theme 2) buttons
    - id: depth_face_gradient
      direction: ver
      stops:
        - color: 0x323B4D
          position: 0
        - color: 0x1A212C
          position: 255

  style_definitions:
    # Classic styles
    - id: theme_classic_page
      bg_color: 0x000000
      bg_opa: cover
      text_color: white
      pad_all: 4
      border_width: 0
      shadow_width: 0
      radius: 0

    - id: theme_classic_button
      bg_color: 0x343645
      bg_opa: cover
      text_color: white
      radius: 14
      border_width: 0
      shadow_width: 0
      pad_all: 10

    # Modern styles - like mockup images
    - id: theme_modern_page
      bg_color: 0x0A0E14
      bg_opa: cover
      text_color: white
      pad_all: 6
      border_width: 0
      shadow_width: 0
      radius: 0

    - id: theme_modern_button
      bg_color: 0x1E232E
      bg_opa: cover
      text_color: 0xCCCCCC
      radius: 20
      border_width: 0
      shadow_width: 0
      pad_all: 14

    - id: theme_modern_button_active
      bg_color: 0xFF8C00
      bg_opa: cover
      text_color: white
      radius: 20
      border_width: 0
      shadow_width: 0
      pad_all: 14

    # ── Theme 2 (Modern) depth ──────────────────────────────────────────
    # Raised "3D" button face: vertical gradient + thin top light + drop shadow.
    # Applied with lv_obj_add_style() so widgets keep their own radius/pad.
    - id: depth_dark
      bg_grad: depth_face_gradient
      bg_grad_dir: ver
      bg_main_stop: 255
      bg_grad_stop: 255
      bg_opa: cover
      border_width: 1
      border_color: 0x3D4658
      border_opa: 100%
      shadow_width: 14
      shadow_opa: 55%
      shadow_color: 0x000000
      shadow_offset_y: 5

    # Soft neutral glow (e.g. −/+ steppers on the AC page)
    - id: glow_soft
      border_width: 1
      border_color: 0x4A5468
      border_opa: 100%
      shadow_width: 18
      shadow_opa: 45%
      shadow_color: 0x9BA2BC
      shadow_offset_y: 0

    # Colored glows for active fills (Power ON green, Mode cool blue, Turbo orange)
    - id: glow_green
      border_width: 2
      border_color: 0x69F0AE
      border_opa: 55%
      shadow_width: 22
      shadow_opa: 75%
      shadow_color: 0x00E676
      shadow_offset_y: 0

    - id: glow_blue
      border_width: 2
      border_color: 0x81D4FA
      border_opa: 55%
      shadow_width: 22
      shadow_opa: 75%
      shadow_color: 0x29B6F6
      shadow_offset_y: 0

    - id: glow_orange
      border_width: 2
      border_color: 0xFFB74D
      border_opa: 60%
      shadow_width: 22
      shadow_opa: 75%
      shadow_color: 0xFF8C00
      shadow_offset_y: 0

    - id: theme_modern_ac_power_on
      bg_color: 0x00E676
      bg_opa: cover
      text_color: black
      radius: 16
      border_width: 0
      shadow_width: 0

    - id: theme_modern_ac_mode_cool
      bg_color: 0x29B6F6
      bg_opa: cover
      text_color: black
      radius: 16
      border_width: 0

    - id: theme_modern_ac_turbo
      bg_color: 0xFF6D00
      bg_opa: cover
      text_color: white
      radius: 16
      border_width: 0

    # Performance styles - minimal
    - id: theme_perf_page
      bg_color: 0x000000
      bg_opa: cover
      text_color: white
      pad_all: 2
      border_width: 0
      shadow_width: 0
      radius: 0

    - id: theme_perf_button
      bg_color: 0x1A1A1A
      bg_opa: cover
      text_color: white
      radius: 4
      border_width: 0
      shadow_width: 0
      pad_all: 6
