---
# Swipe navigation
  on_swipe_right:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      - logger.log: "Swipe right"
      - lvgl.page.next:
          animation: OUT_RIGHT
          #options: stable: 300ms | fast: 150ms (applied, matches pages)
          time: 150ms
  on_swipe_left:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      - logger.log: "Swipe left"
      - lvgl.page.previous:
          animation: OUT_LEFT
          #options: stable: 300ms | fast: 150ms (applied, matches pages)
          time: 150ms