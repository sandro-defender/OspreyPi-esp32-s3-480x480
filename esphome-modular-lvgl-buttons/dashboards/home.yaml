---
# Default home dashboard shared by Display01 and Display02.
#
# QUICK CUSTOMIZATION
# Override any value below in the `substitutions:` block of a DisplayXX.yaml.
# Generic cards accept any Home Assistant action (for example light.toggle,
# switch.toggle, script.turn_on, scene.turn_on) and entity ID. The entity is
# declared once here and reused by both the button and its state listener.

substitutions:
  dashboard_button_1_text: "Bedroom"
  dashboard_button_1_entity: "light.bedroom_lights"
  dashboard_button_1_action: "light.toggle"
  dashboard_button_1_icon: "\U000F0335" # mdi-lightbulb
  dashboard_button_1_height: "228px"

  dashboard_button_2_text: "Fan"
  dashboard_button_2_entity: "switch.fun_group"
  dashboard_button_2_action: "switch.toggle"
  dashboard_button_2_icon: "\U000F0210" # mdi-fan
  dashboard_button_2_height: "109px"

  dashboard_button_3_text: "Pantry"
  dashboard_button_3_entity: "light.pantry_light"
  dashboard_button_3_action: "light.toggle"
  dashboard_button_3_icon: "\U000F0335" # mdi-lightbulb
  dashboard_button_3_height: "109px"

  dashboard_button_4_text: "WLED"
  dashboard_button_4_entity: "script.wled_light_togle_animated"
  dashboard_button_4_action: "script.turn_on"
  dashboard_button_4_state_entity: "light.wled_new"
  dashboard_button_4_icon: "\U000F12BA" # mdi-string-lights
  dashboard_button_4_height: "109px"

  dashboard_button_5_entity: "switch.media_play_pause"
  dashboard_button_5_action: "switch.toggle"
  dashboard_button_5_icon: "\U000F040E" # mdi-play-pause
  dashboard_button_5_height: "109px"

  dashboard_button_6_text: "Sleep"
  dashboard_button_6_entity: "switch.call_sleep_script"
  dashboard_button_6_action: "switch.toggle"
  dashboard_button_6_icon: "\U000F0594" # mdi-weather-night
  dashboard_button_6_height: "109px"

  dashboard_button_7_text: "Bed LEDs"
  dashboard_button_7_entity: "light.wled_new"
  dashboard_button_7_icon: "\U000F12BA" # mdi-string-lights
  dashboard_button_7_height: "228px"

  dashboard_button_9_text: "Leave"
  dashboard_button_9_entity: "switch.call_exit_script"
  dashboard_button_9_action: "switch.toggle"
  dashboard_button_9_icon: "\U000F0FC5" # mdi-location-exit
  dashboard_button_9_height: "109px"

packages:
  ac_screen: !include
    file: ../pages/ac_control.yaml
    vars:
      widget_name: ac_main
      climate_entity: "${climate_entity}"

  button_1_state: !include
    file: ../sensors/switch_or_light_button_state.yaml
    vars:
      uid: button_1
      entity_id: "${dashboard_button_1_entity}"

  button_2_state: !include
    file: ../sensors/switch_or_light_button_state.yaml
    vars:
      uid: button_2
      entity_id: "${dashboard_button_2_entity}"

  button_3_state: !include
    file: ../sensors/switch_or_light_button_state.yaml
    vars:
      uid: button_3
      entity_id: "${dashboard_button_3_entity}"

  button_4_state: !include
    file: ../sensors/switch_or_light_button_state.yaml
    vars:
      uid: button_4
      entity_id: "${dashboard_button_4_state_entity}"

  button_5_state: !include
    file: ../sensors/play_pause_button_state.yaml
    vars:
      uid: button_5
      entity_id: "${dashboard_button_5_entity}"

  button_6_state: !include
    file: ../sensors/switch_or_light_button_state.yaml
    vars:
      uid: button_6
      entity_id: "${dashboard_button_6_entity}"

  button_7_state: !include
    file: ../sensors/dimmer_light_state.yaml
    vars:
      uid: button_7
      entity_id: "${dashboard_button_7_entity}"

  button_7_page: !include
    file: ../pages/light_color.yaml
    vars:
      widget_name: button_7
      light_entity: "${dashboard_button_7_entity}"

  button_9_state: !include
    file: ../sensors/switch_or_light_button_state.yaml
    vars:
      uid: button_9
      entity_id: "${dashboard_button_9_entity}"

lvgl:
  pages:
    - id: main_page
      layout:
        type: flex
        flex_flow: column_wrap
        pad_row: 8px
        pad_column: 8px
      width: 100%
      styles: page_style
      bg_color: black
      bg_opa: cover
      # Swipe ring: Home <-> AC <-> Light (explicit targets so page order
      # in the config can never break navigation)
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.show:
            id: ac_main_page
            animation: OUT_LEFT
            # PERF v2.5: 300ms -> 150ms = navigation feels ~2x more instant.
            #options: stable: 300ms | fast: 150ms (applied)
            time: 150ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.show:
            id: button_7_light_page
            animation: OUT_RIGHT
            #options: stable: 300ms | fast: 150ms (applied)
            time: 150ms
      widgets:
        - button: !include
            file: ../buttons/entity_button.yaml
            vars:
              uid: button_1
              height: "${dashboard_button_1_height}"
              text: "${dashboard_button_1_text}"
              icon: "${dashboard_button_1_icon}"
              action: "${dashboard_button_1_action}"
              entity_id: "${dashboard_button_1_entity}"

        - button: !include
            file: ../buttons/entity_button.yaml
            vars:
              uid: button_2
              height: "${dashboard_button_2_height}"
              text: "${dashboard_button_2_text}"
              icon: "${dashboard_button_2_icon}"
              action: "${dashboard_button_2_action}"
              entity_id: "${dashboard_button_2_entity}"

        - button: !include
            file: ../buttons/entity_button.yaml
            vars:
              uid: button_3
              height: "${dashboard_button_3_height}"
              text: "${dashboard_button_3_text}"
              icon: "${dashboard_button_3_icon}"
              action: "${dashboard_button_3_action}"
              entity_id: "${dashboard_button_3_entity}"

        - button: !include
            file: ../buttons/entity_button.yaml
            vars:
              uid: button_4
              height: "${dashboard_button_4_height}"
              text: "${dashboard_button_4_text}"
              icon: "${dashboard_button_4_icon}"
              action: "${dashboard_button_4_action}"
              entity_id: "${dashboard_button_4_entity}"

        - button: !include
            file: ../buttons/page_button.yaml
            vars:
              uid: ac_nav
              height: $button_height_single
              text: AC
              icon: $mdi_air_conditioner
              page: ac_main_page

        - button: !include
            file: ../buttons/fullscreen_entity_button.yaml
            vars:
              uid: button_5
              height: "${dashboard_button_5_height}"
              icon: "${dashboard_button_5_icon}"
              font: mdi_icons_80
              action: "${dashboard_button_5_action}"
              entity_id: "${dashboard_button_5_entity}"

        - button: !include
            file: ../buttons/entity_button.yaml
            vars:
              uid: button_6
              height: "${dashboard_button_6_height}"
              text: "${dashboard_button_6_text}"
              icon: "${dashboard_button_6_icon}"
              action: "${dashboard_button_6_action}"
              entity_id: "${dashboard_button_6_entity}"

        - button: !include
            file: ../buttons/dimmer_light_button.yaml
            vars:
              uid: button_7
              height: "${dashboard_button_7_height}"
              text: "${dashboard_button_7_text}"
              icon: "${dashboard_button_7_icon}"
              entity_id: "${dashboard_button_7_entity}"

        # Settings card also shows the live Home Assistant connection state.
        - button:
            id: dashboard_settings_button
            height: $button_height_single
            width: $button_width
            widgets:
              - label:
                  align: top_left
                  text_font: mdi_icons_22
                  text: $mdi_cog
              # Live Home Assistant connection state: a status icon on a
              # tinted halo disc instead of the old small text label. The
              # halo colour follows the state (mint / amber / red).
              - obj:
                  id: dashboard_status_halo
                  # FIX v2.5: the 68px halo disc (and the status icon inside)
                  # used to be clickable, so taps and swipes starting on the
                  # middle of the Settings card died on this obj and never
                  # reached the button. Pass touches through to the parent.
                  clickable: false
                  align: center
                  y: -4
                  width: 68
                  height: 68
                  radius: 34
                  bg_color: amber
                  bg_opa: 22%
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - image:
                        id: dashboard_connection_status
                        clickable: false
                        align: center
                        src: conn_status_connecting
              - label:
                  align: bottom_left
                  text_font: nunito_14
                  text_color: misty_blue
                  text: "Tap · hold for info"
            on_short_click:
              - lvgl.page.show: settings_page
            on_long_press:
              - lvgl.page.show: info_screen

        - button: !include
            file: ../buttons/entity_button.yaml
            vars:
              uid: button_9
              height: "${dashboard_button_9_height}"
              text: "${dashboard_button_9_text}"
              icon: "${dashboard_button_9_icon}"
              action: "${dashboard_button_9_action}"
              entity_id: "${dashboard_button_9_entity}"


# Keep the status shown on the Settings card tied specifically to Home
# Assistant rather than to arbitrary logger/API clients.
binary_sensor:
  - platform: template
    id: dashboard_ha_status
    internal: true
    lambda: return id(ha_connected);
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            binary_sensor.is_on: dashboard_ha_status
          then:
            - lvgl.image.update:
                id: dashboard_connection_status
                src: conn_status_connected
            - lambda: 'lv_obj_set_style_bg_color(id(dashboard_status_halo), lv_color_hex(0x39D19C), 0);'
          else:
            - lvgl.image.update:
                id: dashboard_connection_status
                src: conn_status_offline
            - lambda: 'lv_obj_set_style_bg_color(id(dashboard_status_halo), lv_color_hex(0xE53935), 0);'


# Theme handling - defined AFTER all pages so all ids exist (fixes validation)
script:
  - id: apply_display_theme
    mode: restart
    then:
      - lambda: |-
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme = "Classic";
          uint32_t page_bg = 0x000000;
          uint32_t settings_bg = 0x11151C;
          uint32_t info_bg = 0x11151C;
          if (theme == "Classic") { page_bg = 0x000000; settings_bg = 0x11151C; info_bg = 0x11151C; }
          else if (theme == "Modern") { page_bg = 0x0A0E14; settings_bg = 0x121A26; info_bg = 0x0F141E; }
          else if (theme == "Performance") { page_bg = 0x000000; settings_bg = 0x000000; info_bg = 0x000000; }
          else if (theme == "Daylight") { page_bg = 0x0B0C0D; settings_bg = 0x0F1216; info_bg = 0x0F1216; }

          if (id(main_page)) {
            lv_obj_set_style_bg_color(id(main_page)->obj, lv_color_hex(page_bg), 0);
            lv_obj_set_style_bg_opa(id(main_page)->obj, LV_OPA_COVER, 0);
            lv_obj_set_style_pad_all(id(main_page)->obj, (theme=="Performance" || theme=="Daylight") ? 4 : (theme=="Modern" ? 6 : 4), 0);
          }
          if (id(settings_page)) {
            lv_obj_set_style_bg_color(id(settings_page)->obj, lv_color_hex(settings_bg), 0);
            lv_obj_set_style_bg_opa(id(settings_page)->obj, LV_OPA_COVER, 0);
          }
          if (id(info_screen)) {
            lv_obj_set_style_bg_color(id(info_screen)->obj, lv_color_hex(info_bg), 0);
            lv_obj_set_style_bg_opa(id(info_screen)->obj, LV_OPA_COVER, 0);
          }
          if (id(ac_main_page)) {
            uint32_t ac_bg = (theme=="Modern") ? 0x080A0F : 0x0F1115;
            if (theme=="Performance") ac_bg = 0x000000;
            if (theme=="Daylight") ac_bg = 0x0B0C0D;
            lv_obj_set_style_bg_color(id(ac_main_page)->obj, lv_color_hex(ac_bg), 0);
            lv_obj_set_style_bg_opa(id(ac_main_page)->obj, LV_OPA_COVER, 0);
          }
          if (id(ac_main_top_bar)) {
            uint32_t top_bg = (theme=="Modern") ? 0x12151E : 0x1A1D26;
            if (theme=="Performance") top_bg = 0x000000;
            if (theme=="Daylight") top_bg = 0x191D23;
            lv_obj_set_style_bg_color(id(ac_main_top_bar), lv_color_hex(top_bg), 0);
          }
          if (id(button_7_light_page)) {
            uint32_t light_bg = (theme=="Modern") ? 0x0F141E : 0x161B26;
            if (theme=="Performance") light_bg = 0x000000;
            if (theme=="Daylight") light_bg = 0x0B0C0D;
            lv_obj_set_style_bg_color(id(button_7_light_page)->obj, lv_color_hex(light_bg), 0);
            lv_obj_set_style_bg_opa(id(button_7_light_page)->obj, LV_OPA_COVER, 0);
          }
          // AC button radius/color/depth now owned by script ac_main_refresh
          // settings/info/light pages repaint themselves via their theme scripts
      - lvgl.style.update:
          id: page_style
          bg_color: !lambda |-
            std::string t = id(current_theme).current_option();
            if (t=="Modern") return lv_color_hex(0x0A0E14);
            if (t=="Performance") return lv_color_hex(0x000000);
            if (t=="Daylight") return lv_color_hex(0x0B0C0D);
            return lv_color_hex(0x000000);
          text_color: !lambda |-
            std::string t = id(current_theme).current_option();
            return lv_color_hex(0xFFFFFF);
      - script.execute: ac_main_refresh
      - script.execute: apply_settings_theme
      - script.execute: apply_info_theme
      - script.execute: button_7_apply_theme
      - script.execute: update_settings_highlight
      - script.execute: apply_dashboard_theme
      # Re-apply the live on/off skins AFTER the theme repaint, otherwise a
      # theme switch flattens every tile to its inactive look until reboot.
      - script.execute: repaint_button_1
      - script.execute: repaint_button_2
      - script.execute: repaint_button_3
      - script.execute: repaint_button_4
      - script.execute: repaint_button_5
      - script.execute: repaint_button_6
      - script.execute: repaint_button_7
      - script.execute: repaint_button_9
      - lvgl.widget.redraw:

  - id: update_settings_highlight
    mode: restart
    then:
      - lambda: |-
          auto set_btn = [](lv_obj_t* btn, bool active, std::string theme) {
            if (!btn) return;
            uint32_t active_bg = 0xFF9F1C;
            uint32_t inactive_bg = 0x3A4352;
            bool modern = (theme == "Modern");
            bool perf = (theme == "Performance");
            if (modern) { active_bg = 0xFF8C00; inactive_bg = 0x2A3142; }
            else if (perf) { active_bg = 0x444444; inactive_bg = 0x1A1A1A; }
            lv_obj_remove_style(btn, id(depth_dark), 0);
            lv_obj_remove_style(btn, id(glow_orange), 0);
            lv_obj_remove_style(btn, id(depth_light), 0);
            lv_obj_remove_style(btn, id(glow_blue_light), 0);
            if (active) {
              lv_obj_set_style_bg_color(btn, lv_color_hex(active_bg), 0);
              lv_obj_set_style_text_color(btn, lv_color_white(), 0);
              if (modern) lv_obj_add_style(btn, id(glow_orange), 0);
            } else {
              lv_obj_set_style_bg_color(btn, lv_color_hex(inactive_bg), 0);
              lv_obj_set_style_text_color(btn, lv_color_hex(0xCCCCCC), 0);
              if (modern) lv_obj_add_style(btn, id(depth_dark), 0);
            }
          };
          std::string bmode = id(brightness_mode).current_option();
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme="Classic";
          set_btn(id(settings_btn_day), bmode=="Day", theme);
          set_btn(id(settings_btn_evening), bmode=="Evening", theme);
          set_btn(id(settings_btn_night), bmode=="Night", theme);
          set_btn(id(settings_btn_classic), theme=="Classic", theme);
          set_btn(id(settings_btn_modern), theme=="Modern", theme);
          set_btn(id(settings_btn_performance), theme=="Performance", theme);
          set_btn(id(settings_btn_daylight), theme=="Daylight", theme);
          std::string rot = id(display_rotation_select).current_option();
          set_btn(id(settings_btn_rot0), rot=="0", theme);
          set_btn(id(settings_btn_rot90), rot=="90", theme);
          set_btn(id(settings_btn_rot180), rot=="180", theme);
          set_btn(id(settings_btn_rot270), rot=="270", theme);

  - id: apply_dashboard_theme
    mode: restart
    then:
      - lambda: |-
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme = "Classic";
          uint32_t button_bg = 0x343645;
          uint32_t button_radius = 14;
          bool day = (theme == "Daylight");
          if (theme == "Classic") { button_bg = 0x343645; button_radius = 14; }
          else if (theme == "Modern") { button_bg = 0x1E232E; button_radius = 20; }
          else if (theme == "Performance") { button_bg = 0x1A1A1A; button_radius = 4; }
          else if (theme == "Daylight") { button_bg = 0x191D23; button_radius = 20; }

          lv_obj_t* buttons[] = {
            id(button_button_1),
            id(button_button_2),
            id(button_button_3),
            id(button_button_4),
            id(button_ac_nav),
            id(button_button_5),
            id(button_button_6),
            id(button_button_7),
            id(dashboard_settings_button),
            id(button_button_9)
          };
          lv_obj_t* icons[] = {
            id(icon_button_1),
            id(icon_button_2),
            id(icon_button_3),
            id(icon_button_4),
            id(icon_ac_nav),
            id(icon_button_5),
            id(icon_button_6),
            id(icon_button_7),
            nullptr,
            id(icon_button_9)
          };
          lv_obj_t* labels[] = {
            id(label_button_1),
            id(label_button_2),
            id(label_button_3),
            id(label_button_4),
            id(label_ac_nav),
            nullptr,
            id(label_button_6),
            id(label_button_7),
            nullptr,
            id(label_button_9)
          };
          bool modern_theme = (theme == "Modern");
          for (int i=0;i<10;i++) {
            auto btn = buttons[i];
            if (!btn) continue;
            lv_obj_remove_style(btn, id(depth_dark), 0);
            lv_obj_remove_style(btn, id(glow_orange), 0);
            lv_obj_remove_style(btn, id(depth_light), 0);
            lv_obj_remove_style(btn, id(glow_blue_light), 0);
            lv_obj_set_style_bg_color(btn, lv_color_hex(button_bg), 0);
            lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(btn, button_radius, 0);
            if (modern_theme || day) {
              // raised "3D" face like the mockups: gradient + border + shadow
              lv_obj_add_style(btn, modern_theme ? id(depth_dark) : id(depth_light), 0);
            } else {
              lv_obj_set_style_border_width(btn, 0, 0);
              lv_obj_set_style_shadow_width(btn, 0, 0);
              lv_obj_set_style_pad_all(btn, theme=="Performance" ? 6 : 10, 0);
            }
            if (theme=="Modern") lv_obj_set_style_text_color(btn, lv_color_hex(0xCCCCCC), 0);
            else lv_obj_set_style_text_color(btn, lv_color_hex(0xFFFFFF), 0);
            auto icon = icons[i];
            if (icon) {
              if (theme=="Modern") lv_obj_set_style_text_color(icon, lv_color_hex(0xFF8C00), 0);
              else if (theme=="Daylight") lv_obj_set_style_text_color(icon, lv_color_hex(0xF8953D), 0);
              else lv_obj_set_style_text_color(icon, lv_color_hex(0xFFFFFF), 0);
            }
            auto lbl = labels[i];
            if (lbl) {
              if (theme=="Modern") lv_obj_set_style_text_color(lbl, lv_color_hex(0x9BA2BC), 0);
              else if (theme=="Performance") lv_obj_set_style_text_color(lbl, lv_color_hex(0xCCCCCC), 0);
              else lv_obj_set_style_text_color(lbl, lv_color_hex(0xFFFFFF), 0);
            }
          }

touchscreen:
  # PERF v2.5: wake_display used to restart on EVERY touch report (also while
  # the panel was already awake), re-running a full brightness service call on
  # every poll while a finger is down. It is now gated to the two states where
  # waking is actually needed: LVGL paused (backlight off) or the screensaver
  # page showing. Behavior on wake is unchanged.
  #options: stable: wake on every touch | fast: gated wake (applied)
  on_touch:
    then:
      - if:
          condition:
            or:
              - lvgl.is_paused
              - lvgl.page.is_showing: screensaver_page
          then:
            - script.execute: wake_display

