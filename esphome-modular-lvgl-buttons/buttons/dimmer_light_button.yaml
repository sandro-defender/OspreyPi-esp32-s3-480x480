---
# Dimmer light switch button
# vars:
  # uid:
  # height:
  # text:
  # icon:
  # entity_id:
height: ${height}
width: $button_width
id: button_${uid}
widgets:
  - label:
      text_font: $icon_font
      align: top_left
      id: icon_${uid}
      text: ${icon}
  - label:
      align: bottom_left
      id: label_${uid}
      text: ${text}
  - slider:
      align: top_right
      id: slider_${uid}
      x: -8
      y: 18
      width: 18
      height: 172
      min_value: 0
      max_value: 255
      radius: 9
      bg_color: dark_gray
      bg_opa: 80%
      knob:
        pad_top: -10
        pad_bottom: -10
        radius: 9
        bg_color: white
      indicator:
        radius: 9
        bg_color: mint
      on_release:
        - homeassistant.action:
            action: light.turn_on
            data:
              entity_id: ${entity_id}
              brightness: !lambda return int(x);
on_short_click:
    then:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${entity_id}
# on_long_press disabled to save flash space
on_long_press:
    then:
      lvgl.page.show: ${uid}_light_page


      
  
