# Fullscreen Icon Button (No Text, Large Centered Icon)
# vars:
#   uid:
#   height:
#   icon:
#   entity_id:
#   font: (Optional, defaults to standard icon font if not provided)
height: ${height}
width: $button_width
id: button_${uid}
widgets:
  - label:
      text_font: ${font}
      align: center
      id: icon_${uid}
      text: ${icon}
on_short_click:
    - if:
        condition:
          lambda: 'return id(ha_connected);'
        then:
          - homeassistant.action:
              action: switch.toggle
              data:
                entity_id: ${entity_id}
        else:
          - logger.log: "Home Assistant is offline; ignored switch button press"
