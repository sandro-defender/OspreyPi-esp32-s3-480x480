---
# Generic Home Assistant action button with one large centered icon.
# vars: uid, height, icon, font, action, entity_id

height: ${height}
width: $button_width
id: button_${uid}
widgets:
  - label:
      text_font: ${font}
      align: center
      id: icon_${uid}
      text: ${icon}
on_short_click:
  - if:
      condition:
        lambda: 'return id(ha_connected);'
      then:
        - homeassistant.action:
            action: ${action}
            data:
              entity_id: ${entity_id}
      else:
        - logger.log: "Home Assistant is offline; ignored dashboard button press"
