---
# ── WLED / light page (rewritten) ────────────────────────────────────────────
# Matches the mockup (docs/images/screen_home.png): "Bed LEDs" title, labeled
# vertical Brightness (orange) and Saturation (red) sliders with live %, a
# glowing bulb (tap = toggle, long-press = switch HS/white mode) and a real
# 12-segment hue ring with an adjustable knob marker. HOME button at bottom.
#
# Rewrite notes vs the old version:
#   * The fake "rainbow circle with punched hole" is gone — the wheel is now
#     12 solid hue arc segments (+6 white-temperature segments), so it reads
#     as a proper color ring and needs no background-colored hole punch.
#     That also makes it work unchanged on the Daylight theme.
#   * Geometry fixed: the old ring container ran ~105 px off the right edge.
#   * All chrome (title, captions, tracks, HOME button) is painted by the
#     button_7_apply_theme script, so switching themes restyles this page too.

globals:
  - id: ${widget_name}_current_hue
    type: float
    initial_value: '0.0'

  - id: ${widget_name}_current_saturation
    type: float
    initial_value: '0.0'

  - id: ${widget_name}_current_brightness
    type: int
    initial_value: '100'

  - id: ${widget_name}_current_color_temp
    type: float
    initial_value: '3000.0'

  - id: ${widget_name}_is_temp_mode
    type: bool
    initial_value: 'false'

  - id: ${widget_name}_supports_color_temp
    type: bool
    initial_value: 'false'

  - id: ${widget_name}_supports_hs
    type: bool
    initial_value: 'false'

  - id: ${widget_name}_supports_rgb
    type: bool
    initial_value: 'false'

  - id: ${widget_name}_supports_brightness
    type: bool
    initial_value: 'false'

  - id: ${widget_name}_calc_color
    type: int
    initial_value: '0'

binary_sensor:
  # Track light state (on/off)
  - platform: homeassistant
    id: ${widget_name}_light_state
    entity_id: "${light_entity}"
    on_state:
      - script.execute: ${widget_name}_update_lightbulb_color

  # Bulb control: short press toggles the light, long press switches mode
  - platform: lvgl
    id: ${widget_name}_light_btn_control
    widget: ${widget_name}_lightbulb_btn
    on_click:
      # PERF v2.5 fix: min_length was 50ms — taps quicker than 50ms (very
      # common with a light flick) were silently DROPPED and read as an
      # unresponsive device. 10ms still separates cleanly from the 800ms
      # long-press threshold below.
      #options: stable: 50ms (drops quick taps) | fast: 10ms (applied)
      - min_length: 10ms
        max_length: 500ms
        then:
          - homeassistant.action:
              action: light.toggle
              data:
                entity_id: "${light_entity}"
      - min_length: 800ms
        max_length: 3000ms
        then:
          - if:
              condition:
                lambda: |-
                  return id(${widget_name}_supports_color_temp) &&
                         (id(${widget_name}_supports_hs) || id(${widget_name}_supports_rgb));
              then:
                - lambda: |-
                    id(${widget_name}_is_temp_mode) = !id(${widget_name}_is_temp_mode);
                - script.execute: ${widget_name}_toggle_gradient

sensor:
  # Brightness (0..255)
  - id: ${widget_name}_light_rgb_sensor_brightness
    platform: template
    internal: true
    lambda: |-
      if (id(${widget_name}_brightness_raw).state == "None" || id(${widget_name}_brightness_raw).state == "") {
        return 0.0f;
      }
      auto val = parse_number<float>(id(${widget_name}_brightness_raw).state);
      if (val.has_value()) {
        return val.value();
      }
      return 0.0f;
    on_value:
      - if:
          condition:
            lambda: 'return !std::isnan(x);'
          then:
            - globals.set:
                id: ${widget_name}_current_brightness
                value: !lambda return x;
            - lvgl.slider.update:
                id: ${widget_name}_light_brightness_slider
                value: !lambda return int(x);
            - lvgl.label.update:
                id: ${widget_name}_brightness_value
                text: !lambda |-
                  char b[8]; snprintf(b, sizeof(b), "%d%%", (int) (x * 100.0f / 255.0f)); return std::string(b);
            - script.execute: ${widget_name}_update_lightbulb_color

  # Color temperature (Kelvin)
  - id: ${widget_name}_light_sensor_color_temp
    platform: template
    internal: true
    lambda: |-
      if (id(${widget_name}_color_temp_raw).state == "None" || id(${widget_name}_color_temp_raw).state == "") {
        return 3000.0f;
      }
      auto val = parse_number<float>(id(${widget_name}_color_temp_raw).state);
      if (val.has_value()) {
        return val.value();
      }
      return 3000.0f;
    on_value:
      - if:
          condition:
            lambda: 'return !std::isnan(x);'
          then:
            - globals.set:
                id: ${widget_name}_current_color_temp
                value: !lambda return x;
            - lvgl.arc.update:
                id: ${widget_name}_light_arc_color_temp
                value: !lambda return int(x);
            - if:
                condition:
                  lambda: 'return id(${widget_name}_is_temp_mode);'
                then:
                  - script.execute: ${widget_name}_update_lightbulb_color

text_sensor:
  # Raw brightness attribute
  - platform: homeassistant
    id: ${widget_name}_brightness_raw
    entity_id: "${light_entity}"
    attribute: brightness
    internal: true
    on_value:
      then:
        - component.update: ${widget_name}_light_rgb_sensor_brightness

  # Raw color temperature attribute
  - platform: homeassistant
    id: ${widget_name}_color_temp_raw
    entity_id: "${light_entity}"
    attribute: color_temp_kelvin
    internal: true
    on_value:
      then:
        - component.update: ${widget_name}_light_sensor_color_temp

  # HS color attribute "(h, s)"
  - platform: homeassistant
    id: ${widget_name}_light_sensor_hs
    entity_id: "${light_entity}"
    attribute: hs_color
    on_value:
      - if:
          condition:
            lambda: "return x != \"None\" && !x.empty();"
          then:
            - lambda: |-
                std::string s = x;
                size_t start = s.find('(') + 1;
                size_t comma = s.find(',');
                size_t end = s.find(')');
                float hue = 0.0f, sat = 0.0f;
                if (start < comma && comma < end) {
                  hue = atof(s.substr(start, comma - start).c_str());
                  sat = atof(s.substr(comma + 1, end - comma - 1).c_str());
                }
                id(${widget_name}_current_hue) = hue;
                id(${widget_name}_current_saturation) = sat;
            - lvgl.arc.update:
                id: ${widget_name}_light_arc_hue
                value: !lambda return id(${widget_name}_current_hue);
            - if:
                condition:
                  lambda: |-
                    return !id(${widget_name}_is_temp_mode) &&
                           (id(${widget_name}_supports_hs) || id(${widget_name}_supports_rgb));
                then:
                  - lvgl.slider.update:
                      id: ${widget_name}_light_saturation_slider
                      value: !lambda return id(${widget_name}_current_saturation);
                  - lvgl.label.update:
                      id: ${widget_name}_saturation_value
                      text: !lambda |-
                        char b[8]; snprintf(b, sizeof(b), "%d%%", (int) id(${widget_name}_current_saturation)); return std::string(b);
            - if:
                condition:
                  lambda: 'return !id(${widget_name}_is_temp_mode);'
                then:
                  - script.execute: ${widget_name}_update_lightbulb_color

  # Capability detection
  - platform: homeassistant
    id: ${widget_name}_light_supported_modes
    entity_id: "${light_entity}"
    attribute: supported_color_modes
    on_value:
      - lambda: |-
          std::string modes = x;
          id(${widget_name}_supports_color_temp) = (modes.find("color_temp") != std::string::npos);
          id(${widget_name}_supports_hs) = (modes.find("hs") != std::string::npos);
          id(${widget_name}_supports_rgb) = (modes.find("rgb") != std::string::npos);
          id(${widget_name}_supports_brightness) = (
            modes.find("brightness") != std::string::npos ||
            id(${widget_name}_supports_hs) ||
            id(${widget_name}_supports_rgb) ||
            id(${widget_name}_supports_color_temp)
          );
          if (id(${widget_name}_supports_hs) || id(${widget_name}_supports_rgb)) {
            id(${widget_name}_is_temp_mode) = false;
          } else if (id(${widget_name}_supports_color_temp)) {
            id(${widget_name}_is_temp_mode) = true;
          }
      - script.execute: ${widget_name}_update_widget_visibility

  - platform: homeassistant
    id: ${widget_name}_light_name
    entity_id: "${light_entity}"
    attribute: friendly_name
    on_value:
      then:
        - lvgl.label.update:
            id: ${widget_name}_light_name_label
            text: !lambda return x;

lvgl:
  pages:
    - id: ${widget_name}_light_page
      bg_color: 0x161B26
      bg_opa: cover
      # swipe left = back to Home (Home <-> AC <-> Light swipe ring)
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.show:
            id: main_page
            animation: OUT_LEFT
            #options: stable: 300ms | fast: 150ms (applied)
            time: 150ms
      widgets:
        # ── Title ────────────────────────────────────────────────────────
        - label:
            id: ${widget_name}_light_name_label
            align: top_mid
            y: 12
            width: 300
            height: 34
            long_mode: dot
            text_font: nunito_24
            text_align: center
            text_color: white
            text: "Bed LEDs"

        # ── Brightness column (caption / slider / %) ─────────────────────
        - obj:
            id: ${widget_name}_light_brightness_background
            align: center
            x: -186
            y: 18
            width: 66
            height: 300
            bg_opa: transp
            pad_all: 0
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
              pad_row: 8
            widgets:
              - label:
                  id: ${widget_name}_brightness_caption
                  text: "Brightness"
                  text_font: nunito_14
                  text_color: 0x9BA2BC
                  text_align: center
              - slider:
                  id: ${widget_name}_light_brightness_slider
                  width: 34
                  height: 218
                  radius: 17
                  bg_color: 0x0F141E
                  min_value: 2
                  max_value: 255
                  value: 128
                  indicator:
                    bg_color: 0xFF8C00
                    radius: 15
                  knob:
                    width: 24
                    height: 24
                    radius: 12
                    bg_color: 0xFFB74D
                    border_width: 2
                    border_color: white
                    pad_all: 0
                  on_value:
                    - globals.set:
                        id: ${widget_name}_current_brightness
                        value: !lambda return int(x);
                    - lvgl.label.update:
                        id: ${widget_name}_brightness_value
                        text: !lambda |-
                          char b[8]; snprintf(b, sizeof(b), "%d%%", (int) (x * 100.0f / 255.0f)); return std::string(b);
                    - script.execute: ${widget_name}_update_lightbulb_color
                  on_release:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: "${light_entity}"
                          brightness: !lambda return int(x);
              - label:
                  id: ${widget_name}_brightness_value
                  text: "--%"
                  text_font: nunito_18
                  text_color: 0xFF8C00
                  text_align: center

        # ── Saturation column (red accent like the mockup) ───────────────
        - obj:
            id: ${widget_name}_light_saturation_background
            align: center
            x: -104
            y: 18
            width: 66
            height: 300
            bg_opa: transp
            pad_all: 0
            border_width: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
              pad_row: 8
            widgets:
              - label:
                  id: ${widget_name}_saturation_caption
                  text: "Saturation"
                  text_font: nunito_14
                  text_color: 0x9BA2BC
                  text_align: center
              - slider:
                  id: ${widget_name}_light_saturation_slider
                  width: 34
                  height: 218
                  radius: 17
                  bg_color: 0x0F141E
                  min_value: 0
                  max_value: 100
                  value: 0
                  indicator:
                    bg_color: 0xFF1744
                    radius: 15
                  knob:
                    width: 24
                    height: 24
                    radius: 12
                    bg_color: 0xFF5252
                    border_width: 2
                    border_color: white
                    pad_all: 0
                  on_value:
                    - globals.set:
                        id: ${widget_name}_current_saturation
                        value: !lambda return x;
                    - lvgl.label.update:
                        id: ${widget_name}_saturation_value
                        text: !lambda |-
                          char b[8]; snprintf(b, sizeof(b), "%d%%", (int) x); return std::string(b);
                    - script.execute: ${widget_name}_update_lightbulb_color
                  on_release:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: "${light_entity}"
                        data_template:
                          hs_color: "{{ (hue|float, sat|float)|list }}"
                        variables:
                          hue: !lambda return id(${widget_name}_current_hue);
                          sat: !lambda return x;
              - label:
                  id: ${widget_name}_saturation_value
                  text: "--%"
                  text_font: nunito_18
                  text_color: 0xFF1744
                  text_align: center

        # ── Bulb: glowing disc (recolored live) + bulb image ─────────────
        # tap = toggle, long press = switch HS / white mode
        - obj:
            # The bulb sits concentric with the hue / temp ring (same x/y as
            # the ring arcs) so it is centered in the wheel and never covers
            # the color selector band.
            id: ${widget_name}_lightbulb_btn
            align: center
            x: 80
            y: -14
            width: 130
            height: 160
            radius: 20
            bg_opa: transp
            pad_all: 0
            border_width: 0
            scrollable: false
            clickable: true
            widgets:
              - obj:
                  id: ${widget_name}_lightbulb_color
                  clickable: false
                  x: 0
                  y: -24
                  width: 84
                  height: 84
                  radius: 42
                  align: center
                  bg_color: 0x999999
                  bg_opa: cover
                  border_width: 0
                  shadow_width: 0
                  shadow_opa: transp
              - image:
                  id: ${widget_name}_lightbulb_image
                  x: 0
                  y: 26
                  align: center
                  src: lightbulb_image

        # ── Hue ring: 12 solid segments (the actual color wheel) ─────────
        # Sweep 225° → 135° (270° total, gap on the left like the mockup).
        # Hue h sits at angle 225 + h * 0.75; each segment spans 30° of hue.
