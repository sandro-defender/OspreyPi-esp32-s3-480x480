            knob:
              width: 26
              height: 26
              radius: 13
              bg_color: 0x161B26
              border_width: 3
              border_color: white
              pad_all: 0
            on_value:
              - globals.set:
                  id: ${widget_name}_current_color_temp
                  value: !lambda return x;
              - script.execute: ${widget_name}_update_lightbulb_color
            on_release:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: "${light_entity}"
                    color_temp_kelvin: !lambda return int(x);

        # ── HOME button (mockup: rounded square + HOME caption) ──────────
        - button:
            id: ${widget_name}_home_button
            align: bottom_mid
            y: -52
            width: 56
            height: 56
            radius: 14
            bg_color: 0x2A3142
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  align: center
                  text: $mdi_home
                  text_font: mdi_icons_22
                  text_color: white
            on_click:
              - lvgl.page.show: main_page
        - label:
            id: ${widget_name}_home_caption
            align: bottom_mid
            y: -10
            text: "HOME"
            text_font: nunito_14
            text_color: 0x9BA2BC

script:
  # ── Switch between hue ring and white-temperature ring ─────────────────
  - id: ${widget_name}_toggle_gradient
    then:
      - if:
          condition:
            lambda: return id(${widget_name}_is_temp_mode);
          then:
            # COLOR_TEMP mode
            - lvgl.widget.hide: ${widget_name}_light_arc_hue
            - lvgl.widget.hide: ${widget_name}_light_saturation_background
            - lvgl.obj.update:
                id: ${widget_name}_light_brightness_background
                x: -104
            - lvgl.obj.update:
                id: ${widget_name}_lightbulb_btn
                x: 80
                y: -14
            - lambda: |-
                for (int i = 0; i < 12; i++) {
                  std::string n = "${widget_name}_hue_seg_" + std::to_string(i);
                  // hide via widget calls below (ids resolved at compile time)
                }
            - lvgl.widget.hide: ${widget_name}_hue_seg_0
            - lvgl.widget.hide: ${widget_name}_hue_seg_1
            - lvgl.widget.hide: ${widget_name}_hue_seg_2
            - lvgl.widget.hide: ${widget_name}_hue_seg_3
            - lvgl.widget.hide: ${widget_name}_hue_seg_4
            - lvgl.widget.hide: ${widget_name}_hue_seg_5
            - lvgl.widget.hide: ${widget_name}_hue_seg_6
            - lvgl.widget.hide: ${widget_name}_hue_seg_7
            - lvgl.widget.hide: ${widget_name}_hue_seg_8
            - lvgl.widget.hide: ${widget_name}_hue_seg_9
            - lvgl.widget.hide: ${widget_name}_hue_seg_10
            - lvgl.widget.hide: ${widget_name}_hue_seg_11
            - if:
                condition:
                  lambda: 'return id(${widget_name}_supports_color_temp);'
                then:
                  - lvgl.widget.show: ${widget_name}_light_arc_color_temp
                  - lvgl.widget.show: ${widget_name}_temp_seg_0
                  - lvgl.widget.show: ${widget_name}_temp_seg_1
                  - lvgl.widget.show: ${widget_name}_temp_seg_2
                  - lvgl.widget.show: ${widget_name}_temp_seg_3
                  - lvgl.widget.show: ${widget_name}_temp_seg_4
                  - lvgl.widget.show: ${widget_name}_temp_seg_5
          else:
            # HUE/SATURATION mode
            - lvgl.widget.hide: ${widget_name}_light_arc_color_temp
            - lvgl.widget.hide: ${widget_name}_temp_seg_0
            - lvgl.widget.hide: ${widget_name}_temp_seg_1
            - lvgl.widget.hide: ${widget_name}_temp_seg_2
            - lvgl.widget.hide: ${widget_name}_temp_seg_3
            - lvgl.widget.hide: ${widget_name}_temp_seg_4
            - lvgl.widget.hide: ${widget_name}_temp_seg_5
            - lvgl.widget.show: ${widget_name}_light_arc_hue
            - lvgl.widget.show: ${widget_name}_hue_seg_0
            - lvgl.widget.show: ${widget_name}_hue_seg_1
            - lvgl.widget.show: ${widget_name}_hue_seg_2
            - lvgl.widget.show: ${widget_name}_hue_seg_3
            - lvgl.widget.show: ${widget_name}_hue_seg_4
            - lvgl.widget.show: ${widget_name}_hue_seg_5
            - lvgl.widget.show: ${widget_name}_hue_seg_6
            - lvgl.widget.show: ${widget_name}_hue_seg_7
            - lvgl.widget.show: ${widget_name}_hue_seg_8
            - lvgl.widget.show: ${widget_name}_hue_seg_9
            - lvgl.widget.show: ${widget_name}_hue_seg_10
            - lvgl.widget.show: ${widget_name}_hue_seg_11
            - if:
                condition:
                  lambda: 'return id(${widget_name}_supports_hs) || id(${widget_name}_supports_rgb);'
                then:
                  - lvgl.widget.show: ${widget_name}_light_saturation_background
                  - lvgl.obj.update:
                      id: ${widget_name}_light_brightness_background
                      x: -186
                  - lvgl.obj.update:
                      id: ${widget_name}_lightbulb_btn
                      x: 80
                      y: -14
                else:
                  - lvgl.obj.update:
                      id: ${widget_name}_light_brightness_background
                      x: -60
                  - lvgl.obj.update:
                      id: ${widget_name}_lightbulb_btn
                      x: 80
                      y: -14

  # ── Recolor the bulb glow (and its halo) from hue/sat/brightness ───────
  - id: ${widget_name}_update_lightbulb_color
    then:
      - lambda: |-
          int r = 255, g = 255, b = 255;
          bool has_color_modes = id(${widget_name}_supports_hs) ||
                                 id(${widget_name}_supports_rgb) ||
                                 id(${widget_name}_supports_color_temp);
          bool is_light_on = id(${widget_name}_light_state).state;

          if (!is_light_on) {
            // OFF -> neutral gray, no halo
            r = 140; g = 146; b = 158;
          } else if (has_color_modes) {
            if (id(${widget_name}_is_temp_mode)) {
              // Kelvin -> RGB (Tanner Helland)
              float temp = id(${widget_name}_current_color_temp) / 100.0;
              if (temp <= 66) {
                r = 255;
              } else {
                r = temp - 60;
                r = 329.698727446 * pow(r, -0.1332047592);
                r = (r < 0) ? 0 : ((r > 255) ? 255 : r);
              }
              if (temp <= 66) {
                g = temp;
                g = 99.4708025861 * log(g) - 161.1195681661;
              } else {
                g = temp - 60;
                g = 288.1221695283 * pow(g, -0.0755148492);
              }
              g = (g < 0) ? 0 : ((g > 255) ? 255 : g);
              if (temp >= 66) {
                b = 255;
              } else if (temp <= 19) {
                b = 0;
              } else {
                b = temp - 10;
                b = 138.5177312231 * log(b) - 305.0447927307;
                b = (b < 0) ? 0 : ((b > 255) ? 255 : b);
              }
            } else {
              // HSV -> RGB
              float h = id(${widget_name}_current_hue);
              float s = id(${widget_name}_current_saturation) / 100.0;
              float v = 1.0;
              float c = v * s;
              float xx = c * (1 - fabs(fmod(h / 60.0, 2) - 1));
              float m = v - c;
              float rp, gp, bp;
              if (h >= 0 && h < 60)      { rp = c;  gp = xx; bp = 0;  }
              else if (h < 120)          { rp = xx; gp = c;  bp = 0;  }
              else if (h < 180)          { rp = 0;  gp = c;  bp = xx; }
              else if (h < 240)          { rp = 0;  gp = xx; bp = c;  }
              else if (h < 300)          { rp = xx; gp = 0;  bp = c;  }
              else                       { rp = c;  gp = 0;  bp = xx; }
              r = (rp + m) * 255;
              g = (gp + m) * 255;
              b = (bp + m) * 255;
            }
            float real_brightness = id(${widget_name}_current_brightness) / 255.0;
            float display = 0.6 + (real_brightness * 0.4);
            r = r * display; g = g * display; b = b * display;
          } else {
            // dimmable white light -> warm yellow
            r = 255; g = 255; b = 0;
            float real_brightness = id(${widget_name}_current_brightness) / 255.0;
            float display = id(${widget_name}_supports_brightness) ? (0.6 + (real_brightness * 0.4)) : 0.8;
            r = r * display; g = g * display; b = b * display;
          }

          uint32_t color = ((uint32_t) r << 16) | ((uint32_t) g << 8) | (uint32_t) b;
          id(${widget_name}_calc_color) = color;
      - lvgl.obj.update:
          id: ${widget_name}_lightbulb_color
          bg_color: !lambda return lv_color_hex(id(${widget_name}_calc_color));
      - lambda: |-
          // live halo: shadow takes the bulb color when ON, disappears when OFF.
          // PERF v2.5: shadow width 34 -> 16. The halo is re-rendered on every
          // slider drag tick; a 34px blurred shadow around the bulb forces a
          // large, expensive repaint per tick. 16px keeps the glow visible at
          // roughly half the redraw cost (visual: tighter halo).
          //options: stable: 34 (wide halo) | fast: 16 (applied)
          if (id(${widget_name}_lightbulb_color)) {
            if (id(${widget_name}_light_state).state) {
              lv_obj_set_style_shadow_width(id(${widget_name}_lightbulb_color), 16, 0);
              lv_obj_set_style_shadow_opa(id(${widget_name}_lightbulb_color), LV_OPA_60, 0);
              lv_obj_set_style_shadow_color(id(${widget_name}_lightbulb_color),
                  lv_color_hex(id(${widget_name}_calc_color)), 0);
            } else {
              lv_obj_set_style_shadow_width(id(${widget_name}_lightbulb_color), 0, 0);
            }
          }

  # ── Show/hide widgets based on light capabilities ──────────────────────
  - id: ${widget_name}_update_widget_visibility
    then:
      - if:
          condition:
            lambda: |-
              return id(${widget_name}_supports_hs) ||
                     id(${widget_name}_supports_rgb) ||
                     id(${widget_name}_supports_color_temp);
          then:
            - script.execute: ${widget_name}_toggle_gradient
          else:
            - lvgl.widget.hide: ${widget_name}_light_arc_hue
            - lvgl.widget.hide: ${widget_name}_light_arc_color_temp
            - lvgl.widget.hide: ${widget_name}_light_saturation_background
            - lvgl.obj.update:
                id: ${widget_name}_light_brightness_background
                x: -60
            # no ring on screen -> bulb goes back to the screen center
            - lvgl.obj.update:
                id: ${widget_name}_lightbulb_btn
                x: 0
                y: 0

  # ── Theme-aware repaint of this page (Classic/Modern/Perf/Daylight) ────
  - id: ${widget_name}_apply_theme
    then:
      - lambda: |-
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme = "Classic";
          bool day = (theme == "Daylight");
          bool perf = (theme == "Performance");

          uint32_t title_c  = 0xFFFFFF;
          uint32_t cap_c    = day ? 0xB4B8BC : (perf ? 0x888888 : 0x9BA2BC);
          uint32_t track_c  = day ? 0x232932 : (perf ? 0x222222 : 0x0F141E);
          uint32_t knob_bd  = 0xFFFFFF;
          uint32_t arc_knob_bg = day ? 0x161B26 : (perf ? 0x000000 : 0x161B26);
          uint32_t home_bg  = day ? 0x191D23 : (perf ? 0x1A1A1A : 0x2A3142);
          uint32_t home_tc  = 0xFFFFFF;

          if (id(${widget_name}_light_name_label))
            lv_obj_set_style_text_color(id(${widget_name}_light_name_label), lv_color_hex(title_c), 0);
          if (id(${widget_name}_brightness_caption))
            lv_obj_set_style_text_color(id(${widget_name}_brightness_caption), lv_color_hex(cap_c), 0);
          if (id(${widget_name}_saturation_caption))
            lv_obj_set_style_text_color(id(${widget_name}_saturation_caption), lv_color_hex(cap_c), 0);
          if (id(${widget_name}_home_caption))
            lv_obj_set_style_text_color(id(${widget_name}_home_caption), lv_color_hex(cap_c), 0);

          auto track = [&](lv_obj_t *s) {
            if (!s) return;
            lv_obj_set_style_bg_color(s, lv_color_hex(track_c), LV_PART_MAIN);
            lv_obj_set_style_border_color(s, lv_color_hex(knob_bd), LV_PART_KNOB);
          };
          track(id(${widget_name}_light_brightness_slider));
          track(id(${widget_name}_light_saturation_slider));

          auto arc_knob = [&](lv_obj_t *a) {
            if (!a) return;
            lv_obj_set_style_bg_color(a, lv_color_hex(arc_knob_bg), LV_PART_KNOB);
            lv_obj_set_style_border_color(a, lv_color_hex(day ? 0xF8953D : 0xFFFFFF), LV_PART_KNOB);
          };
          arc_knob(id(${widget_name}_light_arc_hue));
          arc_knob(id(${widget_name}_light_arc_color_temp));

          if (id(${widget_name}_home_button)) {
            lv_obj_t *hb = id(${widget_name}_home_button);
            lv_obj_set_style_bg_color(hb, lv_color_hex(home_bg), 0);
            lv_obj_set_style_bg_opa(hb, LV_OPA_COVER, 0);
            lv_obj_set_style_text_color(hb, lv_color_hex(home_tc), 0);
            lv_obj_set_style_radius(hb, day ? 14 : (perf ? 6 : 14), 0);
            if (day) {
              lv_obj_set_style_border_width(hb, 1, 0);
              lv_obj_set_style_border_color(hb, lv_color_hex(0x242A33), 0);
              lv_obj_set_style_shadow_width(hb, 8, 0);
              lv_obj_set_style_shadow_opa(hb, LV_OPA_20, 0);
              lv_obj_set_style_shadow_color(hb, lv_color_hex(0x000000), 0);
              lv_obj_set_style_shadow_offset_y(hb, 2, 0);
            } else {
              lv_obj_set_style_border_width(hb, 0, 0);
              lv_obj_set_style_shadow_width(hb, 0, 0);
            }
          }
