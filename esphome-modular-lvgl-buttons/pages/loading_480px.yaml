---
# Optimized loading screen - fast boot, minimal delays
globals:
  - id: ha_connected
    type: bool
    initial_value: 'false'

image:
  - platform: file
    file: 'esphome-modular-lvgl-buttons/assets/images/loading/homeassistant.png'
    id: ha_img
    resize: 300x61
    type: RGB565
  - platform: file
    file: 'esphome-modular-lvgl-buttons/assets/images/loading/esphome.png'
    id: esphome_img
    resize: 240x71
    type: RGB565

lvgl:
  top_layer:
    widgets:
      - obj:
          id: loading_page
          bg_image_src: sync4
          width: ${screen_width}
          height: ${screen_height}
          radius: 0
          pad_all: 0
          border_width: 0
          clickable: true
          on_click:
            - lvgl.widget.hide: loading_page
          widgets:
            - image:
                y: 40
                align: top_mid
                src: ha_img
            - obj:
                id: boot_homeassistant
                y: 170
                width: 350
                height: 80
                pad_all: 0
                align: top_mid
                bg_opa: transp
                border_width: 0
                widgets:
                  - label:
                      id: boot_homeassistant_label
                      align: center
                      text_font: nunito_20
                      text_color: misty_blue
                      text: "Booting..."
                  - spinner:
                      id: boot_homeassistant_spiner
                      y: 35
                      width: 40
                      height: 40
                      align: top_mid
                      spin_time: 1s
                      arc_length: 60deg
                      arc_width: 4
                      arc_color: steel_blue
                      indicator:
                        arc_color: misty_blue
                        arc_width: 4
            - obj:
                id: boot_synchronization
                y: 170
                width: 300
                height: 60
                pad_all: 0
                align: top_mid
                bg_opa: transp
                border_width: 0
                hidden: true
                widgets:
                  - label:
                      id: boot_synchronization_label
                      align: top_mid
                      text_font: nunito_20
                      text_color: misty_blue
                      text: "Sync..."
                  - bar:
                      id: boot_synchronization_bar
                      y: 5
                      width: 260
                      height: 10
                      value: 0
                      align: bottom_mid
                      min_value: 0
                      max_value: 100
                      bg_color: steel_blue
                      indicator:
                        bg_color: misty_blue
            - image:
                y: -25
                align: bottom_mid
                src: esphome_img

script:
  - id: update_loading_page
    mode: restart
    then:
      - lvgl.label.update:
          id: boot_homeassistant_label
          text: 'Connecting to HA...'
      - lvgl.widget.show: boot_homeassistant
      - lvgl.widget.hide: boot_synchronization
      - lvgl.widget.show: boot_homeassistant_spiner
      - delay: 8s
      - if:
          condition:
            lambda: 'return !id(ha_connected);'
          then:
            - lvgl.label.update:
                id: boot_homeassistant_label
                text: 'Offline — auto retry'

  - id: check_boot_status
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ha_connected);'
          then:
            - lvgl.widget.hide: boot_homeassistant
            - lvgl.widget.show: boot_synchronization
            - lvgl.bar.update:
                id: boot_synchronization_bar
                value: 20
            - lvgl.page.show: main_page
            - delay: 150ms
            - lvgl.bar.update:
                id: boot_synchronization_bar
                value: 100
            - delay: 200ms
            - lvgl.widget.hide: loading_page

  - id: start_sync_animation
    mode: restart
    then:
      - script.execute: check_boot_status

  - id: on_ha_connected
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(ha_connected);'
          then:
            - globals.set:
                id: ha_connected
                value: 'true'
            - lvgl.label.update:
                id: boot_homeassistant_label
                text: "Connected!"
            - lvgl.label.update:
                id: ha_connection_label
                text: "Connected"
            - lvgl.widget.hide: boot_homeassistant_spiner
            - lvgl.widget.enable:
                - ac_main_temp_arc
                - ac_main_power_btn
                - ac_main_mode_btn
                - ac_main_fan_btn
                - ac_main_swing_btn
                - ac_main_eco_btn
                - ac_main_sleep_btn
                - ac_main_turbo_btn
            - script.execute: check_boot_status

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_connected

  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - globals.set:
              id: ha_connected
              value: 'false'
          - lvgl.label.update:
              id: ha_connection_label
              text: "Offline"
          - lvgl.label.update:
              id: boot_homeassistant_label
              text: 'HA disconnected'
          - lvgl.widget.show: loading_page
          - lvgl.widget.show: boot_homeassistant
          - lvgl.widget.hide: boot_synchronization
          - lvgl.widget.disable:
              - ac_main_temp_arc
              - ac_main_power_btn
              - ac_main_mode_btn
              - ac_main_fan_btn
              - ac_main_swing_btn
              - ac_main_eco_btn
              - ac_main_sleep_btn
              - ac_main_turbo_btn
          - script.execute: update_loading_page
