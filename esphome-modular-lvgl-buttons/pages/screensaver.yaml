---
# Optimized screensaver - lean, fast
script:
  - id: time_update
    mode: restart
    then:
      - lvgl.label.update:
          id: screensaver_time
          text: !lambda 'return id(system_time).now().strftime("%H:%M");'
      - lvgl.label.update:
          id: screensaver_date
          text: !lambda |-
            // Screensaver date in Georgian (ka_GE, default) or English.
            // Georgian names use UTF-8 hex escapes; English is plain ASCII.
            // t.day_of_week is 1..7 (Sunday == 7), so % 7 indexes Sunday first.
            // Language comes from the `screensaver_language` select
            // (Settings page "Saver lang" row, or HA select entity).
            static const char *DAYS[] = {
              "\xE1\x83\x99\xE1\x83\x95\xE1\x83\x98\xE1\x83\xA0\xE1\x83\x90",  // kvira - Sunday
              "\xE1\x83\x9D\xE1\x83\xA0\xE1\x83\xA8\xE1\x83\x90\xE1\x83\x91\xE1\x83\x90\xE1\x83\x97\xE1\x83\x98",  // orshabati - Monday
              "\xE1\x83\xA1\xE1\x83\x90\xE1\x83\x9B\xE1\x83\xA8\xE1\x83\x90\xE1\x83\x91\xE1\x83\x90\xE1\x83\x97\xE1\x83\x98",  // samshabati - Tuesday
              "\xE1\x83\x9D\xE1\x83\x97\xE1\x83\xAE\xE1\x83\xA8\xE1\x83\x90\xE1\x83\x91\xE1\x83\x90\xE1\x83\x97\xE1\x83\x98",  // otkhshabati - Wednesday
              "\xE1\x83\xAE\xE1\x83\xA3\xE1\x83\x97\xE1\x83\xA8\xE1\x83\x90\xE1\x83\x91\xE1\x83\x90\xE1\x83\x97\xE1\x83\x98",  // khutshabati - Thursday
              "\xE1\x83\x9E\xE1\x83\x90\xE1\x83\xA0\xE1\x83\x90\xE1\x83\xA1\xE1\x83\x99\xE1\x83\x94\xE1\x83\x95\xE1\x83\x98",  // paraskevi - Friday
              "\xE1\x83\xA8\xE1\x83\x90\xE1\x83\x91\xE1\x83\x90\xE1\x83\x97\xE1\x83\x98"  // shabati - Saturday
            };
            static const char *MONTHS[] = {
              "\xE1\x83\x98\xE1\x83\x90\xE1\x83\x9C\xE1\x83\x95\xE1\x83\x90\xE1\x83\xA0\xE1\x83\x98",  // ianvari
              "\xE1\x83\x97\xE1\x83\x94\xE1\x83\x91\xE1\x83\x94\xE1\x83\xA0\xE1\x83\x95\xE1\x83\x90\xE1\x83\x9A\xE1\x83\x98",  // tebervali
              "\xE1\x83\x9B\xE1\x83\x90\xE1\x83\xA0\xE1\x83\xA2\xE1\x83\x98",  // marti
              "\xE1\x83\x90\xE1\x83\x9E\xE1\x83\xA0\xE1\x83\x98\xE1\x83\x9A\xE1\x83\x98",  // aprili
              "\xE1\x83\x9B\xE1\x83\x90\xE1\x83\x98\xE1\x83\xA1\xE1\x83\x98",  // maisi
              "\xE1\x83\x98\xE1\x83\x95\xE1\x83\x9C\xE1\x83\x98\xE1\x83\xA1\xE1\x83\x98",  // ivnisi
              "\xE1\x83\x98\xE1\x83\x95\xE1\x83\x9A\xE1\x83\x98\xE1\x83\xA1\xE1\x83\x98",  // ivlisi
              "\xE1\x83\x90\xE1\x83\x92\xE1\x83\x95\xE1\x83\x98\xE1\x83\xA1\xE1\x83\xA2\xE1\x83\x9D",  // agvisto
              "\xE1\x83\xA1\xE1\x83\x94\xE1\x83\xA5\xE1\x83\xA2\xE1\x83\x94\xE1\x83\x9B\xE1\x83\x91\xE1\x83\x94\xE1\x83\xA0\xE1\x83\x98",  // sektemberi
              "\xE1\x83\x9D\xE1\x83\xA5\xE1\x83\xA2\xE1\x83\x9D\xE1\x83\x9B\xE1\x83\x91\xE1\x83\x94\xE1\x83\xA0\xE1\x83\x98",  // oktomberi
              "\xE1\x83\x9C\xE1\x83\x9D\xE1\x83\x94\xE1\x83\x9B\xE1\x83\x91\xE1\x83\x94\xE1\x83\xA0\xE1\x83\x98",  // noemberi
              "\xE1\x83\x93\xE1\x83\x94\xE1\x83\x99\xE1\x83\x94\xE1\x83\x9B\xE1\x83\x91\xE1\x83\x94\xE1\x83\xA0\xE1\x83\x98"  // dekemberi
            };
            static const char *DAYS_EN[] = {
              "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
            };
            // Months abbreviated: full "Wednesday, 28 September" is 487px at
            // 32px DejaVu Bold (screen is 480px). Abbreviated longest
            // "Wednesday, 28 May" is 363px - fits with margin.
            static const char *MONTHS_EN[] = {
              "Jan", "Feb", "Mar", "Apr", "May", "Jun",
              "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
            };
            auto t = id(system_time).now();
            // Empty before first boot restore == Georgian (factory default).
            bool english = (id(screensaver_language).current_option() == "English");
            const char **days = english ? DAYS_EN : DAYS;
            const char **months = english ? MONTHS_EN : MONTHS;
            int m = (t.month >= 1 && t.month <= 12) ? (t.month - 1) : 0;
            char b[64];
            snprintf(b, sizeof(b), "%s, %d %s", days[t.day_of_week % 7], t.day_of_month, months[m]);
            return std::string(b);

  - id: update_weather_image
    mode: restart
    then:
      - lvgl.image.update:
          id: screensaver_icon
          src: !lambda |-
            std::string c = id(weather_condition).state;
            if (c=="clear-night") return id(weather_clear_night);
            if (c=="cloudy") return id(weather_cloudy);
            if (c=="fog") return id(weather_fog);
            if (c=="hail") return id(weather_hail);
            if (c=="lightning") return id(weather_lightning);
            if (c=="lightning-rainy") return id(weather_lightning_rainy);
            if (c=="partlycloudy") return id(weather_partlycloudy_sun);
            if (c=="pouring") return id(weather_pouring);
            if (c=="rainy") return id(weather_rainy);
            if (c=="snowy") return id(weather_snowy);
            if (c=="snowy-rainy") return id(weather_snowy_rainy);
            if (c=="sunny") return id(weather_sunny);
            if (c=="windy") return id(weather_windy);
            if (c=="windy-variant") return id(weather_windy_variant);
            return id(weather_sunny);

sensor:
  - platform: homeassistant
    entity_id: "${weather_entity}"
    attribute: temperature
    id: weather_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: screensaver_temp
          text:
            format: "%.0f°"
            args: [ 'id(weather_temp).state' ]
  - platform: homeassistant
    entity_id: "${weather_entity}"
    attribute: humidity
    id: weather_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: screensaver_humidity
          text:
            format: "%.0f%%"
            args: [ 'id(weather_humidity).state' ]
  - platform: homeassistant
    entity_id: "${weather_entity}"
    attribute: wind_speed
    id: weather_wind
    internal: true
    on_value:
      - lvgl.label.update:
          id: screensaver_wind
          text:
            format: "%.0f km/h"
            args: [ 'id(weather_wind).state' ]

text_sensor:
  - platform: homeassistant
    entity_id: "${weather_entity}"
    id: weather_condition
    internal: true
    on_value:
      - script.execute: update_weather_image

# Screensaver date language: Georgian (default) or English.
# On-device: Settings page "Saver lang" row (GE/EN buttons).
# Home Assistant: select.<device>_screensaver_language. Persistent (restore_value).
select:
  - platform: template
    id: screensaver_language
    name: "Screensaver Language"
    options: [Georgian, English]
    initial_option: Georgian
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: time_update
      - script.execute: update_settings_highlight

lvgl:
  pages:
    - id: screensaver_page
      bg_image_src: screensaver_bg_image3
      bg_opa: cover
      widgets:
        - label:
            id: screensaver_time
            text: "--:--"
            text_font: bold_time_148
            align: top_mid
            y: 16
            text_color: white
        - label:
            id: screensaver_date
            text: "..."
            text_font: bold_geo_32
            align: top_mid
            y: 206
            text_color: white
        - obj:
            y: 296
            width: 460
            height: 150
            align: top_mid
            bg_opa: transp
            border_width: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - label:
                  id: screensaver_temp
                  text: "--°"
                  text_font: bold_96
                  text_color: white
              - image:
                  id: screensaver_icon
                  src: weather_sunny
              - obj:
                  width: 124
                  height: 90
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                  widgets:
                    - label:
                        id: screensaver_humidity
                        text: "--%"
                        text_font: bold_28
                        text_color: white
                    - label:
                        id: screensaver_wind
                        text: "--"
                        text_font: bold_24
                        text_color: 0xCCCCCC
        - button:
            id: screensaver_exit_btn
            width: 100%
            height: 100%
            bg_opa: transp
            border_width: 0
            on_click:
              - lvgl.page.show: main_page
