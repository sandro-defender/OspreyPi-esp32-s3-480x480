---
# Optimized screensaver - lean, fast
script:
  - id: time_update
    mode: restart
    then:
      - lvgl.label.update:
          id: screensaver_time
          text: !lambda 'return id(system_time).now().strftime("%H:%M");'
      - lvgl.label.update:
          id: screensaver_date
          text: !lambda |-
            static const char *DAYS[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
            static const char *MONTHS[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
            auto t = id(system_time).now();
            char b[48]; snprintf(b,sizeof(b),"%s, %02d %s", DAYS[t.day_of_week%7], t.day_of_month, MONTHS[t.month-1]);
            return std::string(b);

  - id: update_weather_image
    mode: restart
    then:
      - lvgl.image.update:
          id: screensaver_icon
          src: !lambda |-
            std::string c = id(weather_condition).state;
            if (c=="clear-night") return id(weather_clear_night);
            if (c=="cloudy") return id(weather_cloudy);
            if (c=="fog") return id(weather_fog);
            if (c=="hail") return id(weather_hail);
            if (c=="lightning") return id(weather_lightning);
            if (c=="lightning-rainy") return id(weather_lightning_rainy);
            if (c=="partlycloudy") return id(weather_partlycloudy_sun);
            if (c=="pouring") return id(weather_pouring);
            if (c=="rainy") return id(weather_rainy);
            if (c=="snowy") return id(weather_snowy);
            if (c=="snowy-rainy") return id(weather_snowy_rainy);
            if (c=="sunny") return id(weather_sunny);
            if (c=="windy") return id(weather_windy);
            if (c=="windy-variant") return id(weather_windy_variant);
            return id(weather_sunny);

sensor:
  - platform: homeassistant
    entity_id: "${weather_entity}"
    attribute: temperature
    id: weather_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: screensaver_temp
          text:
            format: "%.0f°"
            args: [ 'id(weather_temp).state' ]
  - platform: homeassistant
    entity_id: "${weather_entity}"
    attribute: humidity
    id: weather_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: screensaver_humidity
          text:
            format: "%.0f%%"
            args: [ 'id(weather_humidity).state' ]
  - platform: homeassistant
    entity_id: "${weather_entity}"
    attribute: wind_speed
    id: weather_wind
    internal: true
    on_value:
      - lvgl.label.update:
          id: screensaver_wind
          text:
            format: "%.0f km/h"
            args: [ 'id(weather_wind).state' ]

text_sensor:
  - platform: homeassistant
    entity_id: "${weather_entity}"
    id: weather_condition
    internal: true
    on_value:
      - script.execute: update_weather_image

lvgl:
  pages:
    - id: screensaver_page
      bg_image_src: screensaver_bg_image3
      bg_opa: cover
      widgets:
        - label:
            id: screensaver_time
            text: "--:--"
            text_font: nunito_120
            align: top_mid
            y: 50
            text_color: white
        - label:
            id: screensaver_date
            text: "..."
            text_font: nunito_24
            align: top_mid
            y: 180
            text_color: white
        - obj:
            y: 280
            width: 440
            height: 140
            align: top_mid
            bg_opa: transp
            border_width: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - label:
                  id: screensaver_temp
                  text: "--°"
                  text_font: nunito_72
                  text_color: white
              - image:
                  id: screensaver_icon
                  src: weather_sunny
              - obj:
                  width: 100
                  height: 80
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                  widgets:
                    - label:
                        id: screensaver_humidity
                        text: "--%"
                        text_font: nunito_20
                        text_color: white
                    - label:
                        id: screensaver_wind
                        text: "--"
                        text_font: nunito_18
                        text_color: 0xCCCCCC
        - button:
            id: screensaver_exit_btn
            width: 100%
            height: 100%
            bg_opa: transp
            border_width: 0
            on_click:
              - lvgl.page.show: main_page
