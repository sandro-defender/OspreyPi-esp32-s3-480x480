        # ── Restart / Home ───────────────────────────────────────────
        - obj:
            align: bottom_mid
            y: -10
            width: 456
            height: 44
            bg_opa: transp
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
