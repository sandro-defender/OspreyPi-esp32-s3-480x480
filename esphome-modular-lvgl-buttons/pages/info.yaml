      bg_color: 0x11151C
      bg_opa: cover
      widgets:
        - obj:
            align: top_mid
            y: 10
            width: 456
            height: 40
            radius: 10
            bg_color: 0x252B38
            bg_opa: cover
            border_width: 0
            pad_left: 14
            pad_right: 14
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
