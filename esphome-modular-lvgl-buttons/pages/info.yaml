              # FIXED: proper Home button (was a plain "Exit" with a left arrow)
              - button:
                  id: info_home_btn
                  width: 224
                  height: 44
                  radius: 10
                  bg_color: 0xFF6600
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: center
                    flex_align_cross: center
                    pad_column: 8
                  widgets:
                    - label:
                        text: $mdi_home
                        text_font: mdi_icons_22
                    - label:
                        text: "Home"
                        text_font: nunito_20
                  on_click:
                    - lvgl.page.show: main_page

        # ── fallback AP QR (only when WiFi is down) ───────────────────
        - obj:
            id: ap_mode_qr_container
            align: center
            width: 140
            height: 140
            radius: 12
            bg_color: 0x1E2530
            bg_opa: cover
            border_width: 0
            hidden: true
            widgets:
              - qrcode:
                  id: ap_mode_qr
                  align: center
                  size: 110
                  text: "WIFI:S:${fallback_ap_ssid};T:nopass;;"

interval:
  # PERF v2.4: the 1 s tick used to run update_uptime unconditionally (forever,
  # even with the Info page hidden). It is now gated to the Info page, so the
  # other ~95% of the time this timer does nothing.
  #options: stable: 1s ungated | fast: 1s only while info page showing (applied)
  - interval: 1s
    then:
      - if:
          condition:
            lvgl.page.is_showing: info_screen
          then:
            - script.execute: update_uptime
