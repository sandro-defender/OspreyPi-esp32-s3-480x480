---
# Optimized info page - faster rendering, less frequent updates
script:
  - id: update_uptime
    then:
      - lvgl.label.update:
          id: uptime_label
          text: !lambda |-
            int s = millis()/1000;
            int d = s/86400; int h = (s%86400)/3600; int m = (s%3600)/60;
            char b[24];
            if (d>0) snprintf(b,sizeof(b),"%dd %dh %dm",d,h,m);
            else if (h>0) snprintf(b,sizeof(b),"%dh %dm",h,m);
            else snprintf(b,sizeof(b),"%dm",m);
            return std::string(b);

binary_sensor:
  - platform: status
    id: wifi_status
    internal: true
    on_state:
      - if:
          condition:
            lambda: 'return !id(wifi_status).state;'
          then:
            - lvgl.widget.show: ap_mode_qr_container
            - lvgl.qrcode.update:
                id: ap_mode_qr
                text: !lambda |-
                  char b[64]; snprintf(b,sizeof(b),"WIFI:S:${fallback_ap_ssid};T:nopass;;"); return std::string(b);
          else:
            - lvgl.widget.hide: ap_mode_qr_container

sensor:
  - platform: template
    id: free_heap_sensor
    internal: true
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: free_heap_label
          text: !lambda |-
            char b[16]; snprintf(b,sizeof(b),"%.0f KB",x/1024.0); return std::string(b);
  - platform: template
    id: free_psram_sensor
    internal: true
    lambda: return heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: free_psram_label
          text: !lambda |-
            char b[16]; snprintf(b,sizeof(b),"%.1f MB",x/1024.0/1024.0); return std::string(b);

lvgl:
  style_definitions:
    - id: info_label_style
      text_font: nunito_18
      text_color: 0x888888
    - id: info_value_style
      text_font: nunito_18
      text_color: white

  pages:
    - id: info_screen
      bg_color: 0x11151C
      widgets:
        - obj:
            width: 100%
            height: 430
            bg_opa: transp
            border_width: 0
            pad_all: 8
            layout:
              type: flex
              flex_flow: column
              pad_row: 4
            widgets:
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "Device:"
                    - label:
                        id: device_name_label
                        styles: info_value_style
                        text: "${device_name}"
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "ESPHome:"
                    - label:
                        id: esphome_version_label
                        styles: info_value_style
                        text: "${project_version}"
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "Build:"
                    - label:
                        styles: info_value_style
                        text:
                          format: "%s"
                          args: [__DATE__]
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "Uptime:"
                    - label:
                        id: uptime_label
                        styles: info_value_style
                        text: "..."
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "WiFi:"
                    - label:
                        id: connected_ssid_label
                        styles: info_value_style
                        text: "..."
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "IP:"
                    - label:
                        id: ip_address_label
                        styles: info_value_style
                        text: "0.0.0.0"
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "MAC:"
                    - label:
                        id: connected_mac_label
                        styles: info_value_style
                        text: "..."
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "Signal:"
                    - label:
                        id: wifi_signal_db_percent_label
                        styles: info_value_style
                        text: "..."
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "CPU:"
                    - label:
                        id: cpu_temp_label
                        styles: info_value_style
                        text: "..."
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "Heap:"
                    - label:
                        id: free_heap_label
                        styles: info_value_style
                        text: "..."
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "PSRAM:"
                    - label:
                        id: free_psram_label
                        styles: info_value_style
                        text: "..."
              - obj:
                  width: 100%
                  height: 28
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                  widgets:
                    - label:
                        styles: info_label_style
                        text: "HA:"
                    - label:
                        id: ha_connection_label
                        styles: info_value_style
                        text: "Connecting..."

              - obj:
                  width: 100%
                  height: 50
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_evenly
                    flex_align_cross: center
                  widgets:
                    - button:
                        width: 140
                        height: 38
                        radius: 10
                        bg_color: 0x555555
                        border_width: 0
                        widgets:
                          - label:
                              align: center
                              text: "Restart"
                              text_font: nunito_18
                        on_click:
                          - button.press: restart_device
                    - obj:
                        id: ap_mode_qr_container
                        width: 120
                        height: 120
                        bg_opa: transp
                        border_width: 0
                        hidden: true
                        widgets:
                          - qrcode:
                              id: ap_mode_qr
                              align: center
                              size: 90
                              text: "WIFI:S:${fallback_ap_ssid};T:nopass;;"

        - button:
            align: bottom_right
            x: -10
            y: -8
            width: 80
            height: 38
            radius: 10
            bg_color: 0xFF6600
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "Exit"
                  text_font: nunito_18
                  text_color: white
            on_click:
              - lvgl.page.show: main_page

interval:
  - interval: 60s
    then:
      - script.execute: update_uptime
