---
# Info page — matches the mockup (docs/images/screen_settings.png):
# dark rows with alternating shading, device header, live values right-aligned,
# HA status with green dot, Restart / Exit buttons at the bottom.

script:
  - id: update_uptime
    then:
      - lvgl.label.update:
          id: uptime_label
          text: !lambda |-
            int s = millis()/1000;
            int d = s/86400; int h = (s%86400)/3600; int m = (s%3600)/60; int sec = s%60;
            char b[32];
            if (d>0) snprintf(b,sizeof(b),"%dd %dh %dm %ds",d,h,m,sec);
            else if (h>0) snprintf(b,sizeof(b),"%dh %dm %ds",h,m,sec);
            else snprintf(b,sizeof(b),"%dm %ds",m,sec);
            return std::string(b);

# Theme-aware repaint of the info page (rows, header, buttons).
# Called by apply_display_theme on every theme switch and at boot.
  - id: apply_info_theme
    mode: restart
    then:
      - lambda: |-
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme = "Classic";
          bool day = (theme == "Daylight");
          bool perf = (theme == "Performance");
          bool modern = (theme == "Modern");

          uint32_t row_a = day ? 0x191D23 : (perf ? 0x141414 : (modern ? 0x1E2530 : 0x1E2530));
          uint32_t row_b = day ? 0x14181E : (perf ? 0x0A0A0A : (modern ? 0x151A24 : 0x151A24));
          uint32_t hdr   = day ? 0x191D23 : (perf ? 0x141414 : (modern ? 0x252B38 : 0x252B38));
          uint32_t key_c = day ? 0xB4B8BC : (perf ? 0x888888 : 0x8891A0);
          uint32_t val_c = (perf ? 0xCCCCCC : 0xFFFFFF);

          lv_obj_t* rows[] = { id(info_row_build), id(info_row_uptime), id(info_row_wifi),
                               id(info_row_ip), id(info_row_mac), id(info_row_signal),
                               id(info_row_cpu), id(info_row_heap), id(info_row_psram),
                               id(info_row_ha) };
          for (int i = 0; i < 10; i++) {
            lv_obj_t *r = rows[i];
            if (!r) continue;
            lv_obj_set_style_bg_color(r, lv_color_hex(i % 2 == 0 ? row_a : row_b), 0);
            lv_obj_set_style_bg_opa(r, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(r, day ? 18 : (perf ? 3 : 8), 0);
            if (day) {
              lv_obj_set_style_border_width(r, 1, 0);
              lv_obj_set_style_border_color(r, lv_color_hex(0x242A33), 0);
              lv_obj_set_style_shadow_width(r, 6, 0);
              lv_obj_set_style_shadow_opa(r, LV_OPA_20, 0);
              lv_obj_set_style_shadow_color(r, lv_color_hex(0x000000), 0);
            } else {
              lv_obj_set_style_border_width(r, 0, 0);
              lv_obj_set_style_shadow_width(r, 0, 0);
            }
            // children: [0] = key label, [1] = value label (HA row keeps its live color)
            lv_obj_t *k = lv_obj_get_child(r, 0);
            lv_obj_t *v = lv_obj_get_child(r, 1);
            if (k) lv_obj_set_style_text_color(k, lv_color_hex(key_c), 0);
            if (v && i != 9) lv_obj_set_style_text_color(v, lv_color_hex(val_c), 0);
          }
          if (id(info_header)) {
            lv_obj_set_style_bg_color(id(info_header), lv_color_hex(hdr), 0);
            lv_obj_set_style_bg_opa(id(info_header), LV_OPA_COVER, 0);
            lv_obj_set_style_radius(id(info_header), day ? 18 : (perf ? 3 : 10), 0);
            if (day) {
              lv_obj_set_style_border_width(id(info_header), 1, 0);
              lv_obj_set_style_border_color(id(info_header), lv_color_hex(0x242A33), 0);
              lv_obj_set_style_shadow_width(id(info_header), 8, 0);
              lv_obj_set_style_shadow_opa(id(info_header), LV_OPA_20, 0);
              lv_obj_set_style_shadow_color(id(info_header), lv_color_hex(0x000000), 0);
            } else {
              lv_obj_set_style_border_width(id(info_header), 0, 0);
              lv_obj_set_style_shadow_width(id(info_header), 0, 0);
            }
            lv_obj_t *t = lv_obj_get_child(id(info_header), 0);
            lv_obj_t *v = lv_obj_get_child(id(info_header), 1);
            if (t) lv_obj_set_style_text_color(t, lv_color_hex(0xFFFFFF), 0);
            if (v) lv_obj_set_style_text_color(v, lv_color_hex(0x9BA2BC), 0);
          }
          auto btn = [&](lv_obj_t *b, bool accent) {
            if (!b) return;
            uint32_t bg = accent ? 0xFF6600
                                 : (perf ? 0x1A1A1A : 0x2A3142);
            lv_obj_set_style_bg_color(b, lv_color_hex(bg), 0);
            lv_obj_set_style_bg_opa(b, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(b, (perf ? 4 : 10), 0);
            lv_obj_set_style_text_color(b, lv_color_hex(0xFFFFFF), 0);
            if (day) {
              lv_obj_set_style_border_width(b, 1, 0);
              lv_obj_set_style_border_color(b, lv_color_hex(0x242A33), 0);
              lv_obj_set_style_shadow_width(b, 8, 0);
              lv_obj_set_style_shadow_opa(b, LV_OPA_20, 0);
              lv_obj_set_style_shadow_color(b, lv_color_hex(0x000000), 0);
            } else {
              lv_obj_set_style_border_width(b, 0, 0);
              lv_obj_set_style_shadow_width(b, 0, 0);
            }
          };
          btn(id(info_restart_btn), false);
          btn(id(info_home_btn), true);

binary_sensor:
  - platform: status
    id: wifi_status
    internal: true
    on_state:
      - if:
          condition:
            lambda: 'return !id(wifi_status).state;'
          then:
            - lvgl.widget.show: ap_mode_qr_container
            - lvgl.qrcode.update:
                id: ap_mode_qr
                text: !lambda |-
                  char b[64]; snprintf(b,sizeof(b),"WIFI:S:${fallback_ap_ssid};T:nopass;;"); return std::string(b);
          else:
            - lvgl.widget.hide: ap_mode_qr_container

sensor:
  - platform: template
    id: free_heap_sensor
    internal: true
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: free_heap_label
          text: !lambda |-
            float total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
            float used_pct = total > 0 ? 100.0f * (total - x) / total : 0.0f;
            char b[24]; snprintf(b,sizeof(b),"%.1f KB / %.1f%%",x/1024.0,used_pct); return std::string(b);
  - platform: template
    id: free_psram_sensor
    internal: true
    lambda: return heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: free_psram_label
          text: !lambda |-
            float total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);
            float used_pct = total > 0 ? 100.0f * (total - x) / total : 0.0f;
            char b[24]; snprintf(b,sizeof(b),"%.1f MB / %.1f%%",x/1024.0/1024.0,used_pct); return std::string(b);

lvgl:
  pages:
    - id: info_screen
      bg_color: 0x11151C
      bg_opa: cover
      widgets:
        - obj:
            id: info_header
            align: top_mid
            y: 10
            width: 456
            height: 40
            radius: 10
            bg_color: 0x252B38
            bg_opa: cover
            border_width: 0
            pad_left: 14
            pad_right: 14
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - label:
                  id: device_name_label
                  text: "Device ${device_name}"
                  text_font: nunito_24
                  text_color: white
              - label:
                  text: "ESPHome ${project_version}"
                  text_font: nunito_24
                  text_color: 0x9BA2BC

        - obj:
            align: top_mid
            y: 58
            width: 456
            height: 352
            bg_opa: transp
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: column
              pad_row: 3
            widgets:
              # ── rows (alternating shading like the mockup) ──────────
              - obj:
                  id: info_row_build
                  width: 456
                  height: 32
                  radius: 8
                  bg_color: 0x1E2530
                  bg_opa: cover
                  border_width: 0
                  pad_left: 14
                  pad_right: 14
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
