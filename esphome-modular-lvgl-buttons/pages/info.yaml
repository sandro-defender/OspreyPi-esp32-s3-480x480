                  bg_color: 0x151A24
                  bg_opa: cover
                  border_width: 0
                  pad_left: 14
                  pad_right: 14
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        text: "Uptime"
                        text_font: nunito_20
                        text_color: 0x8891A0
                    - label:
                        id: uptime_label
