---
# Enhanced AC control with 3 themes support
# Theme 1 Classic: original dark, Theme 2 Modern: like mockup images (green/blue/orange), Theme 3 Performance: minimal gray

globals:
  - id: ${widget_name}_target_temp
    type: float
    initial_value: '24.0'
  - id: ${widget_name}_current_temp
    type: float
    initial_value: '24.0'

binary_sensor:
  - platform: homeassistant
    id: ${widget_name}_power_state
    entity_id: "${climate_entity}"
    attribute: state
    on_state:
      - lambda: |-
          auto btn = id(${widget_name}_power_btn);
          if (!btn) return;
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme="Classic";
          if (x) {
            if (theme=="Modern") lv_obj_set_style_bg_color(btn, lv_color_hex(0x00E676), 0);
            else if (theme=="Performance") lv_obj_set_style_bg_color(btn, lv_color_hex(0x444444), 0);
            else lv_obj_set_style_bg_color(btn, lv_color_hex(0x4CAF50), 0);
            lv_obj_set_style_text_color(btn, lv_color_hex(theme=="Modern"?0x000000:0xFFFFFF), 0);
          } else {
            uint32_t off = (theme=="Modern") ? 0x2A2E3A : (theme=="Performance" ? 0x1A1A1A : 0x333333);
            lv_obj_set_style_bg_color(btn, lv_color_hex(off), 0);
          }
      - lvgl.label.update:
          id: ${widget_name}_power_label
          text: !lambda |-
            return std::string(x ? "ON" : "OFF");

text_sensor:
  - platform: homeassistant
    id: ${widget_name}_hvac_mode
    entity_id: "${climate_entity}"
    attribute: hvac_mode
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_mode_label
          text: !lambda return x;
      - lambda: |-
          auto btn = id(${widget_name}_mode_btn);
          if (!btn) return;
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme="Classic";
          uint32_t col = 0x555555;
          if (x == "cool") col = (theme=="Modern") ? 0x29B6F6 : 0x2196F3;
          else if (x == "heat") col = 0xFF9800;
          else if (x == "dry") col = (theme=="Modern") ? 0xFFCA28 : 0xFFEB3B;
          else if (x == "fan_only") col = (theme=="Modern") ? 0x66BB6A : 0x4CAF50;
          else if (x == "auto") col = 0x9C27B0;
          else if (x == "off") col = (theme=="Modern") ? 0x2A2E3A : (theme=="Performance" ? 0x1A1A1A : 0x555555);
          else col = 0x607D8B;
          if (theme=="Performance" && x!="off") col = 0x444444;
          lv_obj_set_style_bg_color(btn, lv_color_hex(col), 0);
          if (theme=="Modern" && (x=="cool"||x=="dry")) lv_obj_set_style_text_color(btn, lv_color_hex(0x000000), 0);
          else lv_obj_set_style_text_color(btn, lv_color_white(), 0);

  - platform: homeassistant
    id: ${widget_name}_fan_mode
    entity_id: "${climate_entity}"
    attribute: fan_mode
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_fan_label
          text: !lambda return x;
      - lambda: |-
          auto btn = id(${widget_name}_fan_btn);
          if (!btn) return;
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme="Classic";
          // Fan button shows active when not auto? Keep gray but highlight if high
          std::string mode = x;
          uint32_t col = (theme=="Modern") ? 0x3A3F4E : (theme=="Performance" ? 0x1A1A1A : 0x555555);
          if (mode=="high") col = (theme=="Modern") ? 0xFF8C00 : 0xFF9800;
          lv_obj_set_style_bg_color(btn, lv_color_hex(col), 0);

  - platform: homeassistant
    id: ${widget_name}_swing_mode
    entity_id: "${climate_entity}"
    attribute: swing_mode
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_swing_label
          text: !lambda |-
            if (x=="off" || x=="") return std::string("SWING OFF");
            std::string up=x; for(auto &c:up) c=toupper(c);
            return up;
      - lambda: |-
          auto btn = id(${widget_name}_swing_btn);
          if (!btn) return;
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme="Classic";
          bool active = !(x=="off" || x=="");
          uint32_t col;
          if (active) {
            if (theme=="Modern") col = 0x03A9F4;
            else if (theme=="Performance") col = 0x444444;
            else col = 0x03A9F4;
          } else {
            col = (theme=="Modern") ? 0x2A2E3A : (theme=="Performance" ? 0x1A1A1A : 0x555555);
          }
          lv_obj_set_style_bg_color(btn, lv_color_hex(col), 0);

  - platform: homeassistant
    id: ${widget_name}_preset_mode
    entity_id: "${climate_entity}"
    attribute: preset_mode
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_preset_label
          text: !lambda |-
            if (x=="" || x=="none") return std::string("NORMAL");
            std::string up=x; for(auto &c:up) c=toupper(c);
            return up;
      - lambda: |-
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme="Classic";
          uint32_t inactive = (theme=="Modern") ? 0x2A2E3A : (theme=="Performance" ? 0x1A1A1A : 0x555555);
          uint32_t eco_col = (x=="eco") ? ((theme=="Modern") ? 0x00E676 : 0x4CAF50) : inactive;
          uint32_t sleep_col = (x=="sleep") ? ((theme=="Modern") ? 0x7C4DFF : 0x9C27B0) : inactive;
          uint32_t turbo_col = (x=="boost") ? ((theme=="Modern") ? 0xFF6D00 : 0xFF5722) : inactive;
          if (theme=="Performance") {
            if (x=="eco" || x=="sleep" || x=="boost") {
              eco_col = (x=="eco") ? 0x444444 : inactive;
              sleep_col = (x=="sleep") ? 0x444444 : inactive;
              turbo_col = (x=="boost") ? 0x444444 : inactive;
            }
          }
          if (id(${widget_name}_eco_btn)) lv_obj_set_style_bg_color(id(${widget_name}_eco_btn), lv_color_hex(eco_col), 0);
          if (id(${widget_name}_sleep_btn)) lv_obj_set_style_bg_color(id(${widget_name}_sleep_btn), lv_color_hex(sleep_col), 0);
          if (id(${widget_name}_turbo_btn)) lv_obj_set_style_bg_color(id(${widget_name}_turbo_btn), lv_color_hex(turbo_col), 0);
          // Text color for Modern active green/blue should be black for contrast
          if (id(${widget_name}_eco_btn) && theme=="Modern" && x=="eco") lv_obj_set_style_text_color(id(${widget_name}_eco_btn), lv_color_hex(0x000000), 0);
          else if (id(${widget_name}_eco_btn)) lv_obj_set_style_text_color(id(${widget_name}_eco_btn), lv_color_white(), 0);

  - platform: homeassistant
    id: ${widget_name}_hvac_action
    entity_id: "${climate_entity}"
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_action_label
          text: !lambda |-
            if (x.empty()) return std::string("--");
            return x;

sensor:
  - platform: homeassistant
    id: ${widget_name}_target_temp_sensor
    entity_id: "${climate_entity}"
    attribute: temperature
    on_value:
      - globals.set:
          id: ${widget_name}_target_temp
          value: !lambda return x;
      - lvgl.arc.update:
          id: ${widget_name}_temp_arc
          value: !lambda return x;
      - lvgl.label.update:
          id: ${widget_name}_target_temp_label
          text: !lambda |-
            char b[8]; snprintf(b,sizeof(b),"%d",(int)x); return std::string(b);

  - platform: homeassistant
    id: ${widget_name}_current_temp_sensor
    entity_id: "${climate_entity}"
    attribute: current_temperature
    on_value:
      - globals.set:
          id: ${widget_name}_current_temp
          value: !lambda return x;
      - lvgl.label.update:
          id: ${widget_name}_current_temp_label
          text: !lambda |-
            char b[16]; snprintf(b,sizeof(b),"%.1f°C",x); return std::string(b);

  - platform: homeassistant
    id: ${widget_name}_humidity_sensor
    entity_id: "${climate_entity}"
    attribute: current_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_humidity_label
          text: !lambda |-
            if (std::isnan(x)) return std::string("");
            char b[16]; snprintf(b,sizeof(b),"%.0f%% RH",x); return std::string(b);

lvgl:
  pages:
    - id: ${widget_name}_page
      bg_color: 0x0F1115
      bg_opa: cover
      widgets:
        - obj:
            id: ${widget_name}_top_bar
            align: top_mid
            y: 0
            width: 480
            height: 50
            bg_color: 0x1A1D26
            bg_opa: cover
            border_width: 0
            radius: 0
            pad_all: 6
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - button:
                  id: ${widget_name}_back_btn
                  width: 70
                  height: 36
                  radius: 8
                  bg_color: 0x2A2E3A
                  border_width: 0
                  widgets:
                    - label:
                        align: center
                        text: "< Back"
                        text_font: nunito_14
                        text_color: white
                  on_click:
                    - lvgl.page.show: main_page
              - obj:
                  width: 200
                  height: 36
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: ${widget_name}_title_label
                        text: "Climate Control"
                        text_font: nunito_18
                        text_color: white
                    - label:
                        id: ${widget_name}_action_label
                        text: "--"
                        text_font: nunito_14
                        text_color: 0x888888
              - label:
                  id: ${widget_name}_humidity_label
                  text: ""
                  text_font: nunito_14
                  text_color: 0x4FC3F7

        - arc:
            id: ${widget_name}_temp_arc
            align: center
            y: -30
            width: 320
            height: 320
            min_value: 16
            max_value: 31
            value: 24
            start_angle: 135
            end_angle: 45
            arc_width: 14
            arc_color: 0x2A2E3A
            indicator:
              arc_color: 0xFF9F1C
              arc_width: 14
            knob:
              border_width: 2
              border_color: white
              bg_color: 0xFF9F1C
              pad_all: 4
            on_value:
              - lvgl.label.update:
                  id: ${widget_name}_target_temp_label
                  text: !lambda |-
                    char b[8]; snprintf(b,sizeof(b),"%d",(int)x); return std::string(b);
            on_release:
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: "${climate_entity}"
                    temperature: !lambda return x;

        - obj:
            align: center
            y: -30
            width: 200
            height: 140
            bg_opa: transp
            border_width: 0
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  id: ${widget_name}_target_temp_label
                  text: "24"
                  text_font: nunito_72
                  text_color: white
                  text_align: center
              - obj:
                  width: 180
                  height: 24
                  bg_opa: transp
                  border_width: 0
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: center
                    pad_column: 8
                  widgets:
                    - label:
                        id: ${widget_name}_current_temp_label
                        text: "24.0°C"
                        text_font: nunito_18
                        text_color: 0xAAAAAA
                    - label:
                        id: ${widget_name}_mode_label
                        text: "cool"
                        text_font: nunito_14
                        text_color: 0xFF9F1C

        - button:
            id: ${widget_name}_minus_btn
            align: center
            x: -110
            y: -30
            width: 52
            height: 52
            bg_color: 0x2A2E3A
            radius: 26
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "-"
                  text_font: nunito_36
                  text_color: white
            on_click:
              - lambda: |-
                  float c = id(${widget_name}_target_temp);
                  float n = c - 1.0f; if (n < 16) n = 16;
                  id(${widget_name}_target_temp) = n;
              - lvgl.arc.update:
                  id: ${widget_name}_temp_arc
                  value: !lambda return id(${widget_name}_target_temp);
              - lvgl.label.update:
                  id: ${widget_name}_target_temp_label
                  text: !lambda |-
                    char b[8]; snprintf(b,sizeof(b),"%d",(int)id(${widget_name}_target_temp)); return std::string(b);
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: "${climate_entity}"
                    temperature: !lambda return id(${widget_name}_target_temp);

        - button:
            id: ${widget_name}_plus_btn
            align: center
            x: 110
            y: -30
            width: 52
            height: 52
            bg_color: 0x2A2E3A
            radius: 26
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "+"
                  text_font: nunito_36
                  text_color: white
            on_click:
              - lambda: |-
                  float c = id(${widget_name}_target_temp);
                  float n = c + 1.0f; if (n > 31) n = 31;
                  id(${widget_name}_target_temp) = n;
              - lvgl.arc.update:
                  id: ${widget_name}_temp_arc
                  value: !lambda return id(${widget_name}_target_temp);
              - lvgl.label.update:
                  id: ${widget_name}_target_temp_label
                  text: !lambda |-
                    char b[8]; snprintf(b,sizeof(b),"%d",(int)id(${widget_name}_target_temp)); return std::string(b);
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: "${climate_entity}"
                    temperature: !lambda return id(${widget_name}_target_temp);

        - obj:
            id: ${widget_name}_row1
            align: bottom_mid
            y: -92
            width: 460
            height: 52
            bg_opa: transp
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
            widgets:
              - button:
                  id: ${widget_name}_power_btn
                  width: 108
                  height: 48
                  radius: 12
                  bg_color: 0x333333
                  border_width: 0
                  widgets:
                    - label:
                        id: ${widget_name}_power_label
                        align: center
                        text: "OFF"
                        text_font: nunito_14
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.toggle
                        data:
                          entity_id: "${climate_entity}"

              - button:
                  id: ${widget_name}_mode_btn
                  width: 108
                  height: 48
                  radius: 12
                  bg_color: 0x555555
                  border_width: 0
                  widgets:
                    - label:
                        id: ${widget_name}_mode_btn_label
                        align: center
                        text: "Mode"
                        text_font: nunito_14
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
                          entity_id: "${climate_entity}"
                          hvac_mode: !lambda |-
                            std::string cur = id(${widget_name}_hvac_mode).state;
                            if (cur=="off") return "cool";
                            if (cur=="cool") return "heat";
                            if (cur=="heat") return "dry";
                            if (cur=="dry") return "fan_only";
                            if (cur=="fan_only") return "auto";
                            return "off";

              - button:
                  id: ${widget_name}_fan_btn
                  width: 108
                  height: 48
                  radius: 12
                  bg_color: 0x555555
                  border_width: 0
                  widgets:
                    - label:
                        id: ${widget_name}_fan_label
                        align: center
                        text: "Fan"
                        text_font: nunito_14
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_fan_mode
                        data:
                          entity_id: "${climate_entity}"
                          fan_mode: !lambda |-
                            std::string cur = id(${widget_name}_fan_mode).state;
                            if (cur=="auto") return "low";
                            if (cur=="low") return "medium";
                            if (cur=="medium") return "high";
                            if (cur=="high") return "auto";
                            return "auto";

              - button:
                  id: ${widget_name}_swing_btn
                  width: 108
                  height: 48
                  radius: 12
                  bg_color: 0x555555
                  border_width: 0
                  widgets:
                    - label:
                        id: ${widget_name}_swing_label
                        align: center
                        text: "Swing"
                        text_font: nunito_14
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_swing_mode
                        data:
                          entity_id: "${climate_entity}"
                          swing_mode: !lambda |-
                            std::string cur = id(${widget_name}_swing_mode).state;
                            if (cur=="off" || cur=="") return "vertical";
                            if (cur=="vertical") return "horizontal";
                            if (cur=="horizontal") return "both";
                            return "off";

        - obj:
            id: ${widget_name}_row2
            align: bottom_mid
            y: -34
            width: 460
            height: 52
            bg_opa: transp
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
            widgets:
              - button:
                  id: ${widget_name}_eco_btn
                  width: 108
                  height: 48
                  radius: 12
                  bg_color: 0x555555
                  border_width: 0
                  widgets:
                    - label:
                        align: center
                        text: "ECO"
                        text_font: nunito_14
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_preset_mode
                        data:
                          entity_id: "${climate_entity}"
                          preset_mode: !lambda |-
                            return (id(${widget_name}_preset_mode).state=="eco") ? "none" : "eco";

              - button:
                  id: ${widget_name}_sleep_btn
                  width: 108
                  height: 48
                  radius: 12
                  bg_color: 0x555555
                  border_width: 0
                  widgets:
                    - label:
                        align: center
                        text: "Sleep"
                        text_font: nunito_14
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_preset_mode
                        data:
                          entity_id: "${climate_entity}"
                          preset_mode: !lambda |-
                            return (id(${widget_name}_preset_mode).state=="sleep") ? "none" : "sleep";

              - button:
                  id: ${widget_name}_turbo_btn
                  width: 108
                  height: 48
                  radius: 12
                  bg_color: 0x555555
                  border_width: 0
                  widgets:
                    - label:
                        align: center
                        text: "Turbo"
                        text_font: nunito_14
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_preset_mode
                        data:
                          entity_id: "${climate_entity}"
                          preset_mode: !lambda |-
                            return (id(${widget_name}_preset_mode).state=="boost") ? "none" : "boost";

              - obj:
                  id: ${widget_name}_preset_box
                  width: 108
                  height: 48
                  radius: 12
                  bg_color: 0x1E232E
                  border_width: 0
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                  widgets:
                    - label:
                        text: "PRESET"
                        text_font: nunito_12
                        text_color: 0x888888
                    - label:
                        id: ${widget_name}_preset_label
                        text: "NORMAL"
                        text_font: nunito_14
                        text_color: white
