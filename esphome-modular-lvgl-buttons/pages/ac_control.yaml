                        data:
                          entity_id: "${climate_entity}"
                          preset_mode: !lambda 'return (id(${widget_name}_preset_mode).state == "boost") ? "none" : "boost";'

              - button:
                  id: ${widget_name}_preset_btn
                  width: 108
                  height: 86
                  radius: 12
                  bg_color: 0x343645
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: 2
                  widgets:
                    - label:
                        id: ${widget_name}_preset_title
