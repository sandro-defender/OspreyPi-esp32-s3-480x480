        # ── Row 1: Power / Mode / Fan / Swing ─────────────────────────
        - obj:
            id: ${widget_name}_row1
            align: top_mid
            y: 294
            width: 456
            height: 88
            bg_opa: transp
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - button:
                  id: ${widget_name}_power_btn
                  width: 108
                  height: 86
                  radius: 12
                  bg_color: 0x343645
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: 2
                  widgets:
                    - label:
                        id: ${widget_name}_power_title
                        text: "Power"
                        text_font: nunito_14
                        text_color: 0xBBBBBB
                    - label:
                        id: ${widget_name}_power_icon
                        text: $mdi_power
                        text_font: mdi_icons_22
                        text_color: white
                    - label:
                        id: ${widget_name}_power_label
                        text: "OFF"
                        text_font: nunito_18
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.toggle
                        data:
                          entity_id: "${climate_entity}"

              - button:
                  id: ${widget_name}_mode_btn
                  width: 108
                  height: 86
                  radius: 12
                  bg_color: 0x343645
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: 2
                  widgets:
                    - label:
                        id: ${widget_name}_mode_title
                        text: "Mode"
                        text_font: nunito_14
                        text_color: 0xBBBBBB
                    - label:
                        id: ${widget_name}_mode_icon
                        text: $mdi_snowflake
                        text_font: mdi_icons_22
                        text_color: white
                    - label:
                        id: ${widget_name}_mode_label
                        text: "COOL"
                        text_font: nunito_18
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
                          entity_id: "${climate_entity}"
                          hvac_mode: !lambda |-
                            std::string cur = id(${widget_name}_hvac_mode).state;
                            if (cur == "off") return "cool";
                            if (cur == "cool") return "heat";
                            if (cur == "heat") return "dry";
                            if (cur == "dry") return "fan_only";
                            if (cur == "fan_only") return "auto";
                            return "off";

              - button:
                  id: ${widget_name}_fan_btn
                  width: 108
                  height: 86
                  radius: 12
                  bg_color: 0x343645
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: 2
                  widgets:
                    - label:
                        id: ${widget_name}_fan_title
                        text: "Fan"
                        text_font: nunito_14
                        text_color: 0xBBBBBB
                    - label:
                        id: ${widget_name}_fan_icon
                        text: $mdi_fan
                        text_font: mdi_icons_22
                        text_color: white
                    - label:
                        id: ${widget_name}_fan_label
                        text: "AUTO"
                        text_font: nunito_18
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_fan_mode
                        data:
                          entity_id: "${climate_entity}"
                          fan_mode: !lambda |-
                            std::string cur = id(${widget_name}_fan_mode).state;
                            if (cur == "auto") return "low";
                            if (cur == "low") return "medium";
                            if (cur == "medium") return "high";
                            return "auto";

              - button:
                  id: ${widget_name}_swing_btn
                  width: 108
                  height: 86
                  radius: 12
                  bg_color: 0x343645
                  pad_all: 0
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    pad_row: 2
                  widgets:
                    - label:
                        id: ${widget_name}_swing_title
                        text: "Swing"
                        text_font: nunito_14
                        text_color: 0xBBBBBB
                    - label:
                        id: ${widget_name}_swing_icon
                        text: $mdi_swap_horizontal
                        text_font: mdi_icons_22
                        text_color: white
                    - label:
                        id: ${widget_name}_swing_label
                        text: "OFF"
                        text_font: nunito_18
                        text_color: white
                  on_click:
                    - homeassistant.action:
                        action: climate.set_swing_mode
                        data:
                          entity_id: "${climate_entity}"
                          swing_mode: !lambda |-
                            std::string cur = id(${widget_name}_swing_mode).state;
                            if (cur == "off" || cur == "") return "vertical";
                            if (cur == "vertical") return "horizontal";
                            if (cur == "horizontal") return "both";
                            return "off";

