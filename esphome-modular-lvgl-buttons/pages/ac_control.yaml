---
# AC control page — layout matches docs/images mockups (screen_info.png,
# theme_modern_home.png / theme_modern_ac.png):
#   [ Back | Climate Control | humidity / room ]
#   [ gauge with big target temp, −/+ side steppers ]
#   [ 8 state buttons in 2x4: Power Mode Fan Swing / Eco Sleep Turbo Preset ]
#
# Every button shows the REAL live state from Home Assistant (two-line
# label + icon). One script (ac_main_refresh) owns all styling so theme
# switches and state changes never disagree.
#
# vars: widget_name, climate_entity

globals:
  - id: ${widget_name}_target_temp
    type: float
    initial_value: '24.0'
  - id: ${widget_name}_current_temp
    type: float
    initial_value: '24.0'

text_sensor:
  # hvac_mode is the source of truth for power AND mode button state
  # (climate "state" == hvac_mode; "off" means powered down).
  - platform: homeassistant
    id: ${widget_name}_hvac_mode
    entity_id: "${climate_entity}"
    attribute: hvac_mode
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_power_label
          text: !lambda 'return std::string(x == "off" ? "OFF" : "ON");'
      - lvgl.label.update:
          id: ${widget_name}_mode_label
          text: !lambda |-
            if (x == "fan_only") return std::string("FAN");
            if (x == "off") return std::string("OFF");
            std::string up = x;
            for (auto &c : up) c = toupper(c);
            return up;
      - lvgl.label.update:
          id: ${widget_name}_mode_icon
          text: !lambda |-
            auto utf8 = [](uint32_t cp) {
              std::string s;
              if (cp < 0x80) { s += (char) cp; }
              else if (cp < 0x800) { s += (char) (0xC0 | (cp >> 6)); s += (char) (0x80 | (cp & 0x3F)); }
              else if (cp < 0x10000) { s += (char) (0xE0 | (cp >> 12)); s += (char) (0x80 | ((cp >> 6) & 0x3F)); s += (char) (0x80 | (cp & 0x3F)); }
              else { s += (char) (0xF0 | (cp >> 18)); s += (char) (0x80 | ((cp >> 12) & 0x3F)); s += (char) (0x80 | ((cp >> 6) & 0x3F)); s += (char) (0x80 | (cp & 0x3F)); }
              return s;
            };
            // power=0xF0425 snowflake=0xF0717 fire=0xF0238 water=0xF058C fan=0xF0210 fan_auto=0xF171D
            if (x == "cool") return utf8(0xF0717);
            if (x == "heat") return utf8(0xF0238);
            if (x == "dry") return utf8(0xF058C);
            if (x == "fan_only") return utf8(0xF0210);
            if (x == "auto") return utf8(0xF171D);
            return utf8(0xF0425);
      - script.execute: ${widget_name}_refresh

  - platform: homeassistant
    id: ${widget_name}_fan_mode
    entity_id: "${climate_entity}"
    attribute: fan_mode
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_fan_label
          text: !lambda |-
            if (x == "medium") return std::string("MED");
            if (x == "low") return std::string("LOW");
            if (x == "high") return std::string("HIGH");
            std::string up = x;
            for (auto &c : up) c = toupper(c);
            return up.empty() ? std::string("AUTO") : up;
      - script.execute: ${widget_name}_refresh

  - platform: homeassistant
    id: ${widget_name}_swing_mode
    entity_id: "${climate_entity}"
    attribute: swing_mode
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_swing_label
          text: !lambda |-
            if (x == "vertical") return std::string("VERT");
            if (x == "horizontal") return std::string("HORIZ");
            if (x == "both") return std::string("BOTH");
            return std::string("OFF");
      - script.execute: ${widget_name}_refresh

  - platform: homeassistant
    id: ${widget_name}_preset_mode
    entity_id: "${climate_entity}"
    attribute: preset_mode
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_preset_label
          text: !lambda |-
            if (x.empty() || x == "none") return std::string("NORMAL");
            std::string up = x;
            for (auto &c : up) c = toupper(c);
            return up;
      - script.execute: ${widget_name}_refresh

  - platform: homeassistant
    id: ${widget_name}_hvac_action
    entity_id: "${climate_entity}"
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_action_label
          text: !lambda |-
            if (x.empty() || x == "idle") return std::string("STANDBY");
            std::string up = x;
            for (auto &c : up) c = toupper(c);
            return up;
      - lvgl.label.update:
          id: ${widget_name}_action_icon
          text: !lambda |-
            auto utf8 = [](uint32_t cp) {
              std::string s;
              if (cp < 0x80) { s += (char) cp; }
              else if (cp < 0x800) { s += (char) (0xC0 | (cp >> 6)); s += (char) (0x80 | (cp & 0x3F)); }
              else if (cp < 0x10000) { s += (char) (0xE0 | (cp >> 12)); s += (char) (0x80 | ((cp >> 6) & 0x3F)); s += (char) (0x80 | (cp & 0x3F)); }
              else { s += (char) (0xF0 | (cp >> 18)); s += (char) (0x80 | ((cp >> 12) & 0x3F)); s += (char) (0x80 | ((cp >> 6) & 0x3F)); s += (char) (0x80 | (cp & 0x3F)); }
              return s;
            };
            // snowflake=0xF0717 fire=0xF0238 water=0xF058C fan=0xF0210 thermometer=0xF050F
            if (x == "cooling") return utf8(0xF0717);
            if (x == "heating") return utf8(0xF0238);
            if (x == "drying") return utf8(0xF058C);
            if (x == "fan") return utf8(0xF0210);
            return utf8(0xF050F);

sensor:
  - platform: homeassistant
    id: ${widget_name}_target_temp_sensor
    entity_id: "${climate_entity}"
    attribute: temperature
    on_value:
      - globals.set:
          id: ${widget_name}_target_temp
          value: !lambda return x;
      - lvgl.arc.update:
          id: ${widget_name}_temp_arc
          value: !lambda return x;
      - lvgl.label.update:
          id: ${widget_name}_target_temp_label
          text: !lambda |-
            char b[8];
            if (x == (float)(int) x) snprintf(b, sizeof(b), "%d°", (int) x);
            else snprintf(b, sizeof(b), "%.1f°", x);
            return std::string(b);

  - platform: homeassistant
    id: ${widget_name}_current_temp_sensor
    entity_id: "${climate_entity}"
    attribute: current_temperature
    on_value:
      - globals.set:
          id: ${widget_name}_current_temp
          value: !lambda return x;
      - lvgl.label.update:
          id: ${widget_name}_current_temp_label
          text: !lambda |-
            char b[20]; snprintf(b, sizeof(b), "Room %.1f°C", x); return std::string(b);

  - platform: homeassistant
    id: ${widget_name}_humidity_sensor
    entity_id: "${climate_entity}"
    attribute: current_humidity
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${widget_name}_humidity_label
          text: !lambda |-
            if (std::isnan(x)) return std::string("");
            char b[20]; snprintf(b, sizeof(b), "%.0f%% Humidity", x); return std::string(b);

script:
  # Single source of truth for AC button styling. Reads current HA state and
  # repaints all 8 buttons + steppers for the active theme. Called from every
  # state handler and from apply_display_theme on theme switch.
  - id: ${widget_name}_refresh
    mode: restart
    then:
      - lambda: |-
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme = "Classic";
          bool modern = (theme == "Modern");
          bool perf = (theme == "Performance");
          bool day = (theme == "Daylight"); // dark surfaces, white text, orange accent

          std::string m = id(${widget_name}_hvac_mode).state;
          std::string fan = id(${widget_name}_fan_mode).state;
          std::string sw = id(${widget_name}_swing_mode).state;
          std::string pre = id(${widget_name}_preset_mode).state;

          // ── palette ────────────────────────────────────────────────
          uint32_t off_bg   = modern ? 0x232A38 : (perf ? 0x1A1A1A : (day ? 0x191D23 : 0x343645));
          uint32_t title_c  = modern ? 0x9BA2BC : (perf ? 0xCCCCCC : (day ? 0xB4B8BC : 0xBBBBBB));
          uint32_t val_c    = 0xFFFFFF;

          // depth helper: Modern gets the mockup "3D" look.
          // glow: 0 = inactive (raised dark), 1/2/3 = filled green/blue/orange
          // (flat fill + colored glow), 4 = −/+ stepper (raised + soft halo)
          auto depth = [&](lv_obj_t *b, int glow) {
            if (!b) return;
            lv_obj_remove_style(b, id(depth_dark), 0);
            lv_obj_remove_style(b, id(depth_light), 0);
            lv_obj_remove_style(b, id(glow_soft), 0);
            lv_obj_remove_style(b, id(glow_green), 0);
            lv_obj_remove_style(b, id(glow_blue), 0);
            lv_obj_remove_style(b, id(glow_blue_light), 0);
            lv_obj_remove_style(b, id(glow_orange), 0);
            if (modern) {
              if (glow == 0 || glow == 4) lv_obj_add_style(b, id(depth_dark), 0);
              if (glow == 1) lv_obj_add_style(b, id(glow_green), 0);
              else if (glow == 2) lv_obj_add_style(b, id(glow_blue), 0);
              else if (glow == 3) lv_obj_add_style(b, id(glow_orange), 0);
              else if (glow == 4) lv_obj_add_style(b, id(glow_soft), 0);
            } else if (day) {
              // raised white card + soft blue ring when active
              if (glow == 0 || glow == 4) lv_obj_add_style(b, id(depth_light), 0);
              if (glow == 1) lv_obj_add_style(b, id(glow_green), 0);
              else if (glow == 2) lv_obj_add_style(b, id(glow_blue_light), 0);
              else if (glow == 3) lv_obj_add_style(b, id(glow_orange), 0);
              else if (glow == 4) lv_obj_add_style(b, id(glow_soft), 0);
            }
          };
          auto paint = [&](lv_obj_t *btn, lv_obj_t *ic, lv_obj_t *tt, lv_obj_t *vv,
                           uint32_t bg, uint32_t tc, int glow) {
            if (day) {
              // Daylight: muted grays -> theme dim gray; white stays white on colored fills
              if (tc == 0xBBBBBB || tc == 0x9E9E9E) tc = 0xB4B8BC;
            }
            if (btn) {
              lv_obj_set_style_bg_color(btn, lv_color_hex(bg), 0);
              lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, 0);
              lv_obj_set_style_radius(btn, modern ? 18 : (perf ? 6 : (day ? 18 : 12)), 0);
              if (day) {
                lv_obj_set_style_border_width(btn, 1, 0);
                lv_obj_set_style_border_color(btn, lv_color_hex(0x242A33), 0);
              } else {
                lv_obj_set_style_border_width(btn, 0, 0);
              }
              depth(btn, glow);
            }
            if (ic) lv_obj_set_style_text_color(ic, lv_color_hex(tc), 0);
            if (tt) lv_obj_set_style_text_color(tt, lv_color_hex(tc == 0xFFFFFF ? title_c : tc), 0);
            if (vv) lv_obj_set_style_text_color(vv, lv_color_hex(tc), 0);
          };

          // ── Power ──────────────────────────────────────────────────
          bool power_on = (m != "off" && !m.empty());
          if (power_on) {
            uint32_t bg = perf ? 0x444444 : (modern ? 0x00E676 : 0x4CAF50);
            uint32_t tc = (modern ? 0x000000 : 0xFFFFFF); // green fill + white text reads well on Daylight
            paint(id(${widget_name}_power_btn), id(${widget_name}_power_icon),
                  id(${widget_name}_power_title), id(${widget_name}_power_label), bg, tc,
                  modern ? 1 : 0);
          } else {
            paint(id(${widget_name}_power_btn), id(${widget_name}_power_icon),
                  id(${widget_name}_power_title), id(${widget_name}_power_label), off_bg, 0x9E9E9E, 0);
          }

          // ── Mode ───────────────────────────────────────────────────
          {
            uint32_t bg = off_bg; uint32_t tc = 0xBBBBBB; int glow = 0;
            if (m == "cool") { bg = perf ? 0x444444 : (modern ? 0x29B6F6 : 0x2196F3); tc = modern ? 0x000000 : 0xFFFFFF; glow = modern ? 2 : 0; }
            else if (m == "heat") { bg = perf ? 0x444444 : (modern ? 0xFF6D00 : 0xFF9800); tc = 0xFFFFFF; glow = modern ? 3 : 0; }
            else if (m == "dry") { bg = perf ? 0x444444 : (modern ? 0xFFCA28 : 0xFFEB3B); tc = modern ? 0x000000 : 0xFFFFFF; glow = 0; }
            else if (m == "fan_only") { bg = perf ? 0x444444 : (modern ? 0x66BB6A : 0x4CAF50); tc = modern ? 0x000000 : 0xFFFFFF; glow = 0; }
            else if (m == "auto") { bg = perf ? 0x444444 : (modern ? 0x9C27B0 : 0x9C27B0); tc = 0xFFFFFF; glow = 0; }
            paint(id(${widget_name}_mode_btn), id(${widget_name}_mode_icon),
                  id(${widget_name}_mode_title), id(${widget_name}_mode_label), bg, tc, glow);
          }

          // ── Fan ────────────────────────────────────────────────────
          {
            bool hi = (fan == "high");
            uint32_t bg = hi ? (perf ? 0x444444 : (modern ? 0xFF8C00 : 0xFF9800)) : off_bg;
            uint32_t tc = hi ? (modern ? 0x000000 : 0xFFFFFF) : 0xBBBBBB;
            paint(id(${widget_name}_fan_btn), id(${widget_name}_fan_icon),
                  id(${widget_name}_fan_title), id(${widget_name}_fan_label), bg, tc,
                  (hi && modern) ? 3 : 0);
          }

          // ── Swing ──────────────────────────────────────────────────
          {
            bool active = !(sw == "off" || sw.empty());
            uint32_t bg = active ? (perf ? 0x444444 : (modern ? 0x03A9F4 : 0x03A9F4)) : off_bg;
            uint32_t tc = active ? 0xFFFFFF : 0xBBBBBB;
            paint(id(${widget_name}_swing_btn), id(${widget_name}_swing_icon),
                  id(${widget_name}_swing_title), id(${widget_name}_swing_label), bg, tc,
                  (active && modern) ? 2 : 0);
          }

          // ── Eco / Sleep / Turbo presets (mockup: dark tiles with
          //    colored text; Turbo TURBO is a filled orange pill) ─────
          {
            bool on = (pre == "eco");
            uint32_t bg = (on && !modern && !perf) ? 0x4CAF50 : (on && perf ? 0x444444 : off_bg);
            uint32_t tc = on ? (modern ? 0x00E676 : 0xFFFFFF) : 0xBBBBBB;
            paint(id(${widget_name}_eco_btn), id(${widget_name}_eco_icon),
                  id(${widget_name}_eco_title), id(${widget_name}_eco_label), bg, tc, 0);
          }
          {
            bool on = (pre == "sleep");
            uint32_t bg = (on && !modern && !perf) ? 0x9C27B0 : (on && perf ? 0x444444 : off_bg);
            uint32_t tc = on ? (modern ? 0xB39DDB : 0xFFFFFF) : 0xBBBBBB;
            paint(id(${widget_name}_sleep_btn), id(${widget_name}_sleep_icon),
                  id(${widget_name}_sleep_title), id(${widget_name}_sleep_label), bg, tc, 0);
          }
          {
            bool on = (pre == "boost");
            uint32_t bg = on ? (perf ? 0x444444 : (modern ? 0xFF6D00 : 0xFF5722)) : off_bg;
            uint32_t tc = on ? 0xFFFFFF : 0xBBBBBB;
            paint(id(${widget_name}_turbo_btn), id(${widget_name}_turbo_icon),
                  id(${widget_name}_turbo_title), id(${widget_name}_turbo_label), bg, tc,
                  (on && modern) ? 3 : 0);
          }

          // ── Preset (always shows current preset, cycles on tap) ────
          paint(id(${widget_name}_preset_btn), id(${widget_name}_preset_icon),
                id(${widget_name}_preset_title), id(${widget_name}_preset_label), off_bg, 0xBBBBBB, 0);

          // ── −/+ steppers ───────────────────────────────────────────
          {
            uint32_t bg = modern ? 0x2A3242 : (perf ? 0x1A1A1A : (day ? 0x191D23 : 0x343645));
            uint32_t step_radius = modern ? 16 : (perf ? 4 : (day ? 18 : 26));
            if (id(${widget_name}_minus_btn)) {
              lv_obj_set_style_bg_color(id(${widget_name}_minus_btn), lv_color_hex(bg), 0);
              lv_obj_set_style_radius(id(${widget_name}_minus_btn), step_radius, 0);
              depth(id(${widget_name}_minus_btn), 4);
            }
            if (id(${widget_name}_plus_btn)) {
              lv_obj_set_style_bg_color(id(${widget_name}_plus_btn), lv_color_hex(bg), 0);
              lv_obj_set_style_radius(id(${widget_name}_plus_btn), step_radius, 0);
              depth(id(${widget_name}_plus_btn), 4);
            }
          }

          // ── gauge + header accents ─────────────────────────────────
          if (id(${widget_name}_temp_arc)) {
            uint32_t track = modern ? 0x232A38 : (perf ? 0x1A1A1A : (day ? 0x232932 : 0x2A2E3A));
            uint32_t accent = modern ? 0xFF8C00 : (perf ? 0x666666 : (day ? 0xE37220 : 0xFF9F1C));
            lv_obj_set_style_arc_color(id(${widget_name}_temp_arc), lv_color_hex(track), LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(${widget_name}_temp_arc), lv_color_hex(accent), LV_PART_INDICATOR);
            lv_obj_set_style_bg_color(id(${widget_name}_temp_arc), lv_color_hex(accent), LV_PART_KNOB);
          }

          // ── header: back chip, title, humidity / room temp ─────────
          if (id(${widget_name}_back_btn)) {
            lv_obj_t *bb = id(${widget_name}_back_btn);
            lv_obj_set_style_bg_color(bb, lv_color_hex(day ? 0x191D23 : 0x151B26), 0);
            lv_obj_set_style_bg_opa(bb, LV_OPA_COVER, 0);
            lv_obj_set_style_border_color(bb, lv_color_hex(day ? 0xF8953D : 0x29B6F6), 0);
            lv_obj_set_style_text_color(bb, lv_color_hex(day ? 0xF8953D : 0x29B6F6), 0);
            lv_obj_set_style_radius(bb, day ? 18 : 10, 0);
          }
          if (id(${widget_name}_title_label))
            lv_obj_set_style_text_color(id(${widget_name}_title_label),
                lv_color_hex(0xFFFFFF), 0);
          if (id(${widget_name}_humidity_label))
            lv_obj_set_style_text_color(id(${widget_name}_humidity_label),
                lv_color_hex(day ? 0xB4B8BC : 0x9BA2BC), 0);
          if (id(${widget_name}_current_temp_label))
            lv_obj_set_style_text_color(id(${widget_name}_current_temp_label),
                lv_color_hex(0x6C7382), 0);

lvgl:
  pages:
    - id: ${widget_name}_page
      bg_color: 0x0A0E14
      bg_opa: cover
      # swipe right = back to Home (part of Home <-> AC <-> Light swipe ring)
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.show:
            id: main_page
            animation: OUT_RIGHT
            #options: stable: 300ms | fast: 150ms (applied)
            time: 150ms
      widgets:
        # ── Header: Back | Climate Control | humidity / room ──────────
        - button:
            id: ${widget_name}_back_btn
            align: top_left
            x: 8
            y: 7
            width: 78
            height: 36
            radius: 10
            bg_color: 0x151B26
            border_width: 1
            border_color: 0x29B6F6
            pad_all: 0
            widgets:
              - label:
                  align: center
                  text: "< Back"
                  text_font: nunito_18
                  text_color: 0x29B6F6
            on_click:
              - lvgl.page.show: main_page

        - obj:
            id: ${widget_name}_top_bar
            align: top_mid
            y: 8
            width: 280
            height: 36
            bg_opa: transp
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: ${widget_name}_title_label
                  align: center
                  text: "Climate Control"
                  text_font: nunito_24
                  text_color: white
                  text_align: center
                  width: 280
                  long_mode: clip

        - obj:
            align: top_right
            x: -8
            y: 5
            width: 160
            height: 50
            bg_opa: transp
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: end
            widgets:
              - label:
                  id: ${widget_name}_humidity_label
                  text: ""
                  text_font: nunito_18
                  text_color: 0x9BA2BC
                  text_align: right
                  long_mode: clip
                  width: 160
              - label:
                  id: ${widget_name}_current_temp_label
                  text: ""
                  text_font: nunito_14
                  text_color: 0x6C7382
                  text_align: right
                  long_mode: clip
                  width: 160

        # ── Temperature gauge ─────────────────────────────────────────
        - arc:
            id: ${widget_name}_temp_arc
            align: top_mid
            y: 52
            width: 224
            height: 224
            min_value: 16
            max_value: 31
            value: 24
            start_angle: 135
            end_angle: 45
            arc_width: 13
            arc_rounded: true
            arc_color: 0x232A38
            indicator:
              arc_color: 0xFF8C00
              arc_width: 13
              arc_rounded: true
            knob:
              border_width: 2
              border_color: white
              bg_color: 0xFF8C00
              pad_all: 3
            on_value:
              - lvgl.label.update:
                  id: ${widget_name}_target_temp_label
                  text: !lambda |-
                    char b[8]; snprintf(b, sizeof(b), "%d°", (int) x); return std::string(b);
            on_release:
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: "${climate_entity}"
                    temperature: !lambda return x;

        - obj:
            align: top_mid
            y: 98
            width: 200
            height: 132
            bg_opa: transp
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
            widgets:
              - label:
                  id: ${widget_name}_target_temp_label
                  text: "24°"
                  text_font: nunito_72
                  text_color: white
                  text_align: center
              - obj:
                  width: 200
                  height: 24
                  bg_opa: transp
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: center
                    flex_align_cross: center
                    pad_column: 4
                  widgets:
                    - label:
                        id: ${widget_name}_action_icon
                        text: $mdi_thermometer
                        text_font: mdi_icons_22
                        text_color: 0x9BA2BC
                    - label:
                        id: ${widget_name}_action_label
                        text: "STANDBY"
                        text_font: nunito_18
                        text_color: 0x9BA2BC

        # ── − / + steppers beside the gauge ───────────────────────────
        - button:
            id: ${widget_name}_minus_btn
            align: top_mid
            x: -150
            y: 132
            width: 62
            height: 62
            radius: 16
            bg_color: 0x2A3242
            pad_all: 0
            widgets:
              - label:
                  align: center
                  text: "-"
                  text_font: nunito_36
                  text_color: white
            on_click:
              - lambda: |-
                  float n = id(${widget_name}_target_temp) - 1.0f;
                  if (n < 16) n = 16;
                  id(${widget_name}_target_temp) = n;
              - lvgl.arc.update:
                  id: ${widget_name}_temp_arc
                  value: !lambda return id(${widget_name}_target_temp);
              - lvgl.label.update:
                  id: ${widget_name}_target_temp_label
                  text: !lambda |-
                    float v = id(${widget_name}_target_temp);
                    char b[8];
                    if (v == (float)(int) v) snprintf(b, sizeof(b), "%d°", (int) v);
                    else snprintf(b, sizeof(b), "%.1f°", v);
