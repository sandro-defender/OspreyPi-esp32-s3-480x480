---
# Fast settings with 4 selectable themes: Classic, Modern, Performance, Daylight
# Theme definitions live in common/themes/<name>.yaml; this page paints itself
# via apply_settings_theme (called from apply_display_theme on every switch).

lvgl:
  pages:
    - id: settings_page
      bg_color: 0x11151C
      bg_opa: cover
      widgets:
        # Header bar: back arrow + centered title (mockup: screen_settings.png)
        - obj:
            id: settings_header
            align: top_mid
            y: 6
            width: 460
            height: 44
            radius: 10
            bg_color: 0x252B38
            bg_opa: cover
            border_width: 0
            pad_left: 6
            pad_right: 6
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - button:
                  id: settings_back_btn
                  width: 56
                  height: 36
                  radius: 8
                  bg_opa: transp
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - label:
                        align: center
                        text: $mdi_arrow_left
                        text_font: mdi_icons_22
                  on_click:
                    - lvgl.page.show: main_page
              - label:
                  id: settings_title_label
                  text: "Settings"
                  text_font: nunito_24
                  text_color: white
              - obj:
                  width: 56
                  height: 36
                  bg_opa: transp
                  border_width: 0
                  pad_all: 0

        - obj:
            align: top_mid
            y: 56
            width: 460
            height: 378
            bg_opa: transp
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: column
              pad_row: 5
            widgets:
              # Brightness Mode - 3 buttons
              - obj:
                  id: settings_row_mode
                  width: 100%
                  height: 42
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 5
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_mode_label
                        text: "Mode"
                        text_font: nunito_14
                        text_color: 0xAAAAAA
                    - obj:
                        width: 300
                        height: 32
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 3
                        widgets:
                          - button:
                              id: settings_btn_day
                              width: 90
                              height: 30
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Day"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Day"
                          - button:
                              id: settings_btn_evening
                              width: 90
                              height: 30
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Eve"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Evening"
                          - button:
                              id: settings_btn_night
                              width: 90
                              height: 30
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Night"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Night"

              # Brightness sliders - compact
              - obj:
                  id: settings_row_day
                  width: 100%
                  height: 38
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 8
                  border_width: 0
                  pad_all: 4
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_day_label
                        text: "Day · ${daytime_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 74
                    - slider:
                        id: settings_day_brightness
                        width: 296
                        height: 12
                        min_value: 5
                        max_value: 100
                        value: "${daytime_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 6
                          width: 14
                          height: 14
                    - label:
                        id: settings_day_value
                        text: "${daytime_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 56
                        text_align: right

              - obj:
                  id: settings_row_eve
                  width: 100%
                  height: 38
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 8
                  border_width: 0
                  pad_all: 4
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_evening_label
                        text: "Eve · ${evening_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 74
                    - slider:
                        id: settings_evening_brightness
                        width: 296
                        height: 12
                        min_value: 5
                        max_value: 100
                        value: "${evening_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 6
                          width: 14
                          height: 14
                    - label:
                        id: settings_evening_value
                        text: "${evening_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 56
                        text_align: right

              - obj:
                  id: settings_row_night
                  width: 100%
                  height: 38
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 8
                  border_width: 0
                  pad_all: 4
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_night_label
                        text: "Night · ${nighttime_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 74
                    - slider:
                        id: settings_night_brightness
                        width: 296
                        height: 12
                        min_value: 5
                        max_value: 100
                        value: "${nighttime_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 6
                          width: 14
                          height: 14
                    - label:
                        id: settings_night_value
                        text: "${nighttime_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 56
                        text_align: right

              # Timeout + Saver
              - obj:
                  id: settings_row_timeout
                  width: 100%
                  height: 42
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 8
                  border_width: 0
                  pad_all: 5
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - obj:
                        width: 300
                        height: 32
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_cross: center
                        widgets:
                          - label:
                              id: settings_timeout_label
                              text: "Timeout · ${screen_timeout_default}s"
                              text_font: nunito_14
                              text_color: 0xCCCCCC
                          - slider:
                              id: settings_screen_timeout
                              width: 160
                              height: 10
                              min_value: 15
                              max_value: 300
                              value: "${screen_timeout_default}"
                              bg_color: 0x2A303E
                              indicator:
                                bg_color: 0x41BDF5
                              knob:
                                bg_color: 0xFFFFFF
                                radius: 5
                                width: 12
                                height: 12
                    - obj:
                        width: 90
                        height: 32
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_evenly
                          flex_align_cross: center
                        widgets:
                          - label:
                              id: settings_saver_label
                              text: "Saver"
                              text_font: nunito_12
                              text_color: 0x888888
                          - switch:
                              id: settings_screensaver_enabled
                              width: 40
                              height: 20
                              bg_color: 0x3A4352
                              knob:
                                bg_color: white
                              indicator:
                                bg_color: 0x4CAF50
                              state:
                                checked: true

              # Theme selector - 4 themes
              - obj:
                  id: settings_row_theme
                  width: 100%
                  height: 46
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 5
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_theme_label
                        text: "Theme"
                        text_font: nunito_14
                        text_color: 0xAAAAAA
                        width: 50
                    - obj:
                        width: 380
                        height: 34
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 4
                        widgets:
                          - button:
                              id: settings_btn_classic
                              width: 91
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Classic"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Classic"
                          - button:
                              id: settings_btn_modern
                              width: 91
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Modern"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Modern"
                          - button:
                              id: settings_btn_performance
                              width: 91
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Perf"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Performance"
                          - button:
                              id: settings_btn_daylight
                              width: 91
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Day"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Daylight"

              # Rotation selector
              - obj:
                  id: settings_row_rotation
                  width: 100%
                  height: 46
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 5
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_rotate_label
                        text: "Rotate"
                        text_font: nunito_14
                        text_color: 0xAAAAAA
                        width: 50
                    - obj:
                        width: 380
                        height: 34
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 4
                        widgets:
                          - button:
                              id: settings_btn_rot0
                              width: 70
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "0°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "0"
                          - button:
                              id: settings_btn_rot90
                              width: 70
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "90°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "90"
                          - button:
                              id: settings_btn_rot180
                              width: 70
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "180°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "180"
                          - button:
                              id: settings_btn_rot270
                              width: 70
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "270°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "270"

        - button:
            id: settings_home_btn
            align: bottom_left
            x: 10
            y: -6
            width: 100
            height: 36
            radius: 10
            bg_color: 0xFF6600
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "Home"
                  text_font: nunito_18
            on_click:
              - lvgl.page.show: main_page

        - button:
            id: settings_info_btn
            align: bottom_right
            x: -10
            y: -6
            width: 100
            height: 36
            radius: 10
            bg_color: 0x3A4352
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "Info"
                  text_font: nunito_18
            on_click:
              - lvgl.page.show: info_screen

number:
  - platform: lvgl
    id: day_brightness
    name: "Day Brightness"
    widget: settings_day_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_day_label
          text:
            format: "Day · %.0f%%"
            args: [ x ]
      - lvgl.label.update:
          id: settings_day_value
          text:
            format: "%.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Day";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: evening_brightness
    name: "Evening Brightness"
    widget: settings_evening_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_evening_label
          text:
            format: "Eve · %.0f%%"
            args: [ x ]
      - lvgl.label.update:
          id: settings_evening_value
          text:
            format: "%.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Evening";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: night_brightness
    name: "Night Brightness"
    widget: settings_night_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_night_label
          text:
            format: "Night · %.0f%%"
            args: [ x ]
      - lvgl.label.update:
          id: settings_night_value
          text:
            format: "%.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Night";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: screen_timeout
    name: "Screen Timeout"
    widget: settings_screen_timeout
    trigger: on_release
    restore_value: true
    entity_category: config
    unit_of_measurement: s
    on_value:
      - lvgl.label.update:
          id: settings_timeout_label
          text:
            format: "Timeout · %.0fs"
            args: [ x ]

select:
  - platform: template
    id: brightness_mode
    name: "Brightness Mode"
    options: [Day, Evening, Night]
    initial_option: Day
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_brightness

  - platform: template
    id: current_theme
    name: "Theme"
    options: [Classic, Modern, Performance, Daylight]
    initial_option: Classic
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_theme

  - platform: template
    id: display_rotation_select
    name: "Display Rotation"
    options: ["0", "90", "180", "270"]
    initial_option: "${display_rotation}"
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_rotation

switch:
  - platform: lvgl
    id: screensaver_enabled
    name: "Screensaver Enabled"
    widget: settings_screensaver_enabled
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

# Theme-aware repaint of this page. Called by apply_display_theme on every
# theme switch (and after boot). Uses the same 4-way palette switch as the
# rest of the UI: Classic / Modern / Performance / Daylight.
script:
  - id: apply_settings_theme
    mode: restart
    then:
      - lambda: |-
          std::string theme = id(current_theme).current_option();
          if (theme.empty()) theme = "Classic";
          bool day = (theme == "Daylight");
          bool perf = (theme == "Performance");
          bool modern = (theme == "Modern");

          uint32_t row_bg     = day ? 0xFFFFFF : (perf ? 0x141414 : (modern ? 0x1E2530 : 0x1E232E));
          uint32_t title_c    = day ? 0x1A1C22 : 0xFFFFFF;
          uint32_t label_c    = day ? 0x5F6672 : (perf ? 0x888888 : 0xAAAAAA);
          uint32_t value_c    = day ? 0x1A1C22 : (perf ? 0xCCCCCC : 0xCCCCCC);
          uint32_t track_c    = day ? 0xD8DEE9 : (perf ? 0x222222 : 0x2A303E);
          uint32_t accent_c   = day ? 0x2196F3 : (perf ? 0x666666 : (modern ? 0xFF8C00 : 0xFF9F1C));
          uint32_t timeout_c  = day ? 0x1976D2 : 0x41BDF5;
          uint32_t home_bg    = day ? 0x2196F3 : 0xFF6600;
          uint32_t info_bg    = day ? 0xFFFFFF : (perf ? 0x1A1A1A : 0x3A4352);
          uint32_t sel_off    = day ? 0xE1E6EE : (perf ? 0x1A1A1A : 0x3A4352);

          lv_obj_t* rows[] = { id(settings_row_mode), id(settings_row_day), id(settings_row_eve),
                               id(settings_row_night), id(settings_row_timeout),
                               id(settings_row_theme), id(settings_row_rotation) };
          for (auto r : rows) {
            if (!r) continue;
            lv_obj_set_style_bg_color(r, lv_color_hex(row_bg), 0);
            lv_obj_set_style_bg_opa(r, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(r, day ? 12 : (perf ? 4 : 10), 0);
            if (day) {
              lv_obj_set_style_border_width(r, 1, 0);
              lv_obj_set_style_border_color(r, lv_color_hex(0xD5DCE6), 0);
              lv_obj_set_style_shadow_width(r, 8, 0);
              lv_obj_set_style_shadow_opa(r, LV_OPA_20, 0);
              lv_obj_set_style_shadow_color(r, lv_color_hex(0x9AA4B5), 0);
              lv_obj_set_style_shadow_offset_y(r, 2, 0);
            } else {
              lv_obj_set_style_border_width(r, 0, 0);
              lv_obj_set_style_shadow_width(r, 0, 0);
            }
          }
          auto lab = [](lv_obj_t *l, uint32_t c) { if (l) lv_obj_set_style_text_color(l, lv_color_hex(c), 0); };
          lab(id(settings_title_label), title_c);
          lab(id(settings_day_value), value_c);
          lab(id(settings_evening_value), value_c);
          lab(id(settings_night_value), value_c);
          if (id(settings_header)) {
            lv_obj_set_style_bg_color(id(settings_header), lv_color_hex(row_bg), 0);
            lv_obj_set_style_bg_opa(id(settings_header), LV_OPA_COVER, 0);
            lv_obj_set_style_radius(id(settings_header), day ? 12 : (perf ? 4 : 10), 0);
            if (day) {
              lv_obj_set_style_border_width(id(settings_header), 1, 0);
              lv_obj_set_style_border_color(id(settings_header), lv_color_hex(0xD5DCE6), 0);
              lv_obj_set_style_shadow_width(id(settings_header), 8, 0);
              lv_obj_set_style_shadow_opa(id(settings_header), LV_OPA_20, 0);
              lv_obj_set_style_shadow_color(id(settings_header), lv_color_hex(0x9AA4B5), 0);
            } else {
              lv_obj_set_style_border_width(id(settings_header), 0, 0);
              lv_obj_set_style_shadow_width(id(settings_header), 0, 0);
            }
          }
          lab(id(settings_mode_label), label_c);
          lab(id(settings_theme_label), label_c);
          lab(id(settings_rotate_label), label_c);
          lab(id(settings_saver_label), perf ? 0x888888 : 0x888888);
          lab(id(settings_day_label), value_c);
          lab(id(settings_evening_label), value_c);
          lab(id(settings_night_label), value_c);
          lab(id(settings_timeout_label), value_c);

          auto slider_style = [&](lv_obj_t *s, uint32_t ind) {
            if (!s) return;
            lv_obj_set_style_bg_color(s, lv_color_hex(track_c), LV_PART_MAIN);
            lv_obj_set_style_bg_color(s, lv_color_hex(ind), LV_PART_INDICATOR);
            lv_obj_set_style_bg_color(s, lv_color_hex(day ? 0x1976D2 : 0xFFFFFF), LV_PART_KNOB);
          };
          slider_style(id(settings_day_brightness), accent_c);
          slider_style(id(settings_evening_brightness), accent_c);
          slider_style(id(settings_night_brightness), accent_c);
          slider_style(id(settings_screen_timeout), timeout_c);

          if (id(settings_screensaver_enabled)) {
            lv_obj_set_style_bg_color(id(settings_screensaver_enabled), lv_color_hex(sel_off), 0);
            lv_obj_set_style_bg_color(id(settings_screensaver_enabled), lv_color_hex(day ? 0x4CAF50 : 0x4CAF50), LV_PART_INDICATOR);
          }
          auto btn = [&](lv_obj_t *b, uint32_t bg) {
            if (!b) return;
            lv_obj_set_style_bg_color(b, lv_color_hex(bg), 0);
            lv_obj_set_style_bg_opa(b, LV_OPA_COVER, 0);
            lv_obj_set_style_radius(b, day ? 10 : (perf ? 4 : 10), 0);
            lv_obj_set_style_text_color(b, lv_color_hex(day && bg == 0xFFFFFF ? 0x1A1C22 : 0xFFFFFF), 0);
            if (day) {
              lv_obj_set_style_border_width(b, 1, 0);
              lv_obj_set_style_border_color(b, lv_color_hex(0xD5DCE6), 0);
              lv_obj_set_style_shadow_width(b, 6, 0);
              lv_obj_set_style_shadow_opa(b, LV_OPA_20, 0);
              lv_obj_set_style_shadow_color(b, lv_color_hex(0x9AA4B5), 0);
            } else {
              lv_obj_set_style_border_width(b, 0, 0);
              lv_obj_set_style_shadow_width(b, 0, 0);
            }
          };
          btn(id(settings_back_btn), info_bg);
          btn(id(settings_home_btn), home_bg);
          btn(id(settings_info_btn), info_bg);
      - script.execute: update_settings_highlight
