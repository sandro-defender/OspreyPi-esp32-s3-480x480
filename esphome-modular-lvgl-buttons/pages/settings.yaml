---
# Fast, simplified settings page - optimized for speed
# No dropdowns, no scrollable containers, minimal nesting, button-based controls

lvgl:
  pages:
    - id: settings_page
      bg_color: 0x11151C
      bg_opa: cover
      widgets:
        - label:
            align: top_mid
            y: 8
            text: "Settings"
            text_font: nunito_24
            text_color: white

        # Main container - fixed, no scroll, fast layout
        - obj:
            align: top_mid
            y: 38
            width: 460
            height: 380
            bg_opa: transp
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: column
              pad_row: 6
            widgets:
              # Brightness Mode - 3 fast buttons
              - obj:
                  width: 100%
                  height: 46
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 6
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        text: "Mode"
                        text_font: nunito_18
                        text_color: 0xAAAAAA
                    - obj:
                        width: 300
                        height: 34
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 4
                        widgets:
                          - button:
                              id: settings_btn_day
                              width: 90
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Day"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Day"
                          - button:
                              id: settings_btn_evening
                              width: 90
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Eve"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Evening"
                          - button:
                              id: settings_btn_night
                              width: 90
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Night"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Night"

              # Day Brightness - single slider
              - obj:
                  width: 100%
                  height: 52
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 6
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: 2
                  widgets:
                    - label:
                        id: settings_day_label
                        text: "Day · ${daytime_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                    - slider:
                        id: settings_day_brightness
                        width: 430
                        height: 14
                        min_value: 5
                        max_value: 100
                        value: "${daytime_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 8
                          width: 16
                          height: 16

              # Evening Brightness
              - obj:
                  width: 100%
                  height: 52
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 6
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: 2
                  widgets:
                    - label:
                        id: settings_evening_label
                        text: "Evening · ${evening_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                    - slider:
                        id: settings_evening_brightness
                        width: 430
                        height: 14
                        min_value: 5
                        max_value: 100
                        value: "${evening_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 8
                          width: 16
                          height: 16

              # Night Brightness
              - obj:
                  width: 100%
                  height: 52
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 6
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: 2
                  widgets:
                    - label:
                        id: settings_night_label
                        text: "Night · ${nighttime_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                    - slider:
                        id: settings_night_brightness
                        width: 430
                        height: 14
                        min_value: 5
                        max_value: 100
                        value: "${nighttime_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 8
                          width: 16
                          height: 16

              # Timeout + Screensaver row
              - obj:
                  width: 100%
                  height: 52
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 6
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - obj:
                        width: 320
                        height: 40
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: column
                          pad_row: 1
                        widgets:
                          - label:
                              id: settings_timeout_label
                              text: "Timeout · ${screen_timeout_default}s"
                              text_font: nunito_14
                              text_color: 0xCCCCCC
                          - slider:
                              id: settings_screen_timeout
                              width: 300
                              height: 12
                              min_value: 15
                              max_value: 300
                              value: "${screen_timeout_default}"
                              bg_color: 0x2A303E
                              indicator:
                                bg_color: 0x41BDF5
                              knob:
                                bg_color: 0xFFFFFF
                                radius: 6
                                width: 14
                                height: 14
                    - obj:
                        width: 100
                        height: 40
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                        widgets:
                          - label:
                              text: "Saver"
                              text_font: nunito_12
                              text_color: 0x888888
                          - switch:
                              id: settings_screensaver_enabled
                              width: 44
                              height: 22
                              bg_color: 0x3A4352
                              knob:
                                bg_color: white
                              indicator:
                                bg_color: 0x4CAF50
                              state:
                                checked: true

              # Theme + Rotation combined row for speed
              - obj:
                  width: 100%
                  height: 46
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 6
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - obj:
                        width: 150
                        height: 34
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 4
                        widgets:
                          - button:
                              id: settings_btn_dark
                              width: 65
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Dark"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Dark"
                          - button:
                              id: settings_btn_light
                              width: 65
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Light"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Light"
                    - obj:
                        width: 260
                        height: 34
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 3
                        widgets:
                          - button:
                              id: settings_btn_rot0
                              width: 58
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "0°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "0"
                          - button:
                              id: settings_btn_rot90
                              width: 58
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "90°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "90"
                          - button:
                              id: settings_btn_rot180
                              width: 58
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "180°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "180"
                          - button:
                              id: settings_btn_rot270
                              width: 58
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "270°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "270"

        - button:
            align: bottom_left
            x: 10
            y: -6
            width: 110
            height: 40
            radius: 10
            bg_color: 0xFF6600
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "Home"
                  text_font: nunito_18
                  text_color: white
            on_click:
              - lvgl.page.show: main_page

        - button:
            align: bottom_right
            x: -10
            y: -6
            width: 110
            height: 40
            radius: 10
            bg_color: 0x3A4352
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "Info"
                  text_font: nunito_18
                  text_color: white
            on_click:
              - lvgl.page.show: info_screen

number:
  - platform: lvgl
    id: day_brightness
    name: "Day Brightness"
    widget: settings_day_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_day_label
          text:
            format: "Day · %.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Day";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: evening_brightness
    name: "Evening Brightness"
    widget: settings_evening_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_evening_label
          text:
            format: "Evening · %.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Evening";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: night_brightness
    name: "Night Brightness"
    widget: settings_night_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_night_label
          text:
            format: "Night · %.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Night";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: screen_timeout
    name: "Screen Timeout"
    widget: settings_screen_timeout
    trigger: on_release
    restore_value: true
    entity_category: config
    unit_of_measurement: s
    on_value:
      - lvgl.label.update:
          id: settings_timeout_label
          text:
            format: "Timeout · %.0fs"
            args: [ x ]

select:
  - platform: template
    id: brightness_mode
    name: "Brightness Mode"
    options: [Day, Evening, Night]
    initial_option: Day
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_brightness

  - platform: template
    id: current_theme
    name: "Theme"
    options: [Dark, Light]
    initial_option: Dark
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_theme

  - platform: template
    id: display_rotation_select
    name: "Display Rotation"
    options: ["0", "90", "180", "270"]
    initial_option: "${display_rotation}"
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_rotation

switch:
  - platform: lvgl
    id: screensaver_enabled
    name: "Screensaver Enabled"
    widget: settings_screensaver_enabled
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
