---
# Fast settings with 3 selectable themes: Classic, Modern, Performance
# Theme 1 Classic = current dark, Theme 2 Modern = like mockup images, Theme 3 Performance = minimal

lvgl:
  pages:
    - id: settings_page
      bg_color: 0x11151C
      bg_opa: cover
      widgets:
        - label:
            align: top_mid
            y: 6
            text: "Settings"
            text_font: nunito_24
            text_color: white

        - obj:
            align: top_mid
            y: 34
            width: 460
            height: 400
            bg_opa: transp
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: column
              pad_row: 5
            widgets:
              # Brightness Mode - 3 buttons
              - obj:
                  width: 100%
                  height: 42
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 5
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        text: "Mode"
                        text_font: nunito_14
                        text_color: 0xAAAAAA
                    - obj:
                        width: 300
                        height: 32
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 3
                        widgets:
                          - button:
                              id: settings_btn_day
                              width: 90
                              height: 30
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Day"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Day"
                          - button:
                              id: settings_btn_evening
                              width: 90
                              height: 30
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Eve"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Evening"
                          - button:
                              id: settings_btn_night
                              width: 90
                              height: 30
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Night"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: brightness_mode
                                    option: "Night"

              # Brightness sliders - compact
              - obj:
                  width: 100%
                  height: 38
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 8
                  border_width: 0
                  pad_all: 4
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_day_label
                        text: "Day · ${daytime_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 90
                    - slider:
                        id: settings_day_brightness
                        width: 330
                        height: 12
                        min_value: 5
                        max_value: 100
                        value: "${daytime_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 6
                          width: 14
                          height: 14

              - obj:
                  width: 100%
                  height: 38
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 8
                  border_width: 0
                  pad_all: 4
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_evening_label
                        text: "Eve · ${evening_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 90
                    - slider:
                        id: settings_evening_brightness
                        width: 330
                        height: 12
                        min_value: 5
                        max_value: 100
                        value: "${evening_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 6
                          width: 14
                          height: 14

              - obj:
                  width: 100%
                  height: 38
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 8
                  border_width: 0
                  pad_all: 4
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: settings_night_label
                        text: "Night · ${nighttime_brightness_default}%"
                        text_font: nunito_14
                        text_color: 0xCCCCCC
                        width: 90
                    - slider:
                        id: settings_night_brightness
                        width: 330
                        height: 12
                        min_value: 5
                        max_value: 100
                        value: "${nighttime_brightness_default}"
                        bg_color: 0x2A303E
                        indicator:
                          bg_color: 0xFF9F1C
                        knob:
                          bg_color: 0xFFFFFF
                          radius: 6
                          width: 14
                          height: 14

              # Timeout + Saver
              - obj:
                  width: 100%
                  height: 42
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 8
                  border_width: 0
                  pad_all: 5
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - obj:
                        width: 300
                        height: 32
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_cross: center
                        widgets:
                          - label:
                              id: settings_timeout_label
                              text: "Timeout · ${screen_timeout_default}s"
                              text_font: nunito_14
                              text_color: 0xCCCCCC
                          - slider:
                              id: settings_screen_timeout
                              width: 160
                              height: 10
                              min_value: 15
                              max_value: 300
                              value: "${screen_timeout_default}"
                              bg_color: 0x2A303E
                              indicator:
                                bg_color: 0x41BDF5
                              knob:
                                bg_color: 0xFFFFFF
                                radius: 5
                                width: 12
                                height: 12
                    - obj:
                        width: 90
                        height: 32
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_evenly
                          flex_align_cross: center
                        widgets:
                          - label:
                              text: "Saver"
                              text_font: nunito_12
                              text_color: 0x888888
                          - switch:
                              id: settings_screensaver_enabled
                              width: 40
                              height: 20
                              bg_color: 0x3A4352
                              knob:
                                bg_color: white
                              indicator:
                                bg_color: 0x4CAF50
                              state:
                                checked: true

              # Theme selector - 3 themes
              - obj:
                  width: 100%
                  height: 46
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 5
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        text: "Theme"
                        text_font: nunito_14
                        text_color: 0xAAAAAA
                        width: 50
                    - obj:
                        width: 380
                        height: 34
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 4
                        widgets:
                          - button:
                              id: settings_btn_classic
                              width: 110
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Classic"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Classic"
                          - button:
                              id: settings_btn_modern
                              width: 110
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Modern"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Modern"
                          - button:
                              id: settings_btn_performance
                              width: 110
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "Perf"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: current_theme
                                    option: "Performance"

              # Rotation selector
              - obj:
                  width: 100%
                  height: 46
                  bg_color: 0x1E232E
                  bg_opa: cover
                  radius: 10
                  border_width: 0
                  pad_all: 5
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - label:
                        text: "Rotate"
                        text_font: nunito_14
                        text_color: 0xAAAAAA
                        width: 50
                    - obj:
                        width: 380
                        height: 34
                        bg_opa: transp
                        border_width: 0
                        pad_all: 0
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 4
                        widgets:
                          - button:
                              id: settings_btn_rot0
                              width: 70
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "0°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "0"
                          - button:
                              id: settings_btn_rot90
                              width: 70
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "90°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "90"
                          - button:
                              id: settings_btn_rot180
                              width: 70
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "180°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "180"
                          - button:
                              id: settings_btn_rot270
                              width: 70
                              height: 32
                              radius: 8
                              bg_color: 0x3A4352
                              border_width: 0
                              widgets:
                                - label:
                                    align: center
                                    text: "270°"
                                    text_font: nunito_14
                              on_click:
                                - select.set:
                                    id: display_rotation_select
                                    option: "270"

        - button:
            align: bottom_left
            x: 10
            y: -6
            width: 100
            height: 36
            radius: 10
            bg_color: 0xFF6600
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "Home"
                  text_font: nunito_18
                  text_color: white
            on_click:
              - lvgl.page.show: main_page

        - button:
            align: bottom_right
            x: -10
            y: -6
            width: 100
            height: 36
            radius: 10
            bg_color: 0x3A4352
            border_width: 0
            widgets:
              - label:
                  align: center
                  text: "Info"
                  text_font: nunito_18
                  text_color: white
            on_click:
              - lvgl.page.show: info_screen

number:
  - platform: lvgl
    id: day_brightness
    name: "Day Brightness"
    widget: settings_day_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_day_label
          text:
            format: "Day · %.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Day";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: evening_brightness
    name: "Evening Brightness"
    widget: settings_evening_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_evening_label
          text:
            format: "Eve · %.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Evening";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: night_brightness
    name: "Night Brightness"
    widget: settings_night_brightness
    trigger: on_release
    restore_value: true
    entity_category: config
    on_value:
      - lvgl.label.update:
          id: settings_night_label
          text:
            format: "Night · %.0f%%"
            args: [ x ]
      - if:
          condition:
            lambda: 'return id(brightness_mode).current_option() == "Night";'
          then:
            - script.execute: apply_display_brightness

  - platform: lvgl
    id: screen_timeout
    name: "Screen Timeout"
    widget: settings_screen_timeout
    trigger: on_release
    restore_value: true
    entity_category: config
    unit_of_measurement: s
    on_value:
      - lvgl.label.update:
          id: settings_timeout_label
          text:
            format: "Timeout · %.0fs"
            args: [ x ]

select:
  - platform: template
    id: brightness_mode
    name: "Brightness Mode"
    options: [Day, Evening, Night]
    initial_option: Day
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_brightness

  - platform: template
    id: current_theme
    name: "Theme"
    options: [Classic, Modern, Performance]
    initial_option: Classic
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_theme

  - platform: template
    id: display_rotation_select
    name: "Display Rotation"
    options: ["0", "90", "180", "270"]
    initial_option: "${display_rotation}"
    restore_value: true
    entity_category: config
    optimistic: true
    on_value:
      - script.execute: apply_display_rotation

switch:
  - platform: lvgl
    id: screensaver_enabled
    name: "Screensaver Enabled"
    widget: settings_screensaver_enabled
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
