---
# Example device entrypoint for the modular OspreyPi firmware.
# Copy this file to the repository root before compiling so shared asset and
# partition paths resolve correctly.

substitutions:
  device_name: "example-display"
  device_friendly_name: "Example Display"
  fallback_ap_ssid: "Example Display Setup"
  display_rotation: "0"
  display_rotation_index: "0"

  # Optional dashboard overrides:
  dashboard_button_1_text: "office"
  dashboard_button_1_entity: "light.office"
  dashboard_button_1_action: "light.toggle"
  dashboard_button_1_icon: "\U000F0335" # mdi-lightbulb

packages:
  display: !include esphome-modular-lvgl-buttons/common/display.yaml
  dashboard: !include esphome-modular-lvgl-buttons/dashboards/home.yaml

api:
  encryption:
    key: !secret api_encryption_key
